    what: >
      一条命令 python -m summarize auto --deploy 跑完全程：ssh 拉取各设备日志 → 本机
      daily export → merge --sync-all 逐天合并 → 补齐缺失或过期的周报 → 补齐缺失或过期的
      月报 → 一次性部署 → 释放常驻的 Ollama 模型。
    why: >
      手动跑要记住六个子命令和它们的顺序、还要自己判断哪些周/月需要重算。
      能放进 cron 的东西才会真的每天发生。
    expected: >
      开跑前的就绪检查不通过就直接退出、不做任何工作；缺失和过期的周/月报被识别并重算，
      已是最新的被跳过并打日志；中间各步用 GADGET_DEFER_HUGO_UPDATE=1 推迟 Hugo 构建，
      最后只跑一次部署；收尾释放显存（GADGET_KEEP_OLLAMA=1 可保留）。
    how: >
      tools/summarize/auto.py 的 cmd_auto 按固定顺序用 subprocess 驱动各子命令，
      _find_missing_weeks / _find_missing_months / _stale 决定要补哪些聚合报告，
      _unload_ollama 收尾。
    why_this_way: >
      各步之间用 subprocess 而不是直接 import，是因为每个子命令都是独立的 CLI 入口
      （tools/summarize/AGENTS.md：auto.py drives the subcommands via subprocess），
      失败一步不会污染同一个进程的状态；推迟 Hugo 构建到最后一次是为了避免每份报告都触发
      一次全站构建。
