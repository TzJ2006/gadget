  # ─────────────────────── 本地模型的可换性 ───────────────────────
  - id: I-051
    step: 报告质量与换模型
    name: "「这次该用哪个聊天模型」只由一个函数决定"
    status: todo
    needs: []
    what: >
      common/llm.py 里新增 resolve_chat_model()，把「本次调用该用哪个 Ollama tag」这件事
      收成一个函数，优先级为 OLLAMA_MODEL > OPENAI_MODEL > config 的 llm.chat_model >
      DEFAULT_OLLAMA_CHAT_MODEL。抽象名（sonnet/opus/haiku）继续被忽略——它们对 Ollama
      没有意义。原来的 _ollama_model 保留为 shim。
    why: >
      今天这件事散在两处：_ollama_model 只有两级 env 回退，根本没有 config 这一级；
      config 是靠 tools/summarize/config.py 的 _ENV_FROM_CONFIG 把 model 桥接成
      OLLAMA_MODEL 环境变量绕进来的。结果是「换个模型」要先知道这条桥的存在，
      而 common/ 自己读不到配置。上一次换模型（qwen3.6 → qwen3.8）牵出三个必修 bug，
      改动散在好几个文件——想对比几个本地模型谁写的日报更好，不该每次都是一次重构。
    expected: >
      四级优先级逐级生效，且 env 为空串时不会吃掉下一级；
      config 里只写 llm.chat_model（不设任何环境变量）就能改掉全局聊天模型；
      翻译那两个旋钮（GADGET_TRANSLATION_MODEL / OLLAMA_TRANSLATION_MODEL）
      既不被这个函数读取，也不被它改写——聊天和翻译仍是两个独立的开关。
    how: >
      照抄 common/translation/frontmatter.py:244 的 resolve_review_model() 的形状：
      先读 env（strip 后判空），再在函数体内 `from common.config import load_section`
      读 llm 段，最后落到模块常量。summarize 的老路径（apply_env_from_config 用
      setdefault 灌出 OLLAMA_MODEL）天然落在第 1 级，不需要为它单开一个回退级。
    why_this_way: >
      Web 调研的主流答案是上 pydantic-settings / dynaconf / confuse，这里不采纳：
      为了一个模型名引入依赖是纯负债，而且要重写 common/config.py 的整套 section 语义。
      本仓已经有一个能用且在用的三级回退惯例（resolve_review_model），抄它就是最短路径。
      load_section 用函数内局部 import 而不是模块顶层，同样是抄它——
      common/config.py 与 common/llm.py 互不在顶层依赖，这条不能破。
      优先级次序 CLI > env > file > default 与 AGENTS.md 已写明的解析规则一致，不新造。
    code:
      - file: common/llm.py
        symbol: resolve_chat_model
    verify:
      command: python -m pytest common/tests/test_llm_model.py
      pass: "exit 0"
    future: >
      有了唯一解析点，「今天用哪个模型」变成一个可观测、可打日志、可在报告里落款的值；
      日后想按任务类型分模型（长 merge 用大的、frontmatter 复核用小的）只是多一个参数。

  - id: I-052
    step: 报告质量与换模型
    name: "默认聊天模型换成 gemma4:26b，全仓只保留这一处硬编码的默认模型名"
    status: todo
    needs: [I-051]
    what: >
      DEFAULT_OLLAMA_CHAT_MODEL 从 qwen3.8:27b 改成 gemma4:26b；
      并让 common/translation/frontmatter.py 的 DEFAULT_REVIEW_MODEL 跟随聊天默认，
      删掉仓库里的第二个硬编码模型名。同步 config.example.json、
      docs/guides/summarize-local-llm.md、docs/ecl/gadget-features.yaml
      以及 common/tests/test_translation_review.py 里钉住 "qwen3.8" 的断言。
    why: >
      硬编码的 qwen3.8:27b 本机根本没 pull（ollama list 只有 qwen3.8-sum:latest），
      它一直被 config.json 的 summarize.model 盖住——换机器或 config 丢了就炸。
      更糟的是 DEFAULT_REVIEW_MODEL = "qwen3.8" 同样没 pull，所以 resolve_review_tag()
      每次都返回 None：frontmatter 复核目前是静默关闭的，没人知道。
      两个默认名各钉各的，就是「默认值会腐烂」的结构性原因。
    expected: >
      DEFAULT_OLLAMA_CHAT_MODEL == "gemma4:26b"；
      DEFAULT_REVIEW_MODEL 与聊天默认同源——改一个另一个跟着变，
      全仓 grep 不到第二个硬编码的聊天默认名；
      frontmatter 复核不再被静默跳过（resolve_review_tag 能解析出一个真实存在的 tag）。
    how: >
      翻常量，把 frontmatter 的常量改为从 common.llm 取值，然后把上面列出的
      文档 / 示例配置 / 测试断言一起改掉。测试断言面是这个节点里最琐碎的部分（6 处）。
    why_this_way: >
      选 gemma4:26b 而不是 gemma4:12b，是因为它已经在本机（18 GB，Q4_K_M，25.2B，
      256K 原生上下文），且实测跑通了 summarize 依赖的 json_schema 约束解码。
      实测还确认了一件本来最担心的事：仓库现有的 reasoning_effort=none 对 gemma4
      不但兼容而且必需——同一个 schema 请求，带 none 是 16.8s 合法 JSON 三字段齐全，
      省略它是 35.1s 且 content 为空（thinking 烧光预算）。这与 frontmatter.py:322
      早就写下的 qwen3.x 失败模式完全一致，所以换模型不需要动任何 reasoning 代码。
      网上 ollama#15540 报的「reasoning_effort=none 破坏 gemma4 schema」在本机这个
      build/量化上不复现，方向反而相反——所以按实测走，不按 issue 走。
      复核模型跟随聊天默认而不是各钉各的，正是「代码里再也找不到第二个硬编码默认名」；
      想给复核单独用小模型的人设 config 的 translation.review_model 即可，那一级本来就在。
    code:
      - file: common/llm.py
        symbol: DEFAULT_OLLAMA_CHAT_MODEL
      - file: common/translation/frontmatter.py
        symbol: DEFAULT_REVIEW_MODEL
    verify:
      command: python -m pytest common/tests/test_translation_review.py common/tests/test_llm_model.py
      pass: "exit 0"
    future: >
      默认名收成一个之后，再换下一个模型就只剩「改一行 + 跑一天日报肉眼对比」，
      而不是一次跨文件重构。这让「试一个新本地模型」变成一件便宜的事。

  - id: I-053
    step: 报告质量与换模型
    name: "模型没 pull 时立刻报错并列出可用 tag"
    status: todo
    needs: [I-051]
    what: >
      解析出聊天 tag 之后加一次 preflight：向本地 Ollama 要一次 /api/tags，
      要的模型不在里面就直接抛 RuntimeError，消息里带上请求名、ollama pull 提示
      和本机全部可用 tag。Ollama 不可达时**不拦**。
    why: >
      现在写错一个 tag 会一路走到 openai SDK 那层，跑到一半才炸出一个不知所云的错误。
      对「快速对比几个模型」这件事来说，这是最直接的摩擦——而默认值已经是一个
      没 pull 的 tag，所以这条路径不是假想，是当前状态。
    expected: >
      tag 列表里没有目标 → 抛 RuntimeError，消息含请求名、ollama pull、可用 tag 列表；
      有目标（含 bare 名匹配 :latest 的情况）→ 不抛；
      Ollama 不可达（_ollama_tags 返回 None）→ 不抛，交给现有的连接错误路径。
    how: >
      复用 common/engine/ollama.py 已有的 _ollama_tags；把 frontmatter.py 的
      _match_review_tag 提到 common/engine/ollama.py 作共享 helper（frontmatter 留
      re-export shim），报错文案照抄 OllamaEngine.load() 的那段。
      engine 的 import 放在函数体内——import common.engine.ollama 会触发
      common/engine/__init__.py（实测 85ms，拉进了 transformers 后端模块但没有 torch），
      而 common/llm.py 是到处都在 import 的模块，不该为此变慢。
    why_this_way: >
      三份 tag 探测代码已经存在两份（engine 的 _model_in_tags、frontmatter 的
      _match_review_tag），不该有第三份——所以是提取共享，不是新写。
      策略上刻意与复核路径不同：复核没 pull 就静默跳过（它是可选增强），
      聊天没 pull 必须炸（它是全部工作）。同一份探测代码，两种策略。
      「不可达时不拦」是为了不把「Ollama 服务没起」误报成「模型没 pull」——
      两个原因需要两种修法，混成一条消息会把人引到错的方向。
      提取时 frontmatter 侧留 shim，是因为 AGENTS.md 把「向后兼容 re-export shim
      必须存活」写成了硬规则。
    code:
      - file: common/llm.py
        symbol: _preflight_ollama_model
      - file: common/engine/ollama.py
        symbol: match_tag
    verify:
      command: python -m pytest common/tests/test_llm_model.py
      pass: "exit 0"
    future: >
      有了「本机有哪些 tag」这个已经被调用的探测点，日后想做「列出可选模型」
      或「自动降级到已 pull 的同族小模型」都只是换一个失败分支。

