version: 1
project: gadget
overview: >
  一个个人开发工具箱单仓：五个可独立使用的工具（summarize 对话日报、research 论文发现、
  benchmark 跑分、website Hugo 博客、translator 文档翻译器）共用一个 common/ 基础设施包
  （LLM 调用、JSON 修复、磁盘缓存、原子落盘、本地推理翻译、Hugo 发布）。分层是 hub-and-spoke：
  共享代码只放 common/，工具之间零 import，common/ 从不反向依赖 tools/。所有 LLM 与翻译默认
  跑在本机 Ollama 上（聊天 qwen3.8-27B，翻译 HY-MT2-1.8B），不需要任何云端 API key。
  产物统一落 outputs/，唯一例外是生成的站点内容直接写进 tools/website/content|static 并打
  gadget_generated 标记。开发工作流引擎与全部 skills 在同级独立仓库 ../ai-companion/。
  许可为 GPL-3。

endpoints: [I-025, I-016, I-032, I-043, I-050]

steps:
  - name: 共用底座
    blurb: 把读配置、安全写文件、缓存结果、调用大语言模型这四件每个工具都要做的事，做成所有工具共用的一套代码。
  - name: 本机翻译
    blurb: 在自己电脑的显卡上跑翻译模型，把文章翻成另一种语言，全程不把任何内容发给外部服务。
  - name: 博客自动发布
    blurb: 一条命令把新文章翻成中英两份、压好图片和视频、逐项检查，再构建并推送到公开网站上。
  - name: 每天的工作日报
    blurb: 自动收集多台电脑上跟各种人工智能助手的对话，汇总成当天的工作总结，再攒成周报和月报发到博客上。
  - name: 论文与硬件
    blurb: 自动去各大论文库找新论文、给学者画研究画像，并测出这台机器的实际算力，各自产出一份能点开看的报告。
  - name: 别人装上就能用
    blurb: 让任何人把这个仓库下载下来、装一次就能单独使用其中任何一个工具，不需要作者本人的机器和账号。
  - name: 报告质量与换模型
    blurb: 先定下报告好不好的评分标准再重写生成报告的措辞，并把「这次用哪个本地模型」收成一处随时可改的开关。

ideas:
  # ─────────────────────────── 基础设施 ───────────────────────────
  - id: I-001
    step: 共用底座
    name: "全部配置只放在仓库根的一个 config.json 里"
    status: done
    needs: []
    what: >
      所有工具的运行期配置只有一个来源：仓库根 config.json，按 summarize / research /
      research_scout / sync / translator / translation 分节；路径可用 GADGET_CONFIG 覆盖。
      取值顺序固定为 CLI flag > 环境变量 > 该节 > 硬编码默认值。
    why: >
      配置曾散落在 ~/.config/<tool>/ 和 tools/<tool>/config.json 里，同一个键在两处不一致时
      没人知道哪个生效，跨设备同步也无从下手。
    expected: >
      删掉 ~/.config 下的旧文件后所有工具仍按仓库根 config.json 正常工作；
      load_section("summarize") 与 load_section("research") 互不干扰；改完 config.json
      不重启进程也能通过 clear_cache() 生效。
    how: >
      common/config.py 提供 resolve_config_path / load_root_config / load_section /
      update_section，带进程内缓存；各工具的 config.py 只在这之上做 CLI-flag 与 env 的覆盖层。
    why_this_way: >
      AGENTS.md 把「repo-root config.json only，无 ~/.config 回退」写成了硬规则——单文件
      可以整份 rclone 同步到别的机器，多份分散的配置不行。
    code:
      - file: common/config.py
        symbol: load_root_config
        lines: "54-77"
      - file: common/config.py
        symbol: load_section
        lines: "78-84"
      - file: common/config.py
        symbol: resolve_config_path
        lines: "39-46"
    verify:
      command: python -m pytest common/tests/test_config.py
      pass: "exit 0"
    future: >
      新工具只要加一个节就接进同一套解析顺序，不用自己发明配置查找。

  - id: I-002
    step: 共用底座
    name: "写文件不会留下半截、重跑能直接用上次的缓存"
    status: done
    needs: []
    what: >
      一层最小的持久化原语：atomic_write（先写临时文件再替换）、content_hash（内容指纹）、
      以及带命名空间和 TTL 的 SHA-256 磁盘缓存 DiskCache。
    why: >
      这些流水线里每一步都可能被 Ctrl-C、超时或断网打断。没有原子写就会留下半截 JSON 让下一次
      运行解析失败；没有内容缓存，一次重跑就要重新烧掉几十分钟的 LLM 时间。
    expected: >
      进程在写入中途被杀，目标文件要么是旧内容要么是新内容，不会是半截；同一份输入第二次跑时
      直接命中缓存、不再发起远端调用；非 ASCII 内容 roundtrip 不损坏。
    how: >
      common/io.py 用 tempfile + os.replace 做原子替换；common/cache.py 把 key 做 SHA-256
      后按命名空间分目录存 JSON，读时检查 TTL。
    why_this_way: null
    code:
      - file: common/io.py
        symbol: atomic_write
        lines: "11-27"
      - file: common/io.py
        symbol: content_hash
        lines: "28-32"
      - file: common/cache.py
        symbol: DiskCache
        lines: "13-69"
    verify:
      command: python -m pytest common/tests/test_cache.py
      pass: "exit 0"
    future: >
      任何新的「贵调用」都可以直接挂上 DiskCache，不用各自发明缓存目录。

  - id: I-003
    step: 共用底座
    name: "四种 LLM 后端用同一个开关切换"
    status: done
    needs: [I-001]
    what: >
      一个统一的 LLM 调用层：ollama（默认，本地无 key）/ anthropic / openai / claude_cli
      四个后端，通过 --api 或 GADGET_LLM_BACKEND 整仓统一切换；分两档 API——call_llm_raw
      要纯文本，call_llm 要结构化 JSON。
    why: >
      五个工具都要调 LLM。如果每个工具各自 import provider SDK，换后端就得改五处，而且本地跑
      和云端跑的差异会渗进业务代码。
    expected: >
      同一条命令加 --api ollama 与 --api anthropic 都能跑通且产出同形状的结果；传一个不在
      LLM_BACKENDS 里的后端名会抛 ValueError 并列出合法集合，而不是静默走 claude_cli。
    how: >
      common/llm.py 定义 LLM_BACKENDS 常量与 LLMCallConfig，call_llm_raw / call_llm 按名字
      分派到 _raw_* / call_* 实现；ollama 与 openai 共用 OpenAI 协议核心，只在 base_url、
      模型名、是否要 key 上不同。
    why_this_way: >
      docs/reports/phase0-baseline.md 的 Phase 2 记录了这个决定：原来的 `else → claude_cli`
      静默兜底会把拼错的后端名变成一次莫名其妙的云端调用，改成显式 ValueError；同时明确否决了
      「注册表 dict-of-callables」——四个条目用不着那层间接。
    code:
      - file: common/llm.py
        symbol: LLM_BACKENDS
        lines: "53-63"
      - file: common/llm.py
        symbol: call_llm_raw
        lines: "223-245"
      - file: common/llm.py
        symbol: call_llm
        lines: "414-429"
    verify:
      command: python -m pytest common/tests/test_dispatch.py
      pass: "exit 0"
    future: >
      再接一个后端只需加一个 call_* 实现并进 LLM_BACKENDS，所有工具立刻可用。

  - id: I-004
    step: 共用底座
    name: "让本地小模型稳定吐出报告结构"
    status: done
    needs: [I-003]
    what: >
      对 ollama 后端把调用方原有的 Anthropic tool schema 转成 response_format 的 json_schema
      做约束解码，并把所有顶层属性提升为 required；解析端配一条 JSON 修复阶梯（try_parse →
      修引号 → 交给 LLM 重排）。
    why: >
      本地 27B 模型在纯 json_object 模式下有一半的概率把 daily_overview 的内容当成整份报告返回：
      JSON 合法、层级错一层，其余段落全空。云端模型不会，本地模型会——这是切到本地推理必须付的代价。
    expected: >
      同一条 prompt 下，json_schema + 全 required 产出 5,093–6,460 字符、填满 9 段中的 8–9 段；
      而原 required 只产出 434 字符 3 段，无约束产出 5,677 字符 7 段（docs/guides/summarize-local-llm.md
      实测表）。提升 required 不得就地改动调用方传入的 schema 对象。
    how: >
      common/llm.py 的 _schema_from_tools 把 tool schema 拷一份并覆盖 required 为全部属性，
      _chat_json 在 ollama 路径带上它；common/json_utils.py 负责解析失败后的逐级修复。
    why_this_way: >
      docs/guides/summarize-local-llm.md「Schema-constrained decoding」一节写明：约束解码会让
      模型只吐声明为 required 的字段就停手，所以必须全 required；而 call_openai 故意留在
      json_object——云端 json_schema 是 strict-only，会直接拒掉这些 schema，且云端模型本来就听 prompt。
    code:
      - file: common/llm.py
        symbol: _schema_from_tools
        lines: "166-189"
      - file: common/llm.py
        symbol: _chat_json
        lines: "190-222"
      - file: common/json_utils.py
        symbol: repair_json_with_llm
        lines: "157-198"
    verify:
      command: python -m pytest common/tests/test_llm_schema.py
      pass: "exit 0"
    future: >
      任何新的结构化输出（研究报告、评审共识）都能复用同一条约束+修复链，不必各自写容错。

  - id: I-005
    step: 共用底座
    name: "超长输入切成块分别摘要、再合并成一份"
    status: done
    needs: [I-002, I-003]
    what: >
      把远超上下文窗口的输入切成块、逐块摘要、再把块摘要归并成一份；每块结果按内容哈希落缓存，
      单块超时抛 ChunkTimeoutError 而不是拖垮整轮。
    why: >
      一天四台设备的对话日志能到 47 万字符 / 18 万 token，一次塞不进任何窗口；而且中途失败
      如果不缓存已完成的块，重试就是从零开始。
    expected: >
      15 段对话 / 1469 条消息 / 472,328 字符会被切成 4 块 + 1 次归并共 5 次调用；解析失败的块
      不会被写进缓存，也不会污染归并结果；全部块都失败时显式抛错而不是产出空报告。
    how: >
      common/llm.py 的 chunk_text 按字符预算（默认 150,000）切分，timed_llm_call 带计时与超时，
      load_chunk_cache / save_chunk_cache 以块内容哈希为键，hierarchical_merge 把块结果两两归并。
    why_this_way: >
      docs/guides/summarize-local-llm.md 给了 max_chars=150,000 的来历：对这类开发日志约等于
      每块 ~40k token，加上 prompt 与输出仍留在 num_ctx 65536 之内。缓存拒绝存 parse_error
      是因为一次坏结果会被后续每次重跑复用，比不缓存更糟。
    code:
      - file: common/llm.py
        symbol: chunk_text
        lines: "444-457"
      - file: common/llm.py
        symbol: save_chunk_cache
        lines: "501-516"
      - file: common/llm.py
        symbol: hierarchical_merge
        lines: "525-596"
    verify:
      command: python -m pytest tools/summarize/tests/test_offschema.py
      pass: "exit 0"
    future: >
      周报、月报、论文批量筛选都走同一条分块-归并链，只换 prompt。

  # ─────────────────────────── 本地翻译 ───────────────────────────
  - id: I-006
    step: 本机翻译
    name: "本地翻译引擎按本机装了什么自动选推理后端"
    status: done
    needs: [I-001]
    what: >
      一个 TranslationEngine 抽象加四个实现（Ollama / vLLM / llama.cpp GGUF / transformers），
      由 create_engine() 按「本机有什么」自动挑，GADGET_TRANSLATION_BACKEND 可强制指定；
      引擎按 (backend, model_id) 缓存复用。
    why: >
      站点双语化要翻上百个页面。走云端翻译 API 意味着把整站内容和每次改动都发出去，还要按量付费；
      而不同机器上装的推理栈完全不同（Windows 有 transformers，Linux 有 vLLM，低显存机器只有 GGUF）。
    expected: >
      本机 Ollama 已 pull 了 HY-MT2 时自动选 OllamaEngine；换了非默认模型时不再自动走 Ollama；
      设置一个不在合法集合里的后端名会抛 ValueError；同一 model_id 在后端环境变量变化后不会
      错拿到上一个后端的引擎实例。
    how: >
      common/engine/__init__.py 的 create_engine 先看环境变量强制项，再按可用性优选 Ollama，
      否则回落到 llamacpp / vllm / transformers，返回一个 _CachedEngineProxy。
    why_this_way: >
      docs/guides/summarize-local-llm.md 说明优选 Ollama 的理由是「no extra process VRAM，
      不需要 PyTorch / llama-cpp」——复用已经为聊天模型跑着的那个服务；
      docs/reports/phase0-baseline.md 的 Phase 4 记录缓存键从 model_id 改成 (backend, model_id)
      的原因：后端环境变量中途变化时旧键会返回错后端的引擎。
    code:
      - file: common/engine/__init__.py
        symbol: create_engine
        lines: "69-138"
      - file: common/engine/__init__.py
        symbol: _CachedEngineProxy
        lines: "49-65"
    verify:
      command: python -m pytest common/tests/test_engine_ollama.py -k factory
      pass: "exit 0"
    future: >
      translator GUI、website 批量翻译、summarize 双语发布共用同一个引擎实例，模型只加载一次。

  - id: I-007
    step: 本机翻译
    name: "翻译时保住代码和链接不被改动、按语言挑切块大小"
    status: done
    needs: [I-006]
    what: >
      翻译前把代码块、URL、Hugo shortcode 等替换成 [[[HYMTPH_n]]] 占位符，翻完再还原；
      切块时按语言用不同上限（中文 5000 字符 / 英文 7000），并对没有标点的长行做硬切。
    why: >
      翻译模型会「顺手」翻译代码里的标识符和链接，一次就能把一篇技术文章改烂；
      而中文字符的 token 密度远高于英文，用同一个字符上限切块，中文块会超出模型窗口。
    expected: >
      含代码块的文档翻完后代码逐字不变、占位符全部还原（还原正则容忍模型把 [[[ 写成 [[）；
      中文正文按 5000 上限切、英文按 7000 切，切开再拼回与原文一致；一整行没有标点的中文
      也能被切开而不是整块超限。
    how: >
      common/translation/protect.py 的 protect_fragments / restore_fragments 做替换与还原，
      chunk_ceiling 按 CJK 比例决定上限，split_large_text 逐级降级到 _hard_split。
    why_this_way: >
      占位符还原用的是容忍 2–3 个方括号的正则，因为模型会改写括号数量——严格匹配等于把
      还原失败率交给模型的手感。
    code:
      - file: common/translation/protect.py
        symbol: protect_fragments
        lines: "62-83"
      - file: common/translation/protect.py
        symbol: chunk_ceiling
        lines: "213-223"
      - file: common/translation/protect.py
        symbol: split_large_text
        lines: "132-203"
    verify:
      command: python -m pytest common/tests/test_translation_chunking.py
      pass: "exit 0"
    future: >
      同一套保护规则被 translator GUI 与站点批量翻译共用，新增一类需要保护的片段只改一处正则。

  - id: I-008
    step: 本机翻译
    name: "翻译模型与聊天模型共驻一块显卡"
    status: done
    needs: [I-006]
    what: >
      OllamaEngine 直接打 /api/generate 并自带手写的 HY-MT2 prompt 模板，把翻译模型的
      num_ctx 压到 8192、默认 4 路并发、每次请求带 keep_alive，让它和 27B 聊天模型同时常驻显存。
    why: >
      一台 32GB 的 5090 要同时服务「总结」和「翻译」。默认配置下两个模型互相驱逐，
      每次 summarize↔translate 切换要付约 10 秒的卸载+重载。
    expected: >
      ollama ps 显示两个模型同时驻留、100% GPU；翻译模型约 3.6GB；并发批量翻译相对串行
      约 2.2× 的墙钟加速，且返回顺序与提交顺序一致；超长 prompt 会临时抬高 num_ctx 而不是被截断。
    how: >
      common/engine/ollama.py 里 _HY_TEMPLATE 手工拼 prompt 走原生 generate 接口，
      generate_batch 用线程池按 GADGET_TRANSLATION_CONCURRENCY 并发，free_ollama_vram 在
      流水线收尾时释放（GADGET_KEEP_OLLAMA=1 可跳过）。
    why_this_way: >
      走原生 /api/generate 而不是 /api/chat，是因为 Ollama 为 HY-MT2 自动推导的 chat 模板是坏的；
      num_ctx 8192 的数字来自 docs/guides/summarize-local-llm.md：这是让 HY-MT2 停在 ~3.6GB
      从而与聊天模型共驻的上限，代价是中文块要卡在 5000 字符以内。
    code:
      - file: common/engine/ollama.py
        symbol: OllamaEngine
        lines: "114-252"
      - file: common/engine/ollama.py
        symbol: free_ollama_vram
        lines: "65-113"
    verify:
      command: python -m pytest common/tests/test_engine_ollama.py
      pass: "exit 0"
    future: >
      同一块卡上再加第三个小模型（如 OCR）只需要重新分配 num_ctx 预算。

  - id: I-009
    step: 本机翻译
    name: "翻译结果落盘前先检查：拦下原样返回和语言不对的输出"
    status: done
    needs: [I-007]
    what: >
      翻译结果落盘前先过校验：长度不足原文 15% 判失败、输出与输入几乎相同（模型回声）判失败、
      正文仍是源语言判失败；判定只看正文散文，跳过代码与内嵌 HTML。
    why: >
      2026-08-04 的排查发现：模型偶尔原样回吐输入，而当时的校验只看长度，于是中文原文被当成
      英文页写了出去，还盖上了 src-hash 标记——之后每次部署都跳过它。九篇日报因此中英文逐字相同。
    expected: >
      原样回吐输入的输出被拒；英文页里出现中文标题被拒；中文页里保留英文专有名词不被误判；
      正文被大段代码/CSS 稀释时判定仍然正确（旧的整篇 CJK 比例做法会稀释到 0.002 而放行）。
    how: >
      common/translation/document.py 的 validate_translated_output 接收 target_lang 并串联
      三项检查；common/translation/protect.py 的 wrong_language 只在散文长度超过 _PROSE_MIN
      时才判定；scripts/language.py 的站点审计复用同一个 helper。
    why_this_way: >
      提交 d937dff 记录了原因：raw CJK ratio over the whole body 被内嵌 usage-card 的 CSS/HTML
      稀释，九篇全中文的英文报告被读成「fine」还反过来标成 zh_low_cjk 冤枉了中文文件；
      改成 prose-only 判定后才对得上。
    code:
      - file: common/translation/document.py
        symbol: validate_translated_output
        lines: "67-99"
      - file: common/translation/protect.py
        symbol: wrong_language
        lines: "240-250"
