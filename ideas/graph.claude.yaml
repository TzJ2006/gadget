    status: done
    needs: [I-004, I-005, I-026]
    what: >
      检索到的论文过三道：快速筛选（相关性/动机/创新点）→ 深度评估（打 composite score =
      0.4 相关 + 0.3 影响 + 0.3 新颖）→ 引用影响分析。每一道的结果都缓存，但缓存前先检查
