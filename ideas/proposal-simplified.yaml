  # ─────────────────────────── 取素材 ───────────────────────────
  - id: I-065
    step: 取素材
    name: "把五种 AI 工具的对话记录和 token 用量，抽成同一种形状的素材"
    status: doing
    needs: [I-061]
    what: >
      从本机各个 AI 命令行工具的历史里按日期抽出对话——Claude Code、Codex、Cursor、
      ChatGPT 导出、通用 JSON——同时通过 ccusage 逐个来源抓 token 用量，
      两样都归一成同一种素材形状（带设备名、日期、来源）；也能反向枚举本机哪些天有记录。
    why: >
      原料散在五种互不相同的私有格式里，路径还随操作系统变（含 WSL 下读 Windows 侧）；
      token 用量那一侧，ccusage 20.x 的统一报表把所有来源压成一个合并块，拆不出各来源的数。
      不先统一成一种形状，后面每一步都要处理五种分支。
    expected: >
      给定日期能从多个项目目录里合并出对话；Cursor 的子 agent 记录被剔除；
      时间戳缺失时回落到文件修改时间；目录不存在时返回空而不是抛错；
      单个来源的用量抓取失败只跳过它、不影响其余来源。
    how: >
      tools/summarize/parsers.py 每种来源一个 parse_*，由 collect_conversations 汇总；
      tools/summarize/usage.py 逐源命名空间抓取并归一。两者产出同一种素材记录。
      两处顺手的收拢：discover_all_dates（parsers.py:202-297）今天是对同样三棵目录树的
      **第二次完整遍历 + 第二次时间戳解析**——改成走一遍返回 {日期: [对话]}，
      「有哪些天」就是它的键；以及 _ensure_ccusage_global（usage.py:112-140）
      今天会**静默在用户机器上跑 npm install -g ccusage@latest** 再静默回落到 npx，
      改成一条说清「请运行哪条命令」的报错——装全局包不该是一次日报生成的副作用。
    why_this_way: >
      五个 parse_* 函数是真实边界上的真实差异，不是抽象过度——这是全仓唯一一处
      「每个来源一个函数」站得住的地方，因为五种格式确实互不相同。
      不为它们造注册表或插件层：collect_conversations 里一个列表就够。
    code:
      - file: tools/summarize/parsers.py
        symbol: collect_conversations
      - file: tools/summarize/usage.py
        symbol: fetch_source_usage
    verify:
      command: python -m pytest tools/summarize/tests/test_parsers.py tools/summarize/tests/test_usage.py
      pass: "exit 0"
    future: >
      接一个新的 AI 命令行工具只要加一个 parse_* 并挂上；ccusage 支持的新 agent
      会自动出现在报表里。
    log:
      - date: "2026-09-12"
        by: ccthink
        note: "合并自 I-017 与 I-021 —— 两者都是「把一种外部记录变成素材」，归一成同一种形状。"

  - id: I-066
    step: 取素材
    name: "从三个论文库检索新论文、排除已经看过的；一句自然语言也能变成同一份检索条件"
    status: doing
    needs: [I-061, I-062]
    what: >
      按项目关键词从 arXiv / bioRxiv / PubMed 检索近期论文，支持按会议、按作者；
      结果按（项目，日期，来源）缓存并排除该项目已见过的论文编号。
      一句自然语言（"找某人最近的机器人操作论文"）经一次模型调用变成同一份检索条件，
      校验通过后走完全相同的检索路径——它是同一个函数的另一种填参方式，不是另一条流水线。
    why: >
      每天重检索同一批关键词会把上周读过的论文再推一遍；而记住各子命令的参数形状有成本，
      不同问题也天然对应不同来源（生物问题不该去 arXiv 找）。
    expected: >
      缓存命中时不发起网络请求；硬失败不写缓存、真空结果才写；已知编号不再出现；
      自然语言解析不出来时给出可读的失败原因，而不是空跑一次检索；
      同一句话解析出的检索条件与手写参数走同一个 search_source。
    how: >
      收成一个 collect_papers(项目, 检索条件)，检索条件是
      {多源关键词 | 按作者 | 按会议} 三者之一——今天这段「会议/作者/多源 + 缓存」
      的分支**写了三遍**（cli.py:134-214 的 cmd_search、cli.py:363-391 的 cmd_report、
      ask.py:208-243 的 route_search），而且**已经漂移**：
