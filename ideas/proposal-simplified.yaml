  # ─────────────── 翻成两种语言并发到站上 ───────────────
  - id: I-073
    step: 翻成两种语言并发到站上
    name: "翻译时保住代码和链接，翻完校验语言，成对写出并把源内容指纹盖在文件里"
    status: doing
    needs: [I-062, I-063]
    what: >
      一个 write_bilingual(源内容, 落点) 管完整条：把代码块、链接、站点短代码换成占位符，
      按语言选切块上限（中文 5000 字符、英文 7000）切开，调本地翻译模型，
      还原占位符，再过三道校验（长度不足原文一成五、输出与输入几乎相同、正文仍是源语言，
      判定只看散文、跳过代码与内嵌 HTML），通过了才写出 foo.md 与 foo.zh.md 一对、
      各自盖上源内容指纹。标题与标签只往英文方向翻，由那条确定性的单向闸门保证
      （不再额外跑一次模型复查，理由见下）。
      失败重试三次，仍失败则记进失败日志且不盖指纹——下次会重试。
      哪一侧变了由指纹回答，不再另存一份同步状态文件；指纹里除了源内容哈希还带上
      「配方版本」（标记版本 + 翻译模型 tag + 措辞版本），这样换模型或改措辞会自己失效，
      不必有人去手改源码里的版本号。语言判定全仓只留一个（common 的 wrong_language，
      只看散文、剥掉被保护的片段），所有入口都调它。
    why: >
      今天这条链被拆成五个想法、四个文件，而且有两个各自记账的状态：
      文件里的指纹和 translate_site_batch.py 的 .translation_state.json。
      两者不一致时没人判断得了哪个是对的。
      另有三处同形状的散落：「这段文字是不是该有的语言」有**四个判定实现**，
      而让判定变正确的那次修改（只看散文、别被 CSS 稀释）只落进了其中两个；
      指纹的唯一失效办法是有人去手改 bilingual.py:25 的 _MARKER_VERSION
      （force=True 刻意**不**重译，docstring 写明了），所以 I-072 换措辞之后
      需要一个人改源码才叫得动整站重译；
      而 frontmatter 的模型复核那条，为了把模型名和 reasoning 设置绕过
      「会丢掉 model 参数」的解析器，在调用前后改了一次进程环境变量。
      2026-08-04 的事故正是这一类：
      模型原样回吐输入、当时的校验只看长度，于是中文原文被当成英文页写出去还盖上了指纹，
      之后每次部署都跳过它，九篇日报中英文逐字相同。
      另外站点审计那条（scripts/language.py）与这里用的是同一个判定函数，
      说明判定本身已经是共享的，只有记账没收拢。
    expected: >
      源内容不变时第二次运行不发起任何推理；变了两份都重译；
      翻译失败时不盖指纹、下次会重试；中译英失败时绝不把中文内容写到英文路径上；
      含代码块的文档翻完后代码逐字不变；英文页的标题与标签全为英文，
      而中文页上原本是英文的标签一字不动；.translation_state.json 不再存在。
    how: >
      common/bilingual.py 作为唯一入口，内部依次调 common/translation/ 下的
      protect / document / frontmatter；tools/website/translate_site_batch.py 瘦成
      「扫出成对文件、逐对调 write_bilingual」，删掉 plan_pair 与状态文件那一套。
    why_this_way: >
      判定放在「结果落盘之前」而不是「模型返回之后」，是因为它判的是结果、
      不关心是谁产生的——站点批量翻译、日报发布、翻译网页三个入口共用同一道闸门。
      标签单向翻译是刻意的：中文页共用英文标签体系，逐页翻译会把一个标签裂成若干近义词。
      指纹带版本号，是因为被坏翻译冻住的页面必须能一次性失效；把版本号换成「配方版本」，
      是因为手改源码才能失效这件事会在换模型那一轮直接咬人。
      **删掉 frontmatter 的模型复核那一条，是本节点唯一一处删能力，理由摆在这里供你否决：**
      真正保证「英文页标题标签是英文」的是那条确定性的单向闸门 _gate_english，不是复核；
      复核每有 frontmatter 的页面就多一次模型调用，还要改一次进程环境变量才能把模型名传进去；
      而它的默认模型长期没 pull、于是长期静默关闭——**没有人发现**，这本身就是它
      没在交付什么的证据。如果你认为它值得留，它可以留，代价是上面那两样都得留着。
    code:
      - file: common/bilingual.py
        symbol: write_bilingual
      - file: common/translation/document.py
        symbol: validate_translated_output
    verify:
      command: python -m pytest common/tests/test_bilingual_skip.py common/tests/test_translation_language.py common/tests/test_translation_chunking.py common/tests/test_translation_review.py
      pass: "exit 0"
    future: >
      任何要发双语的新内容类型只调这一个函数，就自动获得跳过、重试、校验与失败日志；
      扩到第三种语言只要再定义一个文件名形状。
    log:
      - date: "2026-09-12"
        by: ccthink
        note: >
          合并自 I-007、I-009、I-010、I-011、I-014。
          I-014 的 .translation_state.json 被删掉：它与文件里的指纹回答的是同一个问题。

  - id: I-074
    step: 翻成两种语言并发到站上
    name: "写进站点内容树只有一道门：生成的盖标记，人写的一律拒绝"
    status: done
    needs: [I-062]
    what: >
      所有生成的站点内容都经同一个函数写进 tools/website/content|static，
      每个文件盖 gadget_generated: true。写入前先判归属：目标路径上是没有标记的人写文件
      就抛错停下；强制覆盖前先备份并记一笔账。归属只认文件里的标记，不认目录约定。
    why: >
      生成内容和手写文章住在同一棵内容树里，而那棵树是不进版本库的——
      一次路径写错就能悄悄把一篇手写博客替换成自动日报，覆盖了找不回来。
    expected: >
      写生成文件成功且带标记；同路径已有生成文件可直接覆盖；
      同路径是人写文件则抛错；即使在生成目录里，显式标了人写的文件也拦得住；
      强制覆盖会在 outputs/backups/ 留一份，内容完全相同则不产生多余备份。
    how: >
      common/site_staging.py 与 common/website_backup.py 合成一份 common/site.py
      （两者一共 293 行，且只被彼此和落站调用），对外只露 write_site_content /
      copy_site_static 两个函数。另外三件事要一起做：
      （一）归属只认文件里的 gadget_generated 标记，只经 classify_file 一个入口读；
      tools/website/generated_paths.py 降级成纯性能捷径（省去读几千个文件），
      由 publish / preflight / translate_site_batch **统一 import** 并用同一套匹配语义
      ——今天三个消费者三种语义，而 publish.py:128-135 还额外按文件名匹配，
      所以任何子目录下叫 benchmark.md 的文件都被当成生成物，publish.py:49-55 更是
      干脆把那两个元组复制了一遍；
      （二）删掉 _append_manifest / record_blocked 那本账——强制覆盖留一份带时间戳的副本
      到 outputs/backups/ 就够，账本没有第二个读者；
      （三）标记只留 gadget_generated: true 一种拼写（今天有三种），
      src-hash 只负责跳过。
    why_this_way: >
      只认标记不认目录，因为目录会被人挪；两份文件合成一份，因为「判归属」和「落盘」
      是同一个动作的两半，分两个模块意味着每次新增一种产物要读两份代码。
      「这个文件是不是我们的、能不能动」今天被回答了五次（标记分类 + 三种路径匹配语义
      + publish 自己复制的那份），这是本轮最典型的一处——不同答案之间的分歧已经
      造成了实际后果：预检与发布对「子目录里的 benchmark.md 算不算生成物」判断不同。
      降级路径清单而不是删掉它，是因为它确实省了读几千个文件的时间——它只是不该是答案。
    code:
      - file: common/site.py
        symbol: write_site_content
      - file: common/site.py
        symbol: classify_file
    verify:
      command: python -m pytest common/tests/test_site_ownership.py
      pass: "exit 0"
    future: >
      新的生成器（新报告种类、新图表页）接进来就自动继承这套归属与备份保护，
      站点侧不区分它来自哪个工具。
    log:
      - date: "2026-09-12"
        by: ccthink
        note: "原样保留 I-012 的能力；只把 site_staging.py 与 website_backup.py 两份文件并成一份。"

  - id: I-075
    step: 翻成两种语言并发到站上
    name: "一条发布链：补齐双语对 → 压改动过的媒体 → 预检 → 构建 → 推送，预检阻断就停"
    status: doing
    needs: [I-073, I-074]
    what: >
      一条固定顺序的发布链：先把内容树里缺的那一侧补齐，再压缩内容哈希变了的图片与视频
      （图片走 pngquant、视频走 HandBrakeCLI，并发跑），再跑预检，
      再清空并构建 Hugo，最后提交推送部署仓。预检五项分三档：
      frontmatter 不合法是阻断级（页面构建不出来），未压缩图片与失效链接是警告级（不挡发布），
      缺双语对与正文语言不对是可修级（就地补）。阻断级出现就中止，不产出半成品站点。
    why: >
      发布一次要按顺序做五件事，任何一步顺序错了结果就不对（先构建后压图等于发布了未压缩的图）；
      而 Hugo 会把问题原样构建出去，等发现时错误内容已经在公开站点上，
      部署仓是独立的 git 仓库、回滚要跨仓操作。
      这一步今天最具体的两个毛病都来自「同一件事做了两遍」：
      （一）预检的可修档（preflight_check.py:309-351）是补齐双语对的**第二份实现**，
      而第一份（translate_site_batch 的 plan_pair，publish.py 第 1 步）四步之前刚跑过；
      第二份还不写状态文件，所以它补出来的那一对下一轮会被当成没翻过再翻一遍。
      （二）三档分级里的警告档其实是空转：preflight_check.py:487 返回
      「有警告就 2、否则 0」，而 publish.py:359-362 只区分退出码 1——
      所以退出码 2 和 0 完全等价，「警告」这一档除了打印字以外对流水线没有任何影响。
      三档 tier、Issue.level 字段和退出码 2 可以一起删掉。
      另外增量判据是 .last_build 的时间戳，而且这个判据实现了两遍
      （publish._newer_files 与 preflight.find_modified_files），两份对「生成文件算不算」
      的判断还不一致；「这个文件是不是生成的」也有两套答案——一套查路径清单
      （preflight_check.py:73-81），一套查文件里的标记（translate_site_batch.py:169-175），
      而 publish.py:128-135 那份还额外按文件名匹配，所以任何叫 benchmark.md 的文件
      不管在哪都被当成生成物。顺带说清一件图上没有记的事：Hugo 构建本身是全量的——
      public/ 每轮都清空重建，所以上面这些增量判据省的只是翻译和压缩的时间，不是构建的时间。
    expected: >
      预检出现阻断级问题时整条链中止、public/ 不被改动；
      只有警告时继续构建；两次连续发布之间没有新增媒体时压缩步骤零工作量；
      跑完后部署仓里是新构建的站点并已推送；.last_build 文件不再存在。
    how: >
      tools/website/publish.py 的 main 顺序调用各步，每步带计时；
      update.sh 与 update.ps1 仍然只是选好解释器再调它。四处具体的改法：
      （一）改动集合在 publish.py 里**只算一次**，用参数传给预检——今天
      publish._newer_files 与 preflight.find_modified_files 各算一遍，
      而且两份对「生成物算不算」的判断还不一致；
      （二）第 1 步的翻译与第 5 步的预检从子进程改成进程内函数调用：
      引擎缓存是按进程的，所以今天只要预检动了手就要第二次加载翻译模型；
      压缩也从「每个文件一个子进程」改成函数调用（大批量媒体今天会 fork 上百个进程）；
      （三）压缩成功后立刻记下已压路径，而不是等推送成功才前移时间边界——
      今天在预检中止或构建失败之后重跑，会对已经压过的图片**再有损压一次**，
      画质逐次退化；
      （四）预检只留两种结果：会让 Hugo 构建出坏页面的（frontmatter 解析不了、缺 title）
      退 1 中止，其余打印一行退 0。
    why_this_way: >
      顺序与判据收进一份 Python 而不是两份 shell 脚本，是因为两个平台各写一份
      就会各错一次。预检的分档理由是「会不会让页面构建不出来」，不是严重程度的主观排序。
      预检只碰手写内容：自动修一个生成文件会让它和自己的指纹失去同步，
      下次又被当成变了而重译。
    code:
      - file: tools/website/publish.py
        symbol: main
      - file: tools/website/preflight_check.py
        symbol: main
    verify:
      command: python -m pytest tools/website/tests
      pass: "exit 0"
    future: >
      任何新的内容生成器只要把文件写进内容树，就自动被这条链翻译、压缩、检查、发布。
    log:
      - date: "2026-09-12"
        by: ccthink
        note: >
          合并自 I-013、I-015、I-016、I-024 的部署那一半。
          原来的八步缩到五步：预翻译并进补齐双语对，更新时间戳随 .last_build 一起删掉。

  - id: I-076
    step: 翻成两种语言并发到站上
    name: "侧门：一个本地网页，贴文字或传文件当场翻完"
    status: done
    needs: [I-073]
    what: >
      一个本地网页：贴文字或传文件（md / txt / pdf / docx / 图片）翻译并保留 Markdown 结构，
      PDF 与图片走文字识别，docx 用标准库解压读 XML；源语言选自动时按中文字符比例判断，
      目标选自动时在中英之间翻转；模型常驻内存。它只调第四步的翻译核心，
      不经过取素材、理解、成稿、落站、发布中的任何一步。
    why: >
      不是所有需要翻译的东西都在站点里。一份要读的 PDF、一段要发的文字，
      也应该能用同一个本地模型翻，而不用把内容发去云端。它也是调试翻译质量最快的入口。
    expected: >
      空输入不触发任何推理；docx 走标准库而不是文字识别管线；
      文字识别子进程失败时抛出可读的错误而不是让界面卡死；
      它与站点批量翻译用的是同一份翻译核心——改一处两边同时生效。
    how: >
      tools/translator/core.py 负责语言判定、文件转 Markdown 与调翻译，
      app.py 用 Gradio 接线。翻译那一步调 common/translation。
    why_this_way: >
      把它明确画成侧门而不是主路上的一支，是因为它的输入输出都不落盘、不进站点——
      混进主路只会让主路看起来有一个从不产出页面的分叉。
      docx 刻意不走文字识别：它本来就是压缩包里的 XML，标准库解析又快又准。
      要修的两处都是「界面说的和实际发生的不一样」：
      模型下拉框列的是 HuggingFace 仓库名（models.py:12-17），
      而默认那条会被解析成已服务的聊天 tag、选别的又会掉出自动选 Ollama 的闸门、
      于是悄悄把聊天模型卸掉——改成直接列 /api/tags 拿到的本机 tag，选什么就真用什么；
      另外 marker 那条文字识别分支依赖一个手搭的 conda 环境，
      如果你没在用就删掉（Ollama 的视觉那条已经覆盖 PDF 与图片）。
    code:
      - file: tools/translator/core.py
        symbol: translate_file
      - file: tools/translator/app.py
        symbol: build_ui
    verify:
      command: python -m pytest tools/translator/tests/test_core.py
      pass: "exit 0"
    future: >
      翻译能力最直接的展示面；想加一种输入格式只改 core.py 的一个分支。
    log:
      - date: "2026-09-12"
        by: ccthink
        note: "原样保留 I-036，位置从「本机翻译」改成主路旁边的侧门，说清它只借用翻译那一步。"

  # ─────────────────── 一条命令跑完全程 ───────────────────
  - id: I-077
    step: 一条命令跑完全程
    name: "终点：一条命令跑完从取素材到发布的整条链，日报、周报、月报、研究周报、跑分页都由它产出"
    status: doing
    needs: [I-065, I-066, I-067, I-068, I-069, I-070, I-073, I-074, I-075]
    what: >
      一条命令按固定顺序跑完：拉各机素材 → 本机取素材 → 逐天补齐没算过的日报 →
      补齐缺失或过期的周报与月报 → 产出研究周报与跑分页 → 最后发布一次。
      开跑前的就绪检查不通过就直接退出、不做任何工作；收尾释放显存。
      中间不再用环境变量推迟发布——发布本来就只在最后调一次。
    why: >
      手动跑要记住六个子命令和它们的顺序，还要自己判断哪些周、哪些月需要重算。
      能放进定时任务的东西才会真的每天发生。
      今天这条链靠 GADGET_DEFER_HUGO_UPDATE=1 让中间各步别构建站点、最后再构建一次——
      那个环境变量存在的唯一原因是每一步各自会去发布，顺序收进一处之后它就没有意义了。
    expected: >
      就绪检查不过时零工作量退出；缺失与过期的周月报被识别并重算、已最新的跳过并打日志；
      整条链里 Hugo 只构建一次；跑完后公开站点上出现当天的日报、
      以及到期的周报月报研究周报；全仓 grep 不到 GADGET_DEFER_HUGO_UPDATE。
    how: >
      tools/summarize/auto.py 的 cmd_auto 仍用子进程驱动各子命令
      （失败一步不污染同一个进程的状态），但发布只在最后调一次 tools/website/publish.py。
    why_this_way: >
      子进程而不是直接 import，是因为每个子命令都是独立的命令行入口；
      发布收到最后一次，是因为每份报告都触发一次全站构建的成本是分钟级的。
      这一个终点取代原来的三个（自维护博客、日报流水线、研究周报）——
      它们是同一条链的三种素材，不是三个终点。
    code:
      - file: tools/summarize/auto.py
        symbol: cmd_auto
    verify:
      command: python -m pytest tools/summarize/tests/test_onboarding.py
      pass: "exit 0"
    future: >
      这条链一旦稳定，报告就变成基础设施——后面所有「回看历史」的功能都有数据可用。
    log:
      - date: "2026-09-12"
        by: ccthink
        note: >
          合并自 I-016、I-025、I-032 三个原终点，外加 I-018 的编排那一半。
          三者都是「一条命令跑完一条链并发布」，区别只在素材来自哪里。

  # ─────────────────── 别人装上就能用 ───────────────────
  - id: I-078
    step: 别人装上就能用
    name: "新机器填一张表跑一条命令就配好，跑一次冒烟就知道有没有弄坏哪个入口"
    status: doing
    needs: [I-061, I-068]
    what: >
      两件事收在一处：填一张 YAML 表、跑一次 scripts/onboard.py 自动完成
      ssh 配置、命令行工具安装与鉴权、pip extras、各工具配置、rclone 初始化，最后自检；
      以及一条 bash scripts/smoke.sh 对所有工具跑 --help / --info / import 检查，
      不调模型、不联网、不写盘，缺依赖的项标跳过而不是失败。
    why: >
      新机器接进来要做十几件互相依赖的事，凭记忆做一遍必然漏掉一两项，
      而漏掉的那项通常要等到某天流水线失败才被发现。
      另一侧，单元测试是纯打桩的，测不到「这个命令行还能不能启动」——
      而重构最容易打断的正是 import 链和参数接线。
    expected: >
      --dry-run 打印将要做的事而不动系统；每一步可单独跑；重复运行是幂等的；
      在只装了基础依赖的环境里冒烟结果是若干通过加少量跳过、零失败；
      任何一个工具的入口 import 断了就会失败。
    how: >
      scripts/onboard.py 的六步不变；scripts/smoke.sh 靠 grep stderr 里的
      ModuleNotFoundError 把「缺依赖」与「真坏了」分开。
    why_this_way: >
      装机与冒烟放一个想法里，是因为它们是同一件事的两头——装完就该冒烟，
      冒烟失败就回去看装机哪一步没成。权限收紧只做到仓库根为止：
      脚本不去改它没创建的上层目录。
    code:
      - file: scripts/onboard.py
        symbol: STEPS
      - file: scripts/smoke.sh
        symbol: smoke
    verify:
      command: python -m pytest scripts/tests/test_onboard.py && bash scripts/smoke.sh
      pass: "exit 0 且 0 failed"
    future: >
      加一台新机器的成本降到「填一行 + 跑一次」；任何重构后先跑冒烟，
      三十秒内知道有没有把某个工具的入口弄坏。
    log:
      - date: "2026-09-12"
        by: ccthink
        note: "合并自 I-039 与 I-040 —— 装机与冒烟是同一件事的两头。"

  - id: I-079
    step: 别人装上就能用
    name: "不需要网络、显卡或任何密钥就能跑通的测试基线，并给四块没测过的代码定一条覆盖下限"
    status: todo
    needs: []
    what: >
      每个模块自带 tests/ 目录，重依赖（模型、外部接口、子进程）一律用标准库打桩，
      没有仓库级统一运行器。在这个基线上接一个覆盖率量具，
      并给四块今天没有覆盖的代码各定一条不许跌破的下限：
      跑分的账本与硬件探测（这个工具至今连 tests/ 目录都没有）、
      学者画像与论文深读、周月报渲染、媒体增量压缩。
      门槛挂在模块集合上而不是工具目录上，给出一条低于门槛就失败的命令。
    why: >
      这些工具的真实依赖是显卡、本地模型服务和外部接口。如果测试需要它们就等于没有测试。
      而冒烟只能证明「能启动、能解析」，证明不了「算得对」。
      缺测试正在阻止重构：周月报那次去重改动就是因为「没有单元覆盖、回归风险高」
      被拒绝合并的——也就是说这个节点是 I-070 的真正前置。
      门槛必须按块定：跑分里的图表与网页生成有 600 行，是全仓最不值得测的代码之一，
      按工具目录定一个总数会逼人去测不该测的东西。
    expected: >
      在没有网络、没有显卡、没有任何密钥的机器上各套件全绿
      （唯一例外是需要活 Ollama 的那个端到端测试，它自动跳过）；
      一条命令能对指定模块集合跑出覆盖率，低于门槛时退出码非零；
      门槛值有明确的存放位置，改门槛不用改任何测试；
      四块区域各自不低于自己那条线。
    how: >
      按现有约定就近建目录（先建 tools/benchmark/tests/），
      用标准库打桩 torch 与文件系统，优先锁「失败时的降级路径」而不是顺利路径——
      降级路径恰恰是最不会在作者本机上被触发的那部分。
    why_this_way: >
      原来这件事被拆成了八个节点（一个汇合点加一个量具加六个区域）。
      八个节点里没有一个包含独立的设计判断——它们是一份工作分解，不是八个想法。
      量具与门槛确实是前置，但它和「把测试写出来」是同一件事的前后脚，
      分两个节点只会让图上多一层。
    code:
      - file: tools/benchmark/tests/test_core.py
        symbol: test_csv_append_only
      - file: pyproject.toml
        symbol: coverage-thresholds
    verify:
      command: python -m pytest common/tests scripts/tests && cd tools && python -m pytest summarize/tests research/tests website/tests translator/tests/test_core.py benchmark/tests
      pass: "exit 0"
    future: >
      有了量具，「这次重构有没有把覆盖打薄」变成一个能当场回答的问题；
      被搁置的那几处去重才有可能真的做。
    log:
      - date: "2026-09-12"
        by: ccthink
        note: >
          合并自 I-041、I-044、I-054、I-055、I-056、I-057、I-058、I-059、I-060
          —— 九个节点并成一个。这是原图里最明显的一处过度拆分。

