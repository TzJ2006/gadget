    what: >
      在基本检索与评分之上的一层可选深读，四项各自独立、缺哪一项其余照常产出：
      下载全文分析写作结构与发表策略；匹配到 OpenReview 的抓审稿意见并汇总共识与分歧；
      给一位学者拉论文与引用数据写研究轨迹、算影响力分级、按共著模式推断师生关系；
      给一篇论文拉前向引用与参考文献加一段影响力解读。
