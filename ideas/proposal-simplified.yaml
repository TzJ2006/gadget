version: 1
project: gadget
overview: >
  一个个人开发工具箱单仓。原料有四种：各台机器上的 AI 对话记录、各大论文库的新论文、
  本机硬件的实测算力、人手写的文章与图片视频。它们走同一条六步主路——取素材 → 理解 →
  成稿 → 双语 → 落站 → 发布——最后变成公开站点 tzj2006.github.io 上自己保持最新的
  中英双语页面。所有大模型调用与翻译都跑在本机 Ollama 上，不需要任何云端密钥。
  主路之外只有两样东西：一个直接调用翻译核心的本地网页，和一份只追加的跑分 CSV 账本。
  底座只有三件，每一步都用：仓库根一个 config.json、一套原子落盘加内容哈希缓存、
  一个本地模型入口。分层规则不变：共享代码只放 common/，工具之间零 import，
  common/ 从不反向依赖 tools/。许可为 GPL-3。

endpoints: [I-072, I-077, I-081]
next_id: 84

steps:
  - name: 共用底座
    blurb: 把读配置、安全落盘、调本地模型这三件每一步都要做的事，各收成一处，全仓只有一份。
  - name: 取素材
    blurb: 把各台机器上的对话记录、各大论文库的新论文、本机硬件的实测数字，都变成同一种形状的素材。
  - name: 读懂并写成稿
    blurb: 让本地大模型把素材读成一份结构可靠的结果，再按版式渲染成人能读的报告。
  - name: 翻成两种语言并发到站上
    blurb: 把报告和手写文章翻成中英两份、逐项检查、压好媒体，再构建并推送到公开站点。
  - name: 一条命令跑完全程
    blurb: 定时自动跑完从取素材到发布的整条链，不需要人记住任何命令的顺序。
  - name: 别人装上就能用
    blurb: 让任何人把这个仓库下载下来、装一次，就能单独使用其中任何一个工具。

ideas:
  # ─────────────────────────── 共用底座 ───────────────────────────
  - id: I-061
    step: 共用底座
    name: "所有配置只放在仓库根的一个文件里，而且共享代码自己就读得到"
    status: doing
    needs: []
    what: >
      运行期配置只有一个来源：仓库根 config.json，按 llm / translation / summarize /
      research / sync 五节分；路径可用 GADGET_CONFIG 覆盖，取值顺序固定为
      命令行参数 > 环境变量 > 该节 > 硬编码默认值。common/ 里的代码直接调 load_section
      读它，不再由哪个工具把配置值灌进环境变量再绕回来。
    why: >
      今天 common/llm.py 读不到配置，是靠 tools/summarize/config.py 的 _ENV_FROM_CONFIG
      把 model 桥接成 OLLAMA_MODEL 环境变量绕进去的。结果是「换个模型」要先知道这条桥
      的存在，而且这条桥只有 summarize 有——research 或 translator 单独跑时同一个键
      根本不生效。配置节也从六个缩到五个：research_scout 与 research 是同一个工具
      （而 config.example.json 里其实还有第六节 translation，AGENTS.md 没记）；
      translator 那 11 个环境变量旋钮也该进 config，而不是自成一套。
      还有一处是「机制服务机制」：进程内缓存配了一个手动的 clear_cache()，
      于是「读到的是不是最新的」变成每个调用方的责任——
      test_config.py:55-64 还把这个读到旧值的行为当成预期写进了测试。
    expected: >
      只改 config.json 的 llm.chat_model、不设任何环境变量，summarize / research /
      translator 三个入口都换到新模型；全仓 grep 不到 _ENV_FROM_CONFIG；
      删掉 ~/.config 下的旧文件后一切照常。
    how: >
      把 common/translation/frontmatter.py:257 已经在用的「函数体内
      from common.config import load_section」这个写法推广到 common/llm.py，
      删掉 tools/summarize/config.py 里的环境变量桥；
      并把 common/config.py:35 那个进程内缓存改成按（路径, 修改时间）取键——
      这样 clear_cache() 和它的约 20 处调用点可以一起删掉。
    why_this_way: >
      仓里已经有一个能用且在用的先例（frontmatter.py 的 resolve_review_model），
      抄它是最短路径；局部 import 而不是模块顶层，是因为 common/config.py 与
      common/llm.py 不能在顶层互相依赖。不引入 pydantic-settings 这类配置库——
      为了一个模型名加一个依赖是纯负债。
    code:
      - file: common/llm.py
        symbol: resolve_chat_model
      - file: tools/summarize/config.py
        symbol: _ENV_FROM_CONFIG
    verify:
      command: python -m pytest common/tests/test_config.py common/tests/test_llm_model.py
      pass: "exit 0"
    future: >
      新工具只要加一节就接进同一套解析顺序；「今天用的哪个模型」变成一个可以打日志、
      可以落在报告签名里的值。
    log:
      - date: "2026-09-12"
        by: ccthink
        note: "合并自 I-001 与 I-051 的配置那一半；同时把配置节从七个并到五个。"

  - id: I-062
    step: 共用底座
    name: "原子落盘加一个内容哈希缓存，管住全仓所有「内容没变就别重做」"
    status: doing
    needs: []
    what: >
      两样东西：atomic_write（先写临时文件再替换）和一个按内容哈希取键的磁盘缓存。
      全仓所有「上次算过就别再算」的判断都走这一个缓存，唯一的例外是写进站点的文件——
      它们把源内容指纹盖在文件自己的头里，因为产物必须能自证来历。
    why: >
      今天同一个判断有七套实现、七种存放格式：站点文件里的 src-hash 注释
      （bilingual.py:32）、块缓存自带的 _chunk_meta（llm.py:479）、DiskCache
      （cache.py:23）、配置的进程内缓存（config.py:35）、load_json_config 的记忆字典
      （io.py:33）、.last_build 时间戳（publish.py:138，而且实现了两遍——preflight
      也有一份，两份对「生成文件算不算」的判断还不一致）、.translation_state.json
      （translate_site_batch.py:313），外加发布前 git diff --cached 那第五道判断
      （publish.py:311）。最刺眼的一条：**DiskCache 在 common/ 内部没有任何调用方**——
      两条最热的跳过路径（块缓存、src-hash 标记）各自另写了一套格式。
      两个状态对不上的时候没人判断得了哪个对：2026-08-04 那次九篇中英文逐字相同就是这一类。
      而时间戳判据比哈希判据更弱：touch 一下就会重压一遍，改完又改回去反而不会；
      更糟的是 .last_build 只在推送成功之后才更新（publish.py:374），
      所以预检中止或构建失败时，这一轮已经压好的媒体会留在旧的那一侧，下一轮再压一遍。
    expected: >
      .last_build 与 .translation_state.json 两个文件都不存在了，媒体压缩与双语配对
      都由内容哈希决定；进程在写入中途被杀时目标文件要么旧要么新、不会是半截；
      同一份输入第二次跑命中缓存、不发起任何推理；失败的结果不进缓存。
    how: >
      atomic_write / content_hash 不变。DiskCache 只差一样东西就能接住那些自制格式：
      put/get 多一个 meta 字典（约 6 行）——块缓存手搓的 _chunk_meta 信封存的就是
      {global_hash, total_chunks}。加上它之后把块缓存、.last_build、
      .translation_state.json 三处逐个换成 DiskCache；
      站点文件的 src-hash 标记保留，但它唯一的职责变成「产物自证来历」，不再兼任缓存。
    why_this_way: >
      留两种机制而不是一种，是因为它们答的是两个问题：缓存答「这次要不要算」，
      文件里的标记答「盘上这个文件是从哪份源内容来的」。后者必须跟着产物走，
      否则删一次缓存目录就会把整站重译一遍。其余三个状态存放点答的都是第一个问题，
      所以并掉。
    code:
      - file: common/cache.py
        symbol: skip_if_unchanged
      - file: common/io.py
        symbol: atomic_write
    verify:
      command: python -m pytest common/tests/test_cache.py common/tests/test_bilingual_skip.py
      pass: "exit 0"
    future: >
      任何新的「贵调用」或新的重型构建步骤挂上同一个封装就有了增量语义，
      不必各自发明一个状态文件。
    log:
      - date: "2026-09-12"
        by: ccthink
        note: >
          合并自 I-002、I-013 的 .last_build 判据、I-014 的状态文件、I-023 的
          source_hash、I-026/I-027 的缓存闸门、I-011 的跳过判据。
          实测依据：grep 到 15 个非测试文件在各自实现这件事。

  - id: I-063
    step: 共用底座
    name: "打本机 Ollama 只有一个客户端、「这次用哪个模型」只有一个解析器；要的模型没下载就当场报错"
    status: doing
    needs: [I-061]
    what: >
      收拢的是**被建了两遍的那一层**，不是上面两个选择。
      一个 Ollama 客户端（今天有两个：OpenAI SDK 与标准库 urllib，各抄一份地址优先级）；
      一个 tag 解析器 resolve_ollama_tag(requested=None)，优先级为
      显式参数 > OLLAMA_MODEL > config 对应节 > 默认值，而且**必须认它的参数**
      （今天 ollama 那条会把调用方传的 model 直接丢掉）；解析出 tag 之后问一次
      /api/tags，不在里面就抛错并列出本机可用 tag，Ollama 不可达时不拦。
      在这一层之上，两个选择各自保留、互不混淆：
      「聊天走哪个提供方」留 ollama 与 openai 两个（删 claude_cli 与 anthropic），
      「翻译用哪个本机运行时」留 ollama 与 transformers 两个（删 vLLM 与 llama.cpp，
      以及只服务后三个的抽象基类）。
      **并且停止为翻译覆盖 num_ctx**：详见下面「为什么这样实现」——那个旋钮现在是在帮倒忙。
      keep_alive 与固定 4 路并发保留。
    why: >
      今天是两套并行的模型栈、八个后端：聊天四个（ollama / anthropic / openai /
      claude_cli），翻译四个（ollama / vLLM / llama.cpp / transformers，engine/ 共 966 行，
      其中 540 行是三个非 Ollama 后端加一层抽象基类）。它们解决的是同一件事——
      「在哪跑这个模型」。更具体的三处：
      （一）同一个本机 Ollama 服务有两个客户端——common/llm.py:107-129 走 OpenAI SDK，
      common/engine/ollama.py:114-261 走标准库 urllib，各自抄了一份
      OLLAMA_BASE_URL > OPENAI_BASE_URL > 127.0.0.1 的优先级；
      （二）「这次用哪个模型」有五个解析器、五条优先级链（llm.py:89 与 123、
      engine/base.py:79 与 87、frontmatter.py:247），只有最后一个读 config；
      （三）ollama 那条会把调用方传进来的 model 参数直接丢掉（llm.py:123-129），
      所以 json_utils 里那条写在文档上的 haiku→sonnet→opus 升级链在默认后端上是空转。
      另外翻译那侧的默认 Ollama tag 其实就是聊天 tag（engine/base.py:22，
      由 resolve_ollama_translation_model 解析），所以按默认配置 HY-MT2 从来不会被加载——
      想法图的总览和 I-006 的 expected 都还写着「pull 了 HY-MT2 就自动选 Ollama」。
    expected: >
      全仓只剩一处硬编码的默认聊天模型名，改它一处全仓生效；
      写错一个 tag 立刻报错并列出本机可用 tag，而不是走到 openai SDK 那层才炸；
      frontmatter 复核不再被静默跳过；ollama ps 显示两个模型同时驻留。
    how: >
      common/llm.py 留 call_llm_raw / call_llm 两个函数与 ollama + openai 两个后端，
      删 anthropic 与 claude_cli 分支；common/engine/ 留 ollama.py 与 transformers.py，
      删 vllm.py、llamacpp.py 与为四后端而存在的 base.py 抽象；
      create_engine 缩成一个 if；把 frontmatter 的 _match_review_tag 提到
      common/engine/ollama.py 作共享 helper，frontmatter 留 re-export shim。
    why_this_way: >
      **刻意不把「聊天选提供方」和「翻译选运行时」合成一个开关**——审计时被质疑过这一点，
      质疑是对的：前者选的是「跟哪个服务说话」（要结构化 JSON 整形，要三套云端 SDK），
      后者选的是「哪个本机运行时加载这一个模型文件」。它们是两个问题。
      真正被建了两遍的是下面那一层：同一个 Ollama 服务两个客户端、同一个问题五个 tag 解析器。
      所以这个节点收的是那一层，上面两个选择各留两个选项。
      留两个翻译运行时而不是一个，是因为「这台机器没装 Ollama 也要能翻译」是真实需求；
      留 transformers 而不是 vLLM 或 GGUF，因为它是唯一纯 pip、不要额外进程与编译的；
      llamacpp 连批量都没有（顺序循环），它给不了 Ollama 给不了的东西。
      删 claude_cli 是因为它是对一个命令行的子进程调用，而且「取纯文本」与「取 JSON」
      各写了一遍。删 base.py 的抽象基类是因为两个实现不需要一层继承来共享三个方法名。
      提取 match_tag 时**不留 re-export shim**：核过了，_match_review_tag 在定义之外
      只有两处引用（frontmatter.py:316 与一处测试），AGENTS.md 那条「shim 必须存活」
      说的是对外发布过的 re-export，不是私有小 helper。
      最后一条是本轮审计里最值得单独写出来的：**「两个模型共驻一块显卡」这个前提，
      已经被一行代码取消了**——base.py:22 写着
      DEFAULT_TRANSLATION_MODEL_OLLAMA = DEFAULT_OLLAMA_CHAT_MODEL，
      也就是翻译用的就是聊天那个模型，显存上只有一个模型，没有谁挤谁。
      但 I-008 为那个前提造的全部机制都还在，而其中一个现在是在帮倒忙：
      ollama.py:177 仍然把 num_ctx 压到 8192，而聊天那条运行时是按 65536 加载的
      （serve_local_llm.sh 的 MIN_CTX，并且在 :88-95 显式检查——因为 /v1 接口会忽略
      单次请求的 num_ctx），原生接口却会认它。结果是每次「总结↔翻译」切换都逼 Ollama
      重载一次运行时——正是这个想法声称要省掉的那约 10 秒，现在每次切换都在付。
      所以这里停掉 num_ctx 覆盖，不是省事，是修 bug。
    code:
      - file: common/engine/ollama.py
        symbol: resolve_ollama_tag
      - file: common/engine/ollama.py
        symbol: match_tag
      - file: common/llm.py
        symbol: LLM_BACKENDS
      - file: common/engine/__init__.py
        symbol: create_engine
    verify:
      command: python -m pytest common/tests/test_dispatch.py common/tests/test_engine_ollama.py common/tests/test_llm_model.py
      pass: "exit 0"
    future: >
      「试一个新本地模型」的成本降到改一行加跑一天日报肉眼对比；
      日后想按任务分模型（长归并用大的、复核用小的）只是多一个参数。
    log:
      - date: "2026-09-12"
        by: ccthink
        note: >
          合并自 I-003、I-006、I-008、I-051、I-052、I-053。
          删掉的能力已逐条列在 ideas/proposal-simplified.md 的「行为会变的地方」里。

  - id: I-064
    step: 共用底座
    name: "把一堆素材交给本地模型，拿回一份结构可靠的结果——切块、归并、修复、重试都在这一个函数里"
    status: doing
    needs: [I-063]
    what: >
      一个函数负责「素材进、合法结构出」：按字符预算切块 → 逐块摘要并按块内容哈希缓存 →
      归并（能塞进一次调用就一次归并完，塞不下才分组递归——不是两两归并，
      想法图 I-005 的「两两」是错的）→ 对本地后端把调用方的 schema 转成约束解码并把顶层属性全部提升为 required →
      解析失败走修引号、交给模型重排的修复梯 → 拆掉多余信封层、把只返回概览的回答套回
      报告结构、把该是列表的裸字符串包起来 → 给结果打一个内容充实度分 → 分为零重试一次 →
      仍不行抛错，绝不返回一份看似成功的空报告。
    why: >
      「别把一次失败冻成缓存里的权威结果」这条纪律也被发明了四次，四种形状：
      检索用 None 与空列表的返回约定、筛选与深评用结果形状闸门、
      insight 用「成功才写」、common 的块缓存用「拒绝 parse_error」——
      收成一个 cache_if(结果, 可用吗)，所有阶段共用一个闸门，
      硬失败直接抛异常，而不是返回一个每个调用方都要记得判一次的特殊值。
      还有一件更要紧的：这整条抢救链**今天只保护日报**——_finalize_report 的调用点只有
      summarizer.py:460 与 503，周报月报走的是不带抢救的 timed_llm_call，
      只靠渲染器里的类型判断兜着。所以把它收进 common/ 不只是去重，
      是让周报月报第一次获得日报已有的那层保护。
      今天这件事分散在五层、四个文件：common/llm.py 的约束解码、
      common/json_utils.py 的修复梯、tools/summarize/summarizer.py 的信封拆解与重试、
      tools/summarize/formatter.py 的列表兜底、tools/research/scout/evaluate.py 的
      两道 is_usable 闸门。五层挡的是同一件事——本地模型会在不抛异常的情况下
      返回一份形状不对的答案。分散的后果是 research 那一侧各写了一份，
      而且两侧的判据不一样：summarize 看内容充实度分，research 看「是不是全是默认值」。
    expected: >
      47 万字符的一天日志仍然切成 4 块加 1 次归并；解析失败的块不进缓存；
      全是默认值的筛选结果不进缓存；顶层键被改名时能从同义词里恢复而不被薄诱饵骗走；
      结构分为零时触发一次重试；全部块都失败时显式抛错。
    how: >
      把 summarizer.py 的 _unwrap_envelope / _renest_overview / _normalize_report /
      _report_content_score 与 evaluate.py 的 _screening_is_usable / _deep_eval_is_usable
      一起上提到 common/llm.py，合成一个 call_llm_structured(材料, schema, prompt)；
      summarize 与 research 两侧都改成调它，各自只留自己的 schema 与 prompt。
      三处顺手的收拢：约束解码那 23 行**一个字不动**（它是唯一「防止」而不是「事后补救」
      的机制，也是唯一有实测表和测试的）；修复梯只留两步（try_parse_json 的三级非 LLM 修复
      + 一次交给模型重排），把 repair_json_with_llm 里那条 haiku→sonnet→opus 升级链删掉
      ——默认后端会丢掉 model 参数，所以它今天就是把同一个调用发三遍；
      chunk_text 多一个 length_of 回调，summarize 里那份 chunk_conversations 的抄写随之消失；
