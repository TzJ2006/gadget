      用量只保留 usage_card.py 那张 HTML 卡片；跑分的 plotly 网页留在 benchmark 里不动。
      另外「一份报告变成站点上的双语文章」今天有**四个发布器**
      （period_report.generate_period_hugo_post、formatter.generate_hugo_post 这层壳、
      research 的 scout/report.generate_hugo_post、benchmark 的 publish），
      四个都是「拼 frontmatter 字符串 → 解析站点内容目录 → write_bilingual」，
      只差标题、关键词、摘要和相对路径——收成 common/ 里一个
      publish_report_post(站点, 相对路径, 标题, 日期, 关键词, 摘要, 正文)，四个调用方只填参数。
      收拢这一步顺带会暴露一个今天没人发现的问题：
      content/benchmark.zh.md 是一份固定文件，没有任何代码再生成它——跑分中文页一直是陈旧的。
    why_this_way: >
      版式做成数据而不是代码，是因为用户明确要求能增删板块、换叙事方式——
      那是每几周就要动一次的东西，动数据不动代码才便宜。
      删 matplotlib 那一套而不是删 HTML 卡片：卡片没有任何外部依赖、在站点上更好看，
      而 PNG 那一套本来就是「装了才画、没装就跳过」的可选件，说明它从来不是必需的。
    code:
      - file: tools/summarize/report.py
        symbol: render
      - file: tools/summarize/usage_card.py
        symbol: render_usage_card
    verify:
      command: cd tools && python -m pytest summarize/tests
      pass: "exit 0"
    future: >
      再加一个季度报或年度报只是加一份版式数据；换一种叙事方式不用碰渲染代码。
    log:
