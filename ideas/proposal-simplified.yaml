  - id: I-067
    step: 取素材
    name: "测出本机各精度档的实际算力，结果只往一份 CSV 账本里追加"
    status: doing
    needs: []
    what: >
      自动识别 NVIDIA / Apple / Intel 的显卡，在 FP64 / FP32 / FP16 / BF16 各精度档上
      跑矩阵乘，按显存自动选规模、计时前后显式同步；预热加中位数加去异常值的统计；
      结果以追加模式写进 benchmark_results.csv——永不覆盖、永不去重。
      这份 CSV 就是成稿那一步的素材，跑分是主路上唯一不经过大模型的一支。
    why: >
      单次计时在有后台负载的机器上能差出两倍；而跑分的价值在于横跨多台硬件、
      多个时间点累积对比，一旦重写那份 CSV 就丢掉了历史，而它不在版本控制的保护范围里。
      不显式同步的显卡计时量到的是提交队列的时间，不是计算时间。
    expected: >
      连续跑两次后 CSV 行数是两次之和、旧行一字不动；
      没装深度学习框架的机器上 --info 仍能列出检测到的硬件而不是抛找不到模块的错；
      不支持的精度档被跳过并说明原因、不中断其余档；显存越大自动选的矩阵越大。
    how: >
      tools/benchmark/benchmark/ 下的 core.py（计时与落盘）、detect.py（分厂商探测）、
      gpu.py（逐精度档测量）不变；本节点要补的是这个工具的第一个 tests/ 目录。
    why_this_way: >
      追加写是 AGENTS.md 的硬规则，理由是它天然支持多硬件累积排行榜。
      探测与实测刻意分开（--info 可能检测到 OpenCL 但不跑 OpenCL）——
      探测得到不等于能测。
    code:
      - file: tools/benchmark/benchmark/core.py
        symbol: RobustTimer
      - file: tools/benchmark/benchmark/detect.py
        symbol: get_gpu_info
    verify:
      command: cd tools/benchmark && python -m pytest tests
      pass: "exit 0"
    future: >
      公共排行榜积累够多机器之后可以回答「这张卡值不值」这类问题。
    log:
      - date: "2026-09-12"
        by: ccthink
        note: >
          合并自 I-033 与 I-034 —— 计时、探测、落盘是同一件事的三个部分，
          拆成两个想法没有带来任何判断上的区分。

  - id: I-068
    step: 取素材
    name: "各台机器把素材推到同一个远端目录、汇总机拉下来——全仓只有这一条跨机通道"
    status: todo
    needs: [I-061, I-065]
    what: >
      一条通道，而且它是**可选的**：每台机器导完自己的素材就 rclone 推到远端按类目分的目录，
      汇总机 rclone 拉下来再往下走主路；而汇总那一步只认「素材目录里现在有哪些文件」，
      没有配远端也照样跑（本机一台的素材就出一份本机的报告）。
      类目（对话记录 / 站点 / 论文 / 跑分 / 备份）与远端配置都在 config.json 的 sync 节里；
      失败必须显式报出来。
    why: >
      今天同一件事有三套实现：scripts/sync.py 的 rclone 同步（约 600 行）、
      tools/summarize/remote.py 里另一套自带重试参数的 rclone（257 行，
      而且现有的想法图里没有任何想法认领它）、tools/summarize/ssh_pull.py 的 ssh 加 scp。
      第三套是坏的：ssh_pull.py:73 的 scp 源写成 outputs/logs/*.json，
      而远端导出实际落在 outputs/logs/summarize/（daily_helpers.py:9），
      少一层目录所以一个文件都拉不到；tests/test_ssh_pull.py:16,18 断言的正是这条错路径，
      把这个缺陷锁进了测试——验证是绿的，功能是坏的。
      而最贵的那一套反过来是**强制的**：没配 summarize.rclone_remote 时
      _rclone_download_logs 返回空（remote.py:197-200），_cmd_merge_sync_all 随即
      以「没有日志」退出 0（而且 onboarding.py:84-101 把「配好 rclone 远端」
      做成了 auto 的硬性前置）。也就是说今天**不开云盘账号就出不了日报**，
      哪怕所有素材都在本机。这不是传输方式的问题，是汇总那一步把传输当成了前提。
    expected: >
      汇总机跑完之后本机素材目录里真的多出每台远端机器的文件——这是唯一算数的判据；
      未配置远端时给出可读提示而不是静默成功；--dry-run 只列出将要传的文件；
      全仓 grep 不到第二份 rclone 参数表，也 grep 不到 scp。
    how: >
      scripts/sync.py 保留为唯一入口，把 remote.py 的重试参数合并进它的参数表后删掉
      remote.py；删掉 ssh_pull.py 与锁住它那条错路径的测试；
      summarize 的 auto 改成调同一个 sync 入口。
    why_this_way: >
      选 rclone 而不是 ssh，是因为 rclone 这条已经被 onboard 配好、已经在用、
      并且顺带解决了「远端机器此刻没开机」——推到远端目录是异步的，
      ssh 拉取要求两台机器同时在线。坏掉的那条顺势消失，不必单独修。
    code:
      - file: scripts/sync.py
        symbol: sync_dirs
      - file: tools/summarize/remote.py
        symbol: _rclone_download_logs
    verify:
      command: python -m pytest scripts/tests/test_sync.py
      pass: "exit 0"
    future: >
      加一台新机器的成本降到「填一行配置 + 跑一次定时任务」；
      新工具产出的新目录只要进类目表就自动被同步。
    log:
      - date: "2026-09-12"
        by: ccthink
        note: >
          合并自 I-018 的跨设备那一半、I-019、I-037，外加图里没人认领的
          tools/summarize/remote.py。I-019 的缺陷已独立复核过（逐行对比
