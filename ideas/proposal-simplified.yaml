  - id: I-083
    step: 别人装上就能用
    name: "把跨项目进度总览页搬去 ai-companion，本仓只保留它写进站点的那道门"
    status: blocked
    needs: [I-074]
    what: >
      带密码保护的跨项目进度总览页不再由本仓生成。它搬进 ../ai-companion
      （那张图的数据与生成脚本本来就在那边），生成完的静态文件经本仓的落站那道门
      写进站点 static，再由发布链发到 /dag/。本仓这一侧只剩「它是又一个内容生成器」。
    why: >
      今天它的入口是 scripts/sync.py --category dag —— 一个 rclone 同步工具里
      藏着一条调用隔壁仓库 TypeScript 脚本的发布链（sync.py:526-608）。
      这是全仓唯一一处向仓库外面伸手的代码，而它伸向的那个仓库在别人的检出里可能不存在
      （在当前这个检出里就不存在，所以这条命令今天只会报错退出）。
      更要紧的是它**会被自己的依赖删掉**：产物 tools/website/static/dag/ 在 .gitignore:43，
      也不在 sync.py 的 website 同步类目里，所以它只存在于生成它的那台机器上；
      而发布链会清空 public/ 整站重建再 git add -A 推送——
      于是任何一台没有 static/dag/ 的机器，下一次发布就把线上的 /dag/ 删掉。
      能力本身是真的（切换项目时要一眼看到全局进度），不该删；
      但它放错了地方——它是 ai-companion 的产物，gadget 只是它的发布渠道。
    expected: >
      scripts/sync.py 里不再有 dag 类目，也不再 import 任何 ai-companion 的路径；
      站点 /dag/ 仍然先出现密码框、输对后能看到各项目簇；
      总览页的生成与加密全部发生在 ai-companion 一侧。
    how: >
      从 scripts/sync.py 删掉 sync_dag（526-608）、DAG_BUILD_SCRIPT / DAG_STAGE_DIR
      （50-57）与 --category dag 的特判（635-647）——那两步（跑 ai-companion 的 stage、
      再跑 update.sh）让 ai-companion 自己做。gadget 侧真正需要的只剩一句约定：
      static/dag/ 和别的 static 一样被发布。还需要单独一轮讨论定的是
      「那个目录怎么到每台机器上」——不解决这件事，/dag/ 仍然会被下一台机器的发布删掉。
      本节点在那轮讨论之前保持 blocked。
    why_this_way: >
      不直接删掉能力，因为用户明确在 docs/ecl/cross-project-live-dag.yaml 里
      决定过要部署它；也不原样留着，因为「一个 rclone 工具里藏着一条跨仓库发布链」
      是这张图里最说不清归属的一处。把它降级成「又一个内容生成器」之后，
      本仓的落站那道门对它和对日报是同一个待遇。
