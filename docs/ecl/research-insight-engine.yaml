# ═══════════════════════════════════════════════════════════════════════
# ADVERSARIAL FINDINGS (Phase 5 + 8)
# ═══════════════════════════════════════════════════════════════════════

adversarial_findings:
  total: 11
  resolved: 11
  critical_resolutions:
    - finding: "Context window bomb (CRITICAL)"
      resolution: "40K char truncation + single combined LLM call"
      status: resolved
    - finding: "Default-on triples cost (HIGH)"
      resolution: "Changed to opt-in --insight flag"
      status: resolved
    - finding: "AAAI not on OpenReview (HIGH)"
      resolution: "Removed AAAI; documented supported venues"
      status: resolved
    - finding: "Password auth security (HIGH)"
      resolution: "Guest API default; password auth optional"
      status: resolved
    - finding: "Import coupling (HIGH)"
      resolution: "Lazy import matching existing pattern"
      status: resolved

# ═══════════════════════════════════════════════════════════════════════
# FEASIBILITY PROBES (Phase 7)
# ═══════════════════════════════════════════════════════════════════════

probes:
  - target: FEAT-003
    type: assumption
    question: "openreview-py available and supports guest access?"
    verdict: feasible
    evidence: "openreview-py 1.58.1 on PyPI; guest client confirmed"
  - target: FEAT-003
    type: assumption
    question: "Can map arXiv papers to OpenReview submissions?"
    verdict: needs-modification
    evidence: "No arXiv ID field in OpenReview schema; title matching required"
  - target: FEAT-003
    type: assumption
    question: "Rate limits for OpenReview API?"
    verdict: feasible
    evidence: "Undocumented; conservative 2 req/s recommended"
  - target: FEAT-001
    type: assumption
    question: "DiskCache pattern reusable for insight caching?"
    verdict: feasible
    evidence: "Existing DiskCache + rate_limiter patterns ready to use"

# ═══════════════════════════════════════════════════════════════════════
# RISK REGISTER
# ═══════════════════════════════════════════════════════════════════════

risk_register:
  - id: RISK-001
    description: "OpenReview title matching false negatives (论文改名后匹配失败)"
    probability: medium
    impact: low
    mitigation: "Graceful skip; insight analysis still valuable without reviews"
  - id: RISK-002
    description: "OpenReview API rate limiting 导致 timeout"
    probability: low
    impact: medium
    mitigation: "2 req/s limiter + exponential backoff on 429"
  - id: RISK-003
    description: "全文提取质量差 (PDF artifact, 公式乱码)"
    probability: medium
    impact: low
    mitigation: "HTML first (cleaner); LLM 对噪声有鲁棒性"
  - id: RISK-004
    description: "LLM 输出质量不稳定 (insight 分析的 JSON 格式错误)"
    probability: low
    impact: medium
    mitigation: "复用现有 parse_json_response + try_repair_result 机制"

