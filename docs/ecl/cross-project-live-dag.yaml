# Evolving Constraint Language — /ccdiscuss alignment output.
# Feature: 跨项目实时 DAG 总览，私有部署到 website，多设备快速预览 + 续接 context。
# Aligned: 2026-06-25 via /ccdiscuss (6-step loop).
# Handoff: /ccplan reads this IF PRESENT — no hard prerequisite, no gate.
#
# 复用地图（Step 1 ECL Reuse Discovery）:
#   - ai-companion/scripts/render-dag.ts  — 已渲染单仓 dag yaml → 交互式 HTML
#                                            (FTB 科技树 / 点节点看五问 / 五色状态)。  → reuse-extend
#   - ai-companion/docs/ecl/dag/*.ecl.yaml — dag 数据格式 + left_off (在做/下一步)。   → reuse-extend
#   - ai-companion/packages/dashboard      — scanSshReposDir 多仓扫描。               → reuse-adapt
#   - sync.py + website (Hugo/GitHub Pages) — 现有部署管线。                          → reuse-adapt
#   - 私有可见机制                          — 无现成零件。                            → new

ecl_version: "1.0"
feature: "cross-project-live-dag"
status: "completed" # /ccedit 全部 13 FN 实现+验证通过（2026-06-25），43 测试全绿
created: "2026-06-25"
updated: "2026-06-25"
source: "/ccdiscuss + /ccplan"
pending_input: null
approved: { date: "2026-06-25", by: human, phase: 9 }

# ─── /ccplan Phase 0 (Prompt Calibration) ─────────────────────
prompt_calibration:
  status: fast-tracked # /ccdiscuss 已对齐意图，单一内聚 idea，单 track
  reason: "存在 /ccdiscuss 对齐产物（本文件 idea + ecl_nodes），意图已校准，无需重复拆分。"

# ─── /ccplan Phase 1 (ECL Reuse Discovery) ────────────────────
reuse_discovery:
  scanned:
    [
      "ai-companion/scripts/render-dag.ts",
      "ai-companion/docs/ecl/dag/ai-companion.ecl.yaml",
      "ai-companion/packages/dashboard",
      "sync.py",
      "common/hugo.py",
      "website/update.sh"
    ]
  matches:
    - intent: "渲染单仓 DAG（点节点看五问 / 状态上色）"
      existing: { file: "ai-companion/scripts/render-dag.ts", symbol: "renderDag()" }
      classification: reuse-extend
      action: "扩展：补 in-progress 上色 + 渲染 left_off（当前缺口）；新增 overview 聚合渲染。"
      gap: "现有 HTML 未渲染 left_off；mermaid classDef 缺 in-progress 类（status=in-progress
        节点不上色）。"
    - intent: "DAG 数据格式（milestones/status/left_off）"
      existing: { file: "ai-companion/docs/ecl/dag/*.ecl.yaml" }
      classification: reuse-direct
      action: "直接复用该 schema；其余 opt-in 项目按同格式补 dag yaml。"
    - intent: "多仓扫描 / 项目注册"
      existing:
        {
          file: "ai-companion/packages/dashboard/src/scanner.ts",
          symbol: "scanSshReposDir()"
        }
      classification: reuse-adapt
      action: "改用一份显式项目注册（config）→ 各项目 dag yaml 路径。"
    - intent: "部署到 website（Hugo / GitHub Pages）"
      existing: { file: "website/update.sh + common/hugo.py + sync.py" }
      classification: reuse-adapt
      action: "产物落 website/static/dag/ → 走现有 Hugo 发布；sync.py 增 dag 类目。"
    - intent: "客户端密码加密静态页"
      existing: null
      classification: new
      action: "引入加密步骤（候选 StatiCrypt）；Phase 3 定。"

# ─── 全局对齐摘要（整个 idea 的五问，节点各自再带一份）──────────────
idea:
  expected_result_human: >-
    我打开一个网页，看到一些 DAG 图。第一个是 overview，能明确看到我正在做的事情， high-level、只显示 milestone
    级别（像项目里左边栏那个 level）。后面是每个项目的 DAG 图集合，点进去和其他 DAG 图一样。「实时」= 我去 sync，或 claude
    code 在 ccplan/ccedit/ccdiscuss 动了 DAG 时自动帮我 sync。「更大的图」= 用一张图总结我
    所有项目，直观看到下一步往哪走。「只有我能看到」= 很多是 dev 的、有些想法不适合 公开。「接手工作」= 方便我在不同工作之间
    switch。部署到网页的原因是方便我在多处 （多设备）切换时可以快速预览。
  five_questions:
    what: >-
      一个两层导航的私有网页：①顶层 overview = 跨所有 opt-in 项目的 milestone 级 DAG，
      每个项目一簇、按状态上色、高亮「正在做的」；②每个项目一张详细 DAG（复用 render-dag.ts，点节点看五问 / 五色进度）。部署在
      website，密码加密、只有我能看。
    why: >-
      在多个项目 / 多台设备间切换时，一眼看到全局进度和下一步走向，快速续上 context； 部署到网页是为了任意设备都能快速预览。
    how: >-
      新增聚合器读取各 opt-in 项目的 docs/ecl/dag/*.ecl.yaml（含 left_off）→ 合成 overview 数据模型
      → 扩展 render-dag.ts 渲染 overview 首页 + 各项目详情页 → 客户端密码加密 → 经 Hugo/website 部署到
      GitHub Pages 的 /dag/ 路径 → workflow 命令（ccplan/ccedit/ccdiscuss）动了任一 dag
      yaml 时自动再生成 + 部署。
    why_this_way: >-
      不重造图渲染与部署（已有），只新增「聚合 + 加密 + 触发」三块；以 dag yaml 为唯一 数据源，图永不与数据漂移；opt-in
      保证半成品不会混入总览。GitHub Pages 客户端加密 在「多设备可访问」与「私有」之间取平衡，零新增托管。

# ─── 验证定义（Step 5）─────────────────────────────────────────
# 整体验收 = 各节点 verification 全过 + 一条 soft 人审（直观性 / 续接 context 是否够）。
verification:
  kind: value
  checks:
    - name: "overview_cluster_count_eq_optin_count"
      type: number
      expected: 0 # 占位：= 当前 opt-in（有 dag yaml）的项目数，规划期填实际值
      comparison: "actual === expected"
    - name: "node_click_opens_five_questions"
      type: boolean
      expected: true
      comparison: "actual === expected"
    - name: "status_colors_rendered"
      type: boolean
      expected: true
      comparison: "actual === expected"
    - name: "in_progress_highlighted_in_overview"
      type: boolean
      expected: true
      comparison: "actual === expected"
    - name: "encrypted_without_password_unreadable"
      type: boolean
      expected: true
      comparison: "actual === expected"
    - name: "decrypts_with_correct_password"
      type: boolean
      expected: true
      comparison: "actual === expected"
    - name: "deployed_artifact_exists_on_website"
      type: boolean
      expected: true
      comparison: "actual === expected"
    - name: "dag_mutation_triggers_regenerate_and_deploy"
      type: boolean
      expected: true
      comparison: "actual === expected"

soft_signoff:
  kind: soft
  rationale: >-
    「直观看到下一步往哪走」「方便续接 context」是主观体验，无单一数值可衡量； 需本人在真实多设备切换场景下试用后签字确认。
  sign_off:
    required: true
    approver: human
    status: pending

# ─── ECL 节点（Step 6）每个节点自带五问 ────────────────────────
# FN 层依赖：NODE-001 → NODE-002 → NODE-003；NODE-004 依赖 002 + 003。
ecl_nodes:
  - id: NODE-001
    title: "跨项目 DAG 聚合器"
    reuse: reuse-extend # 扩展 dashboard 扫描 + dag yaml 读取
    depends_on: []
    five_questions:
      what: "一个聚合器：扫描 opt-in 项目，读取各自 docs/ecl/dag/*.ecl.yaml，合成一份 overview 数据模型（每项目一簇
        milestone 级节点 + 从 left_off 标出在做/下一步）。"
      why: "overview 首页需要一份跨项目的统一数据；不重复造每仓的 dag 数据，只做聚合。"
      how: "复用 dashboard 的 scanSshReposDir 找仓，筛出含 dag yaml 的（opt-in），解析 yaml 的
        milestones/status/left_off，输出合并模型（JSON）。"
      why_this_way: "opt-in（有 dag yaml 才纳入）保证半成品不混入；以 yaml 为唯一源避免漂移。"
      expected_result: "给定 N 个含 dag yaml 的项目，聚合器输出恰好 N 个项目簇，每簇含其 milestone 节点与状态，且
        in_progress 节点被标出。"
    expected_result_human: "扫描所有 repo，有 docs/ecl/dag/*.ecl.yaml 的就进 overview，否则忽略。"
    alignment:
      {
        what: aligned,
        why: aligned,
        how: aligned,
        why_this_way: aligned,
        expected_result: aligned
      }
    verification:
      kind: value
      checks:
        - name: "cluster_count_eq_optin_count"
          type: number
          expected: 0 # 规划期填实际 opt-in 数
          comparison: "actual === expected"
        - name: "in_progress_nodes_flagged"
          type: boolean
          expected: true
          comparison: "actual === expected"

  - id: NODE-002
    title: "Overview 渲染（扩展 render-dag）"
    reuse: reuse-extend
    depends_on: [ NODE-001 ]
    five_questions:
      what: "扩展 render-dag.ts：把聚合模型渲染成 overview 首页（每项目一簇 milestone
        级节点、五色状态、高亮在做的），并把各项目详情页接成可点进的集合。"
      why: "用户要两层导航：先看跨项目 overview，再点进单项目详细 DAG。"
      how: "新增 overview 首页布局（cluster），复用现有单仓渲染做详情页；点节点弹五问面板（已有能力）。"
      why_this_way: "现有 render-dag 已有点节点看五问 + 五色，只补 overview 这一层，改动最小。"
      expected_result: "打开产物：首页显示所有项目簇，节点上色、在做的高亮；点任一节点 → 进该项目详细 DAG 并能看五问。"
    expected_result_human: "第一个是 overview 只显示 milestone 级别；后面每个项目一张 DAG，点进去和其他 DAG 一样。"
    alignment:
      {
        what: aligned,
        why: aligned,
        how: aligned,
        why_this_way: aligned,
        expected_result: aligned
      }
    verification:
      kind: value
      checks:
        - name: "overview_has_one_cluster_per_project"
          type: boolean
          expected: true
          comparison: "actual === expected"
        - name: "node_click_opens_five_questions"
          type: boolean
          expected: true
          comparison: "actual === expected"
        - name: "status_colors_rendered"
          type: boolean
          expected: true
          comparison: "actual === expected"

  - id: NODE-003
    title: "私有部署（StatiCrypt 加密 → 现有 website → tzj2006.github.io/dag/）"
    reuse: reuse-adapt # 加密是新增；部署复用现有 Hugo/website→tzj2006.github.io 链
    depends_on: [ NODE-002 ]
    # 2026-06-25 第二轮 ccdiscuss 细化：撤销「私有 repo gadget-dag」，复用现有部署链；
    # 加「输错 N 次跳 404」行为。详见文件末 decisions / open_items。
    five_questions:
      what: "把 overview 产物用 StatiCrypt 加密后，作为现有 Hugo 站的一部分发布到
        tzj2006.github.io/dag/；打开显示密码框，输对解密，输错累计 3 次跳 /404。不新开 repo。"
      why: "gadget 仓已是 PRIVATE，源码/dev 内容本就不公开；唯一公开面是 tzj2006.github.io 用户站，故用
        StatiCrypt 加密 + 404 兜底遮住内容存在性。复用现有部署链省维护。"
      how: "renderOverview 产物 → staticrypt 加密（自定义模板：错满 3 次 window.location → /404）→ 放进
        website 的 static/(或 content/) → 现有 website/update.sh 构建并推送到
        tzj2006.github.io repo。密码经 env（不入库）。"
      why_this_way: "零新增 repo、复用现成 website→Pages
        发布链；StatiCrypt（AES-256+PBKDF2）静态托管友好；错满 N 次跳 404 比默认内联『Bad
        password』更不暴露『此处有受保护内容』。"
      expected_result: "未解密只见密文/伪装，看不到任何图；输对密码看到 overview；连错 3 次跳 404；产物发布在
        tzj2006.github.io/dag/，域名不变、无新 repo。"
    expected_result_human: "认可不开新 repo、DAG 进现有 Hugo 站、发到
      tzj2006.github.io/dag/、StatiCrypt 加密；解密失败（输错几次后）去 404 界面。"
    alignment:
      {
        what: aligned,
        why: aligned,
        how: aligned,
        why_this_way: aligned,
        expected_result: aligned
      }
    config:
      deploy_target: "tzj2006.github.io/dag/ (经 website/update.sh →
        TzJ2006/tzj2006.github.io 公开用户站 repo)"
      encryption: "StatiCrypt (npm v3.5.4)"
      wrong_password_redirect_after: 3 # 累计错 3 次跳 /404
      password_source: "env (e.g. STATICRYPT_PASSWORD)，不入库"
    verification:
      kind: value
      checks:
        - name: "without_password_unreadable"
          type: boolean
          expected: true
          comparison: "actual === expected"
        - name: "decrypts_with_correct_password"
          type: boolean
          expected: true
          comparison: "actual === expected"
        - name: "wrong_password_3x_redirects_to_404"
          type: boolean
          expected: true
          comparison: "actual === expected"
        - name: "deployed_to_tzj2006_github_io_dag"
          type: boolean
          expected: true
          comparison: "actual === expected"
        - name: "no_new_repo_created"
          type: boolean
          expected: true
          comparison: "actual === expected"

  - id: NODE-004
    title: "自动同步触发（workflow 命令动 DAG → 再生成 + 部署）"
    reuse: reuse-extend # 扩展 sync.py + workflow 命令/钩子
    depends_on: [ NODE-002, NODE-003 ]
    five_questions:
      what: "当 ccplan/ccedit/ccdiscuss 修改任一 dag yaml 时，自动触发『聚合 → 渲染 → 加密 →
        部署』；并提供手动入口（如 sync.py 新增 dag 类目 / 一条命令）。"
      why: "用户的『实时』= sync 驱动；希望动了 DAG 就自动更新已部署的图，也保留手动 sync。"
      how: "在 workflow 命令收尾或经 hook 检测 dag yaml 变更后调用再生成+部署管线；sync.py 增加 dag 类目做手动触发。"
      why_this_way: "对齐用户对『实时』的定义（命令驱动而非文件级监听），实现简单、复用现有 sync。"
      expected_result: "修改某 dag yaml 后触发一次，website 上的 overview 随之更新到最新状态。"
    expected_result_human: "我去 sync，或 claude code 在 ccplan/ccedit/ccdiscuss 动了 DAG 时自动帮我 sync。"
    alignment:
      {
        what: aligned,
        why: aligned,
        how: aligned,
        why_this_way: aligned,
        expected_result: aligned
      }
    verification:
      kind: value
      checks:
        - name: "dag_mutation_triggers_regenerate_and_deploy"
          type: boolean
          expected: true
          comparison: "actual === expected"
        - name: "manual_sync_entrypoint_works"
          type: boolean
          expected: true
          comparison: "actual === expected"

