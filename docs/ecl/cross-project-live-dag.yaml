  - "overview_cluster_count 的 expected 值待规划期按实际 opt-in 项目数填实。"
  - "⚠️ 探测发现：现有 dag yaml 的 status 只有 done/pending，无 in-progress
    节点、left_off.in_progress 为空 → 『高亮正在做的』暂无活数据；渲染需做空态兜底，用 frontier_next
    表达『下一步』。"
  - "StatiCrypt 口令管理（单口令 vs 每设备）由 /ccplan 定；口令经 env 不入库。"

