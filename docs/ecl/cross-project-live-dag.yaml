# ─── 决策变更日志 ──────────────────────────────────────────────
decisions:
  - id: DEC-001
    date: "2026-06-25"
    decision: "撤销『push 到私有 repo gadget-dag』方案。"
    rationale: "gadget 已是 PRIVATE 仓且已有 website→tzj2006.github.io 部署链；新 repo
      多余。改为复用现有链发到 /dag/，靠 StatiCrypt + 404 兜底私有性。"
    supersedes: "上一轮 Phase 3 选项『私有repo + StatiCrypt双保险』"
  - id: DEC-002
    date: "2026-06-25"
    decision: "StatiCrypt 解密：密码框正常显示，累计输错 3 次 → 跳 /404（非默认内联报错）。"
    rationale: "比『Bad password』更不暴露『此处有受保护内容』；保留容错入口。"

# ─── 移出本功能范围的待决 idea（独立，之后单独 ccdiscuss）──────
deferred_ideas:
  - id: IDEA-split-repos
    title: "把 gadget 拆成 public（代码/工具）+ private（测试/私人内容）两个仓"
    status: deferred
    note: >-
      与本 DAG 功能正交（gadget 现已私有，DAG 不依赖拆分）。早先提的『sync 作为新功能』
      可作为 public↔private 之间的桥来设计。
    # 第三轮 ccdiscuss（2026-06-26）：用户决定「先部署，拆仓单独再做」，但已对齐拆分边界。
    aligned_boundary:
      public_repo: "通用工具代码：summarize / research / benchmark / website / workflow /
        ai-companion / common 等。"
      private_repo: "tokens（secrets）、个人测试内容、dag 数据（docs/ecl/dag/*.ecl.yaml 描述私有项目进度）、
        私人笔记。"
      hard_blocker: "拆分前必须从 git 历史清理曾提交过的私人内容/secrets（否则公开仓泄露）。"
      deploy_interaction: "若 gadget 将来变公开，dag-yaml 数据必须随 private 仓走，不能进公开仓。
        当前 gadget 私有，故先部署最安全。"
      next: "单独一轮 ccdiscuss 细化（git 历史清理策略 + 两仓同步桥 + CI）。"

