    - {
        attack: ATK-002,
        verdict: mitigated,
        mitigation: "空态兜底 + frontier_next 显示下一步 (F-001/FN-006)"
      }
    - {
        attack: ATK-003,
        verdict: mitigated,
        mitigation: "仅实变触发 + try 不阻断 + 跳过开关 (F-006)"
      }
    - {
        attack: ATK-004,
        verdict: mitigated,
        mitigation: "相对路径 + env base 覆盖 (F-005)"
      }
    - { attack: ATK-005, verdict: accepted, mitigation: "MVP 项目少可接受；后续懒加载/分页" }
    - {
        attack: ATK-006,
        verdict: mitigated,
        mitigation: "noindex + 不公开链接 (F-004/FN-011)"
      }

