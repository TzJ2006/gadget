# ─── Phase 5: 对抗过滤（挑刺）每项审计，findings ≥ max(3, items/2）─
adversarial_findings:
  - id: F-001
    target: REQ-001
    dimension: missing-data / error-path
    severity: high
    finding: "『高亮正在做的』无活数据：现有 dag yaml status 仅 done/pending，left_off.in_progress 空。"
    resolution: "FN-006 做空态兜底，用 frontier_next 表达『下一步』；并在 open_items 提示需让 ccedit 回写
      in-progress 状态。"
    status: resolved
  - id: F-002
    target: FEAT-001
    dimension: scalability / completeness
    severity: medium
    finding: "gadget 自身无 dag yaml → overview 只有 ai-companion 一簇，达不到『总结所有项目』。"
    resolution: "open_item：规划后先给 gadget 等补 dag（逆向生成）。MVP 允许少簇但 log 出已纳入/缺失项目。"
    status: resolved
  - id: F-003
    target: FEAT-003
    dimension: security
    severity: high
    finding: "StatiCrypt 是密码强度决定的安全；弱口令或口令进 git 历史即失效。"
    resolution: "口令经 env（STATICRYPT_PASSWORD）不入库；要求强口令；ECL 明确这是『中等安全』非机密级。404 仅遮存在性，非真鉴权。"
    status: resolved
  - id: F-004
    target: FEAT-003
    dimension: error-path / privacy
    severity: medium
    finding: "加密后整页对搜索引擎/sitemap 仍可能暴露 /dag/ 路径结构。"
    resolution: "FN-011：/dag/ 加 noindex + 不在公开导航链接。"
    status: resolved
  - id: F-005
    target: MOD-001
    dimension: modularity / config
    severity: medium
    finding: "projects.json 指向其他 repo 的绝对路径 → 跨设备不一致、硬编码。"
    resolution: "路径用相对（相对 gadget root / repo root），支持 env 覆盖 base。"
    status: resolved
  - id: F-006
    target: FEAT-004
    dimension: error-path / performance
    severity: medium
    finding: "命令收尾触发会拖慢/可能阻断 ccplan/ccedit/ccdiscuss（生成+加密+Hugo 构建耗时）。"
    resolution: "仅在 dag yaml 实变时触发；包 try，部署失败仅告警不阻断；提供跳过开关。"
    status: resolved
  - id: F-007
    target: FEAT-002
    dimension: scalability
    severity: low
    finding: "项目多时 mermaid 多 subgraph 可能拥挤。"
    resolution: "MVP 项目少可接受；后续可折叠/分页。记为 low，不阻塞。"
    status: accepted

