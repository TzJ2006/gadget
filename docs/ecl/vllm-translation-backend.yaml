decisions:
  - id: DEC-001
    decision: "vLLM on Linux, transformers on Windows"
    rationale: "vLLM has no native Windows support; transformers works everywhere"
  - id: DEC-002
    decision: "Offline batch mode (not server mode)"
    rationale: "True batch inference maximizes GPU compute utilization"
  - id: DEC-003
    decision: "Keep tencent/HY-MT1.5-1.8B model"
    rationale: "Already validated translation quality, minimize risk"
  - id: DEC-004
    decision: "Complete Ollama replacement, no dual backend"
    rationale: "User wants simplicity, no dead code"

