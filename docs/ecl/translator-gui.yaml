ecl_version: "1.0"
feature: "translator-gui"
status: completed              # implemented + verified (unit suite + real-model E2E + adversarial review)
created: 2026-06-20
updated: 2026-06-20
source: ccdiscuss + ccplan + ccedit
related_features: ["vllm-translation-backend.yaml"]

pending_input: null

implementation_result:
  code_complete: true
  tests_passing: "18/18 (translator/tests/test_core.py)"
  files_created:
    - "translator/__init__.py"
    - "translator/__main__.py"
    - "translator/core.py"
    - "translator/app.py"
    - "translator/requirements.txt"
    - "translator/tests/test_core.py"
    - "translator/tests/_e2e_real.py"   # manual real-model check (not in unit suite)
  files_modified:
    - "pyproject.toml (added `translator` extra + package)"
    - "common/translation.py (restore_fragments hardened — see DEC-009)"
  new_dependency_installed: "gradio 6.19.0 (AI env)"
