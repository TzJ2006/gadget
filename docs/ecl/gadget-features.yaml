      - "python -m summarize onboard --init-config"

  - feature: "Rclone Remote Sync (summarize logs/reports)"
    description: "Upload/download summarize logs and reports via rclone using summarize.rclone_remote from config.json, with warnings (not crashes) on missing binary or remote dir."
