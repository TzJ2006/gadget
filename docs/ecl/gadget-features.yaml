      - "_rclone_download_logs"

  - feature: "Daily CLI and Unified Entry Point"
    description: "python -m summarize {daily,weekly,monthly,auto,onboard} unified CLI; daily subcommands export/merge/deploy/config; legacy daily_summary.py / weekly_summary.py / monthly_summary.py remain as re-export shims."
    purpose: "One module entry for the whole conversation-report pipeline."
    implementation:
      approach: "__main__.main applies apply_env_from_config first (so auto subprocesses inherit Ollama/translation env), intercepts auto/onboard, else rewrites argv and delegates. Daily cli --api choices are anthropic|openai|ollama|claude_cli with default ollama; cli_defaults() overlays config."
      key_files:
