  - feature: "One-Click Auto Pipeline"
    description: "Orchestrates daily export → merge --sync-all → missing/stale weekly → missing/stale monthly via subprocess, optionally deferring Hugo until the end, then unloads resident Ollama models."
    purpose: "Cron-friendly full pipeline with one command."
    implementation:
      approach: "cmd_auto defaults the aggregation target to yesterday, runs ensure_auto_ready unless --skip-onboard-check, shells out to python -m summarize …, sets GADGET_DEFER_HUGO_UPDATE=1 on deploy steps, then _unload_ollama unless GADGET_KEEP_OLLAMA=1."
      key_files:
        - "tools/summarize/auto.py"
      constraints:
        - "--api is forwarded whenever args.api is set (argparse default ollama, so typically always)"
        - "A failing sub-step logs and continues (does not abort the rest)"
        - "Weekly/monthly regenerate when missing or older than a covered daily"
        - "GADGET_KEEP_OLLAMA=1 skips the final VRAM unload (back-to-back cron)"
    entry_points:
      - "python -m summarize auto --deploy"
    function_names:
      - "cmd_auto"
      - "_unload_ollama"
      - "_find_missing_weeks"
      - "_find_missing_months"

