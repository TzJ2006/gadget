        - "tools/summarize/tests/test_onboarding.py"
      constraints:
        - "Init writes the summarize section of repo-root config.json, not ~/.config/summarize/"
        - "Ollama backend does not require ANTHROPIC_API_KEY; openai/anthropic do"
    entry_points:
      - "python -m summarize onboard"
    function_names:
      - "check_auto_requirements"
      - "ensure_auto_ready"
      - "cmd_onboard"

