      - "load_ccusage_for_date"
      - "_merge_token_usages"
      - "render_usage_card"

  - feature: "Config Initialization and Resolution"
    description: "Reads/writes the summarize section of repo-root config.json, resolves output dirs by CLI > env > config > default, maps long-lived keys into argparse defaults and Ollama/translation env vars."
    purpose: "A single `python -m summarize auto` works after one config --init, without a pile of flags."
    implementation:
      approach: "_load_config → gadget_config.load_section('summarize'). cli_defaults maps default_api/deploy/hugo_site/workers. apply_env_from_config setdefaults OLLAMA_MODEL, OLLAMA_BASE_URL, OPENAI_REASONING_EFFORT, GADGET_TRANSLATION_* from config (real env still wins)."
      key_files:
        - "tools/summarize/config.py"
        - "tools/summarize/tests/test_config.py"
      constraints:
        - "Config path is GADGET_CONFIG or repo-root config.json — not ~/.config/summarize/config.json"
        - "Output-dir precedence: CLI > env var > config.json > hardcoded outputs/…"
        - "Relative paths are rooted at GADGET_ROOT"
        - "device_name falls back to platform.node()"
        - "Default Hugo site is tools/website"
        - "timeout is intentionally NOT a config-driven argparse default (daily 600 / weekly 900 / monthly 1800 differ)"
    function_names:
      - "_load_config"
      - "_save_summarize_config"
      - "_resolve_output_dir"
      - "_get_device_name"
      - "resolve_hugo_site"
      - "cli_defaults"
      - "apply_env_from_config"
    entry_points:
