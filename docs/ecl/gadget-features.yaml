  # ===== Benchmark =====

  - feature: "Hardware Detection And System Info"
    description: "Cross-platform CPU/GPU/OS/Python/torch detection (CUDA/MPS/XPU plus OpenCL listing) and a human-readable --info printout that writes nothing."
    purpose: "Attribute every benchmark row to a machine; inspect hardware without touching the CSV."
    implementation:
      approach: "detect.get_cpu_info / get_gpu_info / get_system_info / print_system_info. OpenCL is detection-only — never benchmarked."
      key_files:
        - "tools/benchmark/benchmark/detect.py"
        - "tools/benchmark/benchmark/cli.py"
      constraints:
        - "GPU run path is cuda/mps/xpu only; OpenCL appears in --info but is never benchmarked"
        - "import benchmark pulls report.py → plotly; --info needs the benchmark extra installed"
    entry_points:
      - "cd tools/benchmark && python -m benchmark.cli --info"
    function_names:
      - "get_cpu_info"
      - "get_gpu_info"
      - "get_system_info"
      - "print_system_info"

  - feature: "CPU FLOPS Benchmarking"
    description: "Three CPU workloads: pure-Python scalar loop (single-core), 1-thread NumPy BLAS GEMM, all-cores BLAS GEMM, timed by RobustTimer (IQR outlier drop, median)."
    purpose: "Scalar vs BLAS CPU numbers for the leaderboard."
    implementation:
      approach: "cpu.py subclasses of BaseBenchmark; FLOPS scalar=2*iters, GEMM=2*N^3*iters."
      key_files:
        - "tools/benchmark/benchmark/cpu.py"
        - "tools/benchmark/benchmark/core.py"
    entry_points:
      - "cd tools/benchmark && python -m benchmark.cli --cpu-only --duration 3"
    function_names:
      - "run_all_cpu_benchmarks"
      - "CpuSingleCoreBenchmark"
      - "CpuAllCoresBenchmark"
      - "CpuSingleCoreBLASBenchmark"
      - "RobustTimer"
      - "BaseBenchmark"

  - feature: "GPU Multi-Precision GEMM Benchmarking"
    description: "A@B GEMM on each cuda/mps/xpu device across supported dtypes (FP64–FP8 where capable), memory-scaled matrix size, errors recorded as result fields rather than crashing the run."
    purpose: "Cross-vendor GPU GFLOPS per precision."
    implementation:
      approach: "gpu.GpuBenchmark / run_all_gpu_benchmarks."
      key_files:
        - "tools/benchmark/benchmark/gpu.py"
      constraints:
        - "Stable result keys include dtype, backend, flops_per_sec (report/ingest/CI parse them)"
        - "OpenCL devices are not benchmarked"
    entry_points:
      - "cd tools/benchmark && python -m benchmark.cli --gpu-only"
    function_names:
      - "run_all_gpu_benchmarks"
      - "GpuBenchmark"
      - "calculate_matrix_size_from_memory"

  - feature: "CSV Results Accumulation (Append-Only)"
    description: "Flattens each result plus system info into a CSV row and appends it. Never overwrite, dedupe, or sort in place."
    purpose: "Multi-hardware history is the leaderboard source of truth."
    implementation:
      approach: "BenchmarkResults.save opens in 'a' mode; header only if the file did not exist. Default path is tools/benchmark/benchmark_results.csv (cwd-relative commands are why AGENTS.md says cd tools/benchmark first)."
      key_files:
        - "tools/benchmark/benchmark/core.py"
        - "tools/benchmark/benchmark/cli.py"
      constraints:
        - "CSV is append-only by design — never rewrite or dedupe in place"
        - "Default path is TOOLS_DIR/benchmark/benchmark_results.csv — not outputs/data/benchmark/results.csv"
        - "Bare python -m benchmark.cli (no flags) runs benchmarks and writes CSV; use --info / --report-only for read-only"
        - "--no-save skips CSV write"
    function_names:
      - "BenchmarkResults"
      - "BenchmarkResults.add"
      - "BenchmarkResults.save"

  - feature: "Interactive HTML Leaderboard Report"
    description: "Reads the accumulated CSV and writes a self-contained dark HTML report with CPU/GPU leaderboards and Plotly charts to outputs/reports/benchmark/report.html."
    purpose: "Shareable leaderboard over all hardware ever appended."
