  - feature: "Token/Cost Usage Tracking (ccusage)"
    description: "Discovers Claude/Codex/Cursor usage sources, shells out to ccusage (global npm or npx), normalizes entries, and persists per-source history JSON next to daily logs."
    purpose: "Attach token/cost stats to daily/weekly/monthly reports without baking usage into the conversation export log."
