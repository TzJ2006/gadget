# Evolving Constraint Language document for gadget — FULL feature-node catalog
# Regenerated 2026-08-14 against CURRENT repo code (not archive).
# Supersedes the 2026-06-01 catalog, which still described workflow/, skills/,
# FastMCP/mcp_server.py, mcp[cli], else→claude_cli dispatch, HY-MT1.5, and
# ~/.config/*/config.json.
#
# Overview: gadget is a Python 3.10+ hub-and-spoke toolkit. Five standalone
#   tools under tools/ (summarize, research, benchmark, website, translator)
#   share a pip-installed common/ foundation (LLM dispatch, disk cache, atomic
#   IO, JSON repair, paths, unified config.json, Hugo deploy, local NMT).
#   common/ never imports tools/; no tool imports another tool (cross-tool only
#   via subprocess or reading config). Dev workflow engine and Claude Code
#   skills live in the sibling repo ../ai-companion (wired via Edit/Write
#   hooks); they are not part of this repo. Plans persist as ECL YAML under
#   docs/ecl/.
# Tech stack: Ollama (default chat + optional translation) / Anthropic SDK /
#   OpenAI SDK / Claude CLI, rclone, Hugo (PaperMod), matplotlib, Plotly,
#   PyMuPDF, pngquant, HandBrakeCLI, Gradio, vLLM / transformers / llama-cpp,
#   arXiv / Semantic Scholar / OpenReview / bioRxiv / PubMed, PyYAML, pytest,
#   argparse, ccusage.
# Node count: 67 feature nodes across 7 subsystems (common, summarize, research,
#   benchmark, website, translator, scripts). No mcp_server / FastMCP / in-repo
#   workflow/ or skills/.

features:

  # ===== Shared Foundation (common/) =====

  - feature: "Unified LLM Dispatch"
    description: "Backend-agnostic LLM calling layer with two tiers: call_llm_raw returns raw text, call_llm returns a parsed JSON dict. Dispatches to ollama, anthropic, openai, or claude_cli."
    purpose: "Lets every gadget tool issue LLM requests through one interface and switch providers via a single --api flag / GADGET_LLM_BACKEND without duplicating SDK/subprocess plumbing."
    implementation:
      approach: "call_llm_raw and call_llm both validate against LLM_BACKENDS and raise ValueError on unknown names (no silent else→claude_cli). ollama and openai share OpenAI-SDK HTTP helpers (_chat_raw / _chat_json); ollama pins a keyless client at 127.0.0.1:11434/v1. Claude CLI shells out to 'claude --print --model ...' via subprocess with a cleaned env. Anthropic lazily imports its SDK, supports optional tool_use and thinking. LLMCallConfig carries prompt, timeouts, max_tokens, per-backend model overrides."
      key_files:
        - "common/llm.py"
        - "common/__init__.py"
        - "common/tests/test_dispatch.py"
      constraints:
        - "DEFAULT_BACKEND = os.environ.get('GADGET_LLM_BACKEND') or 'ollama' (empty env still falls back to ollama)"
        - "LLM_BACKENDS is exactly ('ollama', 'anthropic', 'openai', 'claude_cli'); unknown values raise ValueError listing that tuple"
        - "Default served Ollama chat tag is gemma4:26b (DEFAULT_OLLAMA_CHAT_MODEL); OLLAMA_MODEL > OPENAI_MODEL > that tag; abstract sonnet/opus/haiku aliases are ignored for Ollama"
        - "call_ollama constrains decoding with the caller's anthropic_tools[0].input_schema (response_format json_schema) and promotes every top-level property to required; call_openai stays on json_object because cloud json_schema is strict-only. Without the schema qwen3.8 returns daily_overview's contents as the whole report ~half the time; without the promotion it returns only the declared-required fields"
        - "Ollama base URL: OLLAMA_BASE_URL > OPENAI_BASE_URL > http://127.0.0.1:11434/v1 — never localhost (Windows IPv6 stall)"
        - "Ollama client is keyless (api_key EMPTY unless OPENAI_API_KEY is set)"
        - "_clean_env() strips CLAUDECODE to prevent nested Claude Code sessions"
        - "call_llm_raw honors RuntimeError on Claude CLI FileNotFoundError, non-zero exit (stderr truncated to 500 chars), empty stdout, TimeoutExpired; Anthropic/OpenAI SDK exceptions similarly wrapped"
        - "Anthropic/OpenAI raise RuntimeError if the SDK is missing or the API key env var is unset (openai allows EMPTY key when OPENAI_BASE_URL is set)"
        - "call_anthropic extracts a tool_use block's input first if present, else parses content[0].text; tool_choice forced to the named tool when anthropic_tool_name set"
        - "OpenAI-compatible JSON calls request response_format={'type':'json_object'} and try json.loads first, falling back to parse_json_response"
        - "ANTHROPIC_MODELS maps sonnet→claude-sonnet-5, opus→claude-opus-4-8, haiku→claude-haiku-4-5-20251001; unknown aliases pass through via .get(model, model)"
        - "OPENAI_REASONING_EFFORT, when set, is sent as extra_body.reasoning_effort (local reasoning models); unset leaves real OpenAI calls untouched"
    function_names:
      - "call_llm"
      - "call_llm_raw"
      - "call_anthropic"
      - "call_openai"
      - "call_ollama"
      - "call_claude_cli"
      - "_raw_claude_cli"
      - "_raw_anthropic"
      - "_raw_openai"
      - "_raw_ollama"
      - "_ollama_client"
      - "_openai_client"
      - "_clean_env"
      - "LLMCallConfig"
    notes: "common/__init__.py re-exports call_llm/call_llm_raw/call_anthropic/call_openai/call_claude_cli but not call_ollama. tools/summarize/llm_backends.py is a backward-compat shim over common.llm/json_utils/io."

  - feature: "LLM Chunking, Timeout Detection and Hierarchical Merge"
    description: "Splits large text inputs into char-bounded chunks, runs per-chunk LLM calls with timeout detection, and recursively merges per-chunk JSON summaries until they fit in one call. Includes a per-chunk disk cache that refuses to store parse_error entries."
    purpose: "Allows tools (e.g. summarize) to process inputs far larger than a single context window while caching intermediate chunk results and surfacing actionable timeout errors."
    implementation:
      approach: "chunk_text greedily groups texts so each group stays under max_chars (default 150000). timed_llm_call wraps call_llm, measuring elapsed monotonic time and raising ChunkTimeoutError if elapsed >= 90% of the configured timeout, then runs try_repair_result. hierarchical_merge drops summaries that carry parse_error, serializes the rest to numbered JSON blocks, and if combined size + overhead fits in 150K does one merge call (timeout x3), otherwise splits via chunk_text and recurses. load/save/cleanup_chunk_cache persist per-chunk results keyed by chunk hash with a _chunk_meta envelope."
      key_files:
        - "common/llm.py"
      constraints:
        - "chunk_text default max_chars is 150000; a text is only flushed to a new group when adding it would exceed the limit AND the current group is non-empty"
        - "Timeout heuristic: ChunkTimeoutError only when elapsed >= config.timeout * 0.9; faster failures re-raise the original exception"
        - "ChunkTimeoutError uses chunk_index < 0 to signal the merge phase vs a numbered chunk"
        - "hierarchical_merge raises ValueError if every chunk summary failed JSON parsing"
        - "Merge phase uses merge_timeout = timeout * 3; single-call branch when len(combined)+merge_overhead <= 150000 (merge_overhead = len(merge_prompt)+200)"
        - "load_chunk_cache returns None on missing file, OSError/JSONDecodeError, missing _chunk_meta, mismatch of global_hash / total_chunks, OR if data carries parse_error (poisoned entry)"
        - "save_chunk_cache refuses to write results that have parse_error; OSError is logged, not raised"
        - "cleanup_chunk_cache uses shutil.rmtree(ignore_errors=True)"
    function_names:
      - "chunk_text"
      - "timed_llm_call"
      - "hierarchical_merge"
      - "ChunkTimeoutError"
      - "load_chunk_cache"
      - "save_chunk_cache"
      - "cleanup_chunk_cache"

  - feature: "JSON Parse and Repair"
    description: "Robustly extracts JSON objects from messy LLM responses through staged non-LLM heuristics, with an optional LLM-based repair fallback for unparseable text."
    purpose: "LLMs frequently wrap or malform JSON (markdown fences, trailing prose, unescaped quotes); this guarantees callers get a dict instead of crashing on json.loads."
    implementation:
      approach: "try_parse_json runs three non-LLM stages: (1) direct json.loads, (2) extract from ```json fenced code blocks choosing the largest valid block, (3) depth-based brace matching that keeps scanning from the next '{' if the first balanced region fails. parse_json_response adds stage 4 (_fix_unescaped_quotes) and on total failure returns a sentinel dict. repair_json_with_llm calls call_llm_raw with a Chinese repair prompt using 'single' (haiku) or 'escalating' (haiku→sonnet→opus). try_repair_result triggers LLM repair only when a result carries parse_error + raw_response."
      key_files:
        - "common/json_utils.py"
      constraints:
        - "Stage ordering is fixed: direct parse → markdown code block → depth-based brace match → fix-unescaped-quotes"
        - "Stage 2 prefers the LARGEST valid parsed code block (max by len(json.dumps(d))), not the first"
        - "Stage 3 scans successive '{' starts so a stray brace in prose does not hide the real object"
        - "On unrecoverable failure parse_json_response returns {'raw_response': text, 'parse_error': 'Cannot extract JSON'} instead of raising"
        - "Error-log writing is best-effort when error_log_dir is provided"
        - "repair_json_with_llm truncates input to max_chars (default 5000) and returns None if all model attempts fail"
        - "try_repair_result only attempts repair when both parse_error and raw_response are truthy, and caps repair timeout at min(timeout, 120)"
        - "call_llm_raw is imported lazily inside repair_json_with_llm to break the json_utils ↔ llm circular dependency"
    function_names:
      - "try_parse_json"
      - "parse_json_response"
      - "_fix_unescaped_quotes"
      - "repair_json_with_llm"
      - "try_repair_result"

  - feature: "Atomic File I/O, Content Hashing and Config Loading"
    description: "Low-level filesystem primitives: crash-safe atomic text writes, SHA-256 content hashing, and tolerant JSON config loading with optional memoization."
    purpose: "Prevents partial/corrupt files on interruption and provides hashing + config-read building blocks reused by the cache, chunk cache, and tool configs."
    implementation:
      approach: "atomic_write creates parent dirs, writes to a tempfile.mkstemp in the same directory, then os.replace()s it over the target, unlinking the temp on BaseException. content_hash returns the first N hex chars (default 16) of a UTF-8 SHA-256 digest. load_json_config returns {} on missing file or parse error and memoizes into a caller-supplied dict keyed by str(path)."
      key_files:
        - "common/io.py"
      constraints:
        - "atomic_write writes the temp file in path.parent so os.replace is atomic on the same filesystem"
        - "All writes use UTF-8 encoding"
        - "content_hash truncates SHA-256 hex digest to `length` chars (default 16)"
        - "load_json_config never raises: returns {} for both missing file and OSError/JSONDecodeError"
        - "load_json_config memoization is opt-in (only when a cache dict is passed)"
    function_names:
      - "atomic_write"
      - "content_hash"
      - "load_json_config"
    notes: "Tool runtime settings no longer go through load_json_config on ~/.config paths; they go through common.config (repo-root config.json). load_json_config remains for generic JSON files."

  - feature: "Unified Root Config"
    description: "Single gitignored repo-root config.json for all tools, namespaced by section, with GADGET_CONFIG path override and a tracked config.example.json template. Fail-fast: no ~/.config/... or per-tool legacy paths."
    purpose: "One file for summarize / research / research_scout / sync / translator settings so onboarding, tests, and GitHub clones share a single schema."
    implementation:
      approach: "resolve_config_path reads GADGET_CONFIG if set, else GADGET_ROOT/config.json. load_root_config memoizes the dict (missing/unreadable → {}). load_section returns one top-level key as a dict (missing → {}). update_section merges or replaces a section then save_root_config atomically. Tools wrap this: summarize.config, research.config, research.scout.config, scripts/sync.py, translator/models.py."
      key_files:
        - "common/config.py"
        - "config.example.json"
        - "common/tests/test_config.py"
      constraints:
        - "Resolution is GADGET_CONFIG env (explicit path) → <GADGET_ROOT>/config.json — no ~/.config fallback"
        - "Missing file or section → {} (callers apply their own defaults)"
        - "Sections in the tracked template: summarize, research, research_scout, sync, translator"
        - "update_section default is merge (replace=True overwrites the section)"
        - "save_root_config uses atomic_write and refreshes the in-memory cache"
        - "config.json is gitignored; never commit or quote secrets from it"
        - "Relative filesystem values inside sections are resolved via common.paths.resolve_repo_path (repo root, not cwd)"
    function_names:
      - "resolve_config_path"
      - "load_root_config"
      - "load_section"
      - "save_root_config"
      - "update_section"
      - "clear_cache"
      - "config_path"
    notes: "common/__init__.py re-exports the public config API. Fail-fast contract is documented in common/config.py and docs/ecl/unified-root-config.yaml."

  - feature: "SHA-256 Disk Cache"
    description: "Namespaced disk-backed key/value cache storing JSON entries with creation timestamps and optional TTL expiry, used for API results and LLM analysis."
    purpose: "Avoids repeated expensive API/LLM calls across runs while supporting per-call freshness via TTL and bulk namespace invalidation."
    implementation:
      approach: "DiskCache stores each entry as <cache_dir>/<namespace>/<sha256(key)[:16]>.json containing {_cached_at, _key, data}. get/has read the file, optionally compare time.time()-_cached_at against ttl_seconds, and return entry['data'] (or None). put writes via atomic_write. clear_namespace globs *.json in a namespace dir and unlinks them."
      key_files:
        - "common/cache.py"
      constraints:
        - "Cache filename is the content_hash (SHA-256, first 16 hex chars) of the key, namespaced by subdirectory"
        - "get returns None on cache miss, JSONDecodeError/OSError, or TTL expiry"
        - "TTL is only enforced when ttl_seconds is passed (None = never expire)"
        - "has() is defined as get(...) is not None, so it honors the same TTL logic"
        - "Namespace dir is created lazily on put; cache_dir root is created in __init__"
        - "clear_namespace returns 0 for a non-existent namespace"
    function_names:
      - "DiskCache"
      - "get"
      - "put"
      - "has"
      - "clear_namespace"
      - "_key_hash"
      - "_path_for"
    notes: "tools/research/cache.py is a re-export shim for common.cache.DiskCache."

  - feature: "Canonical Output Path Resolution"
    description: "Module-level constants resolving the project root, tools/ dir, and canonical outputs/ subdirectories (reports, logs, cache, data, images), plus resolve_repo_path for config/CLI filesystem values."
    purpose: "Gives every tool one source of truth for where generated artifacts live, all anchored relative to the project root regardless of cwd."
    implementation:
      approach: "GADGET_ROOT is Path(__file__).resolve().parent.parent; OUTPUTS_DIR and named children are plain Path constants. resolve_repo_path keeps absolute/~ paths and roots relative paths at GADGET_ROOT."
      key_files:
        - "common/paths.py"
      constraints:
        - "GADGET_ROOT is derived from common/paths.py location, so output paths are cwd-independent"
        - "REPORTS_DIR, LOGS_DIR, CACHE_DIR, DATA_DIR, IMAGES_DIR are children of OUTPUTS_DIR = GADGET_ROOT/'outputs'"
        - "TOOLS_DIR = GADGET_ROOT/'tools'"
        - "These are bare path constants — no mkdir on import"
        - "SITE_OUTPUTS_DIR was removed in the 2026-07 single-content-root migration"
        - "resolve_repo_path: absolute and ~ expansions kept; relative paths rooted at GADGET_ROOT then .resolve()"
    function_names:
      - "GADGET_ROOT"
      - "TOOLS_DIR"
      - "OUTPUTS_DIR"
      - "REPORTS_DIR"
      - "LOGS_DIR"
      - "CACHE_DIR"
      - "DATA_DIR"
      - "IMAGES_DIR"
      - "resolve_repo_path"
    notes: "common/__init__.py re-exports all except IMAGES_DIR and TOOLS_DIR."

  - feature: "Hugo Deployment and Generated-Content Writes"
    description: "Cross-platform helper to run a Hugo site's update script, plus helpers that write auto-generated Hugo content/static assets directly into the Hugo site tree, with generated/human ownership markers and force-overwrite backups."
    purpose: "Lets tools (summarize, research, benchmark) deploy generated reports into the Hugo blog's content/static roots without clobbering hand-written pages."
    implementation:
      approach: "run_hugo_update honors GADGET_DEFER_HUGO_UPDATE=1 (orchestrator builds once at the end). Otherwise it resolves hugo_site via resolve_repo_path: Windows prefers update.ps1 then update.sh via Git Bash; UNIX runs update.sh. Write helpers treat resolve_site_staging_root(hugo_site) as hugo_site itself, stamp gadget_generated: true, raise HumanContentError on marker-less files unless overwrite_human=True, and back up differing previous files to outputs/backups/website-force/ when force=True."
      key_files:
        - "common/hugo.py"
        - "common/site_staging.py"
        - "common/website_backup.py"
      constraints:
        - "GADGET_DEFER_HUGO_UPDATE=1 returns True without running a script"
        - "run_hugo_update returns True if a script was found and run (check=True); False + warning when no script exists"
        - "Windows preference: update.ps1, then update.sh via shutil.which('bash'); UNIX: update.sh via bash; cwd is the hugo_site directory"
        - "resolve_site_staging_root(hugo_site) returns the resolved hugo_site itself — no outputs/site staging tree"
        - "write_site_content stamps gadget_generated: true (frontmatter) or <!-- gadget:generated -->; existing human files raise HumanContentError unless overwrite_human=True"
        - "Generated markers also include gadget:src-hash: (bilingual skip); explicit gadget_generated: false is always human"
        - "force=True backs up a differing previous file before overwrite; identical content skips backup"
        - "copy_site_static has no human-content block (static files have no marker channel); force=True still backups"
        - "Unreadable/binary files classify as human (conservative)"
        - "Backups live under outputs/backups/website-force/YYYYMMDD-HHMMSS/ with manifest.json; never auto-deleted"
    function_names:
      - "run_hugo_update"
      - "resolve_site_staging_root"
      - "resolve_site_content_dir"
      - "resolve_site_static_dir"
      - "write_site_content"
      - "copy_site_static"
      - "HumanContentError"
      - "classify_content"
      - "classify_file"
      - "stamp_generated"
      - "backup_file"
      - "record_blocked"
    notes: "common/__init__.py re-exports hugo + site_staging helpers but not website_backup symbols. Verified by common/tests/test_site_ownership.py + test_hugo.py + test_bilingual_skip.py."

  - feature: "Local NMT Engine Factory"
    description: "Pluggable local neural machine translation with four backends (Ollama, vLLM, llama-cpp-python GGUF, transformers) behind TranslationEngine, plus a process-wide engine cache keyed by (backend, model_id)."
    purpose: "Run offline batch translation (default tencent/Hy-MT2-1.8B) without API cost, preferring a shared local Ollama server when the GGUF tag is pulled."
    implementation:
      approach: "create_engine() resolves the HF model id, reads GADGET_TRANSLATION_BACKEND (unknown non-empty value raises), and otherwise auto-selects: Ollama when the default model is requested and the Ollama tag is pulled, else vLLM (not Windows), else llama-cpp, else transformers. In-process engines call _free_ollama_vram before load; OllamaEngine does not. Returns a _CachedEngineProxy so context-manager exit does not unload the shared engine."
      key_files:
        - "common/engine.py"
        - "common/tests/test_engine_ollama.py"
        - "common/tests/test_engine_budget.py"
      constraints:
        - "Ollama backend (the default) translates with the served chat tag: OLLAMA_TRANSLATION_MODEL > OLLAMA_MODEL > gemma4:26b (DEFAULT_TRANSLATION_MODEL_OLLAMA = DEFAULT_OLLAMA_CHAT_MODEL), so one runner serves chat and translation. In-process fallbacks keep the dedicated MT model tencent/Hy-MT2-1.8B; GGUF default tencent/Hy-MT2-1.8B-GGUF"
        - "Model resolution: explicit arg > GADGET_TRANSLATION_MODEL env > default, then .strip()"
        - "Valid GADGET_TRANSLATION_BACKEND values: ollama | vllm | transformers | llamacpp (empty/unset = auto)"
        - "Auto-select: ollama (default model + tag pulled) → vllm → llamacpp → transformers"
        - "Ollama auto-prefer only applies when model_id == DEFAULT_TRANSLATION_MODEL; an overridden model uses in-process backends unless GADGET_TRANSLATION_BACKEND=ollama"
        - "vLLM is force-disabled on win32"
        - "Engine cache keyed by (backend, model_id); a cached engine with is_alive() False is recreated"
        - "SAMPLING_DEFAULTS: top_k=20, top_p=0.6, temperature=0.7, repetition_penalty=1.05"
        - "Ollama native host derived from OLLAMA_BASE_URL/OPENAI_BASE_URL with trailing /v1 stripped; default 127.0.0.1 not localhost"
        - "shutdown_engines() unloads every cached engine and clears the cache (explicit GPU release)"
        - "In-process backends evict resident Ollama models before load; OllamaEngine never evicts itself"
    function_names:
      - "create_engine"
      - "shutdown_engines"
      - "resolve_translation_model"
      - "resolve_ollama_translation_model"
      - "build_chat_messages"
      - "kv_bytes_per_token"
      - "plan_token_budget_batches"
      - "TranslationEngine"
      - "OllamaEngine"
      - "VLLMEngine"
      - "LlamaCppEngine"
      - "TransformersEngine"
      - "_CachedEngineProxy"
    notes: "common/__init__.py __all__ includes all four engines. No CLI; consumed by translation.py, bilingual.py, website scripts, translator, and profile_translation.py."

  - feature: "Markdown Document Translation Pipeline"
    description: "Translates full Hugo markdown documents between English and Chinese: splits frontmatter from body, protects untranslatable fragments, chunks large bodies with a language-aware ceiling, batches prompts, restores fragments, and validates the reassembled output."
    purpose: "Produce bilingual Hugo posts locally while never corrupting code blocks, URLs, shortcodes, file paths, or proper nouns, and rejecting garbage/truncated/echoed model output."
    implementation:
      approach: "translate_markdown_document splits frontmatter, translates reader-facing YAML fields plus body chunks, then validates. translate_body protects fragments via [[[HYMTPH_n]]] placeholders, chunks at header/blank-line boundaries using chunk_ceiling (5000 CJK / 7000 otherwise), batches through engine.generate_batch, then restores. Prompts are Chinese (build_translation_prompt)."
      key_files:
        - "common/translation.py"
        - "common/tests/test_translation_language.py"
        - "common/tests/test_translation_chunking.py"
      constraints:
        - "Frontmatter matched by a leading --- ... --- block; absent it, split_frontmatter returns ('', text)"
        - "Always-translatable keys: summary: and description:; title:/keywords:/tags:/categories: are included only when translating TO English (include_labels=target_lang=='en')"
        - "Protected fragment order: fenced code, Hugo shortcodes, HTML comments, inline code, then http(s) URLs"
        - "chunk_ceiling is 5000 chars for zh source (CJK token density vs Ollama num_ctx 8192) and 7000 for en"
        - "detect_language: CJK (U+4E00..U+9FFF) ratio > 5% => 'zh', else 'en'; empty => 'en'"
        - "validate_translated_output rejects output shorter than 15% of original, marker-only garbage, missing frontmatter delimiters, and same-language echo (wrong_language)"
        - "Frontmatter-field translations use max_new_tokens=512; body chunks use 4096"
        - "zh_path converts foo.md → foo.zh.md"
        - "_call_review_llm pins OPENAI_REASONING_EFFORT=none for the duration of the call (restored after): qwen3.x otherwise spends the whole 1024-token budget in <think> and returns empty content, silently no-opping the review. Unlike the summarize path, thinking adds nothing to this structured-JSON edit"
    function_names:
      - "translate_markdown_document"
      - "translate_documents_batch"
      - "translate_body"
      - "translate_frontmatter"
      - "sanitize_frontmatter_language"
      - "split_frontmatter"
      - "protect_fragments"
      - "restore_fragments"
      - "split_large_text"
      - "chunk_ceiling"
      - "clean_translated_document"
      - "validate_translated_output"
      - "wrong_language"
      - "detect_language"
      - "build_translation_prompt"
      - "count_translation_chunks"
      - "zh_path"

  - feature: "Bilingual Content Writing"
    description: "Writes a single source Hugo markdown file in both English and Chinese, detecting source language, sanity-fixing wrong-language frontmatter, skipping unchanged source via a src-hash marker, and translating to the other language with graceful fallback."
    purpose: "Single entry point for tools to publish bilingual site content; the source-language file is always written even if machine translation fails."
    implementation:
      approach: "write_bilingual detects source language, stamps both sides with <!-- gadget:src-hash:v2:<hash> -->, skips the engine call when both staged files already carry that marker, otherwise sanitizes frontmatter and writes via write_site_content + translate_markdown_document."
      key_files:
        - "common/bilingual.py"
      constraints:
        - "Chinese source → written as .zh.md and translated to English .md; English source → .md then .zh.md"
        - "Returns (en_path, zh_path); Chinese-source English-translation failure falls back to writing Chinese at the English path; English-source Chinese-translation failure returns (en_path, None)"
        - "Identical-source re-runs skip translation even under force (hash marker match on BOTH files)"
        - "_MARKER_VERSION is '2' (title/keywords/tags translation); bumping it forces one re-translate"
        - "Human files without a gadget marker raise HumanContentError unless overwrite_human=True"
        - "Reuses a passed-in engine, else create_engine in a context manager (proxy does not unload on exit)"
    function_names:
      - "write_bilingual"
      - "_hash_marker"
    notes: "Not re-exported from common/__init__.py; import common.bilingual."

  # ===== Summarize — Daily / Weekly / Monthly =====

  - feature: "Daily Export (Phase 1)"
    description: "Scans local AI conversation sources for a target date, builds a per-device export log JSON (optionally with a per-device LLM summary), deduplicates against any prior log, auto-finalizes past dates, and uploads to rclone."
    purpose: "Capture each device's daily AI interactions locally so a central machine can later merge them into a consolidated report."
    implementation:
      approach: "cmd_export resolves the logs dir, calls collect_conversations(), assembles export_data {version, date, device, conversations, device_summary, token_usage, _merged_devices, _source_device, _finalized}, atomically writes logs/YYYY-MM-DD_<device>.json, then rclone-uploads. cmd_export_past discovers dates via discover_all_dates() and loops pending dates."
      key_files:
        - "tools/summarize/daily.py"
        - "tools/summarize/parsers.py"
        - "tools/summarize/config.py"
      constraints:
        - "Export log is written via common.io.atomic_write"
        - "Today is never _finalized; past dates can be"
        - "token_usage on the export log is not the ccusage source of truth — usage lives in separate usage files"
        - "cmd_export_past is invoked when export runs with no --date or with --export-past"
    entry_points:
      - "python -m summarize daily export"
      - "python -m summarize daily export --date 2026-02-13 --summarize"
    function_names:
      - "cmd_export"
      - "cmd_export_past"

  - feature: "Daily Merge (Phase 2)"
    description: "Loads one or more per-device export logs for a date, concatenates conversations labeled by device, calls the LLM, merges token usage, generates a chart + Markdown + JSON report, caches the AI result, and optionally deploys to Hugo."
    purpose: "Consolidate multi-device daily logs into a single authoritative daily report on a central machine."
    implementation:
      approach: "cmd_merge optionally rclone-downloads logs (--sync) or all logs (--sync-all → per-date subprocesses). Skips dates whose existing report is _finalized unless --force/--no-cache. Calls summarizer._call_summarize with a chunk cache, merges ccusage, auto-finalizes past dates, generates the daily chart, saves, optionally Hugo-deploys."
      key_files:
        - "tools/summarize/daily.py"
        - "tools/summarize/summarizer.py"
        - "tools/summarize/usage.py"
        - "tools/summarize/formatter.py"
      constraints:
        - "A report is skipped if existing JSON has _finalized=True unless --force or --no-cache"
        - "Keep JSON field names stable (token_usage, conversation_summaries, device_name, _finalized) — merge parses them across devices"
        - "--before filters --sync-all dates; --workers>1 enables parallel per-date subprocesses"
        - "cmd_legacy exists in daily.py but is not wired into cli.main"
    entry_points:
      - "python -m summarize daily merge --sync-all"
      - "python -m summarize daily merge --date 2026-02-13 --deploy"
    function_names:
      - "cmd_merge"
      - "_cmd_merge_sync_all"
      - "_merge_single_date"

  - feature: "Multi-Source Conversation Parsing"
    description: "Parsers that read Claude Code JSONL, Codex rollout JSONL, Cursor Agent transcripts, ChatGPT export JSON, and generic JSON into a common conversation dict {source, project, timestamp, messages[]}, filtered to a target date."
    purpose: "Normalize heterogeneous AI assistant log formats so the summarizer can treat them uniformly."
    implementation:
      approach: "collect_conversations always scans Claude Code, Codex, and Cursor; ChatGPT/generic are opt-in via CLI paths. _home_dirs always includes Path.home() and, on WSL, /mnt/c/Users/* so Windows-written logs are visible."
      key_files:
        - "tools/summarize/parsers.py"
        - "tools/summarize/tests/test_parsers.py"
      constraints:
        - "Conversation schema: {source in claude_code|codex|cursor|chatgpt|generic, project, timestamp, messages:[{role,content}]}"
        - "Claude project dirs ending in '-summarize' and JSONL files starting with 'agent-' are skipped"
        - "Cursor subagent transcripts are skipped; user wrappers (<user_query>, <timestamp>) are stripped"
        - "Only roles user/assistant are kept; empty-text messages dropped"
        - "discover_all_dates unions Claude, Codex, and Cursor trees"
    function_names:
      - "collect_conversations"
      - "discover_all_dates"
      - "parse_claude_code"
      - "parse_codex"
      - "parse_cursor"
      - "parse_chatgpt_export"
      - "parse_generic"

  - feature: "LLM Summarization Engine"
    description: "Builds the daily summary prompt, dispatches to common.llm.call_llm for any LLM_BACKENDS value, chunking oversized conversation lists, and normalizes local-model JSON (envelope unwrap + summary-field synonyms)."
    purpose: "Turn a day's conversations into a structured report dict even when a local Qwen model renames keys or wraps the payload."
    implementation:
      approach: "_call_single_summarize builds LLMCallConfig and calls call_llm(api, config) — no per-backend wrapper required for ollama. _normalize_report unwraps known envelopes then recovers `summary` from synonyms (one_sentence_summary, …)."
      key_files:
        - "tools/summarize/summarizer.py"
      constraints:
        - "Public wrappers summarize_with_anthropic / openai / claude_cli remain; ollama goes through _call_single_summarize → call_llm"
        - "Conversation chunking default max_chars 150000"
        - "_normalize_report is required for ollama/qwen renamed keys; it must not replace a top-level report with a thin nested decoy"
        - "_finalize_report retries the report call once when _report_content_score is 0 (qwen3.8 answers daily_overview's contents as the whole report ~1/3 of merges even under schema-constrained decoding); _renest_overview is the last resort, re-nesting that payload and lifting global.what into summary so the report is degraded, never blank"
    function_names:
      - "_call_summarize"
      - "_call_single_summarize"
      - "_normalize_report"
      - "_unwrap_envelope"
      - "chunk_conversations"
      - "format_conversations"

  - feature: "Report Rendering and Hugo Post Generation"
    description: "Turns a daily report dict into Markdown, writes JSON+MD to outputs/reports/summarize/, and generates a bilingual Hugo post under content/bugJournal/daily/."
    purpose: "Human-readable daily reports plus site pages from the same JSON."
    implementation:
      approach: "generate_markdown sorts lists by importance, splits by level metadata, and lists all sources. generate_hugo_post writes via write_bilingual / write_site_content. save_report writes JSON+MD atomically and backups existing files."
      key_files:
        - "tools/summarize/formatter.py"
        - "tools/summarize/backup.py"
      constraints:
        - "Markdown generator must tolerate bare-string list items (off-schema local-model output)"
        - "Generated Hugo pages are stamped gadget_generated: true"
    function_names:
      - "generate_markdown"
      - "generate_hugo_post"
      - "save_report"

  - feature: "Hugo Deployment (Batch)"
    description: "Deploys existing daily reports into the Hugo site (optional --force backup, optional --overwrite-human) then runs the site update script."
    purpose: "Publish already-generated reports without re-calling the LLM."
    implementation:
