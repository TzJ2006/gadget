        - "Catches load failures per-implementation and prints 'FAILED - <err>' instead of raising"
        - "Has no __main__ guard or functions; all logic runs at import/exec time"
    entry_points:
      - "python _check_attn.py"
    function_names: []
    notes: "Throwaway diagnostic at repo root (leading underscore name). Not referenced by any tool, CLI, or pyproject entry; will actually download/load the ~1.8B model and requires a CUDA device."

  # ===== Unified Agentic Workflow =====

  - feature: "Active Spec Management (SPEC Stage)"
    description: "Creates, loads, and clears the single active task specification stored at workflow/active-spec.json. The spec defines task_id, goal, scope, constraints, non_goals, success_criteria, and plan, and acts as the proof-of-gate artifact for the rest of the workflow."
    purpose: "Encodes the SPEC stage of the Unified Agentic Workflow: an agent must define and get approval for a structured spec before any code is written, giving downstream stages (verify, review) a machine-readable source of truth."
    implementation:
      approach: "create_spec validates that all REQUIRED_FIELDS are present and that success_criteria is non-empty, then injects a UTC ISO timestamp and writes the spec as UTF-8 JSON (indent=2, ensure_ascii=False) to ACTIVE_SPEC_PATH. load_spec raises SpecNotFoundError if the file is missing; clear_spec unlinks it if present. Path is resolved relative to the module file (WORKFLOW_DIR / 'active-spec.json')."
      key_files:
        - "workflow/active_spec.py"
        - "AGENTS.md"
      constraints:
        - "REQUIRED_FIELDS enforced on create: task_id, goal, scope, constraints, non_goals, success_criteria, plan; any missing raises ValueError('missing required fields: ...')"
        - "success_criteria must be truthy/non-empty or create_spec raises ValueError('success_criteria cannot be empty')"
        - "timestamp is always overwritten with datetime.now(timezone.utc).isoformat() at create time"
        - "spec written as indent=2 UTF-8 JSON with ensure_ascii=False"
        - "load_spec raises SpecNotFoundError (subclass of FileNotFoundError) when file absent; clear_spec is a no-op if file absent"
        - "ACTIVE_SPEC_PATH is fixed at workflow/active-spec.json relative to the module (gitignored runtime state)"
    entry_points:
      - "python workflow/active_spec.py"
    function_names:
      - "create_spec"
      - "load_spec"
      - "clear_spec"
      - "SpecNotFoundError"
    notes: "active_spec.py has no __main__ block / argparse CLI despite CLAUDE.md listing 'python workflow/active_spec.py' as a command; module exposes functions only. check_spec.py and verify.py reference it, and AGENTS.md says spec can be written 'manually'."

  - feature: "Verification Gate (VERIFY Stage)"
    description: "Runs every success_criteria command from the active spec as a shell subprocess and reports pass/fail per criterion plus an overall verdict, with a terminal summary."
    purpose: "Implements the VERIFY stage: executable acceptance tests gate task completion. Wired as a Claude Code Stop hook by install.py so a session cannot silently finish with failing criteria."
    implementation:
      approach: "run_verification loads the spec and calls _check_criterion on each criterion dict. _check_criterion runs the command with subprocess.run(shell=True, capture_output=True, text=True, timeout=300). If expected == 'all pass', pass requires returncode == 0; otherwise the stripped expected string must be a substring of stdout. TimeoutExpired yields a fail with actual='TIMEOUT (300s)' and exit_code=-1. VerificationResult.passed is True only if all criteria pass. As __main__, SpecNotFoundError prints a no-op message and exits 0; otherwise exits 0 on pass, 1 on fail."
      key_files:
        - "workflow/verify.py"
        - "workflow/active_spec.py"
        - "AGENTS.md"
      constraints:
        - "Each criterion must be a dict with 'command' and 'expected' keys"
        - "expected=='all pass' => pass iff subprocess returncode == 0; any other expected => pass iff expected.strip() is a substring of stdout.strip()"
        - "Per-command timeout is 300 seconds; timeout produces status 'fail' with actual 'TIMEOUT (300s)' and exit_code -1"
        - "Overall passed requires ALL criteria status=='pass' (all(...))"
        - "actual falls back to stderr.strip() when stdout is empty"
        - "Run as script: missing spec => print message and exit 0 (not failure); otherwise exit code is 0 if passed else 1"
        - "Commands run with shell=True (criteria are trusted spec content)"
    entry_points:
      - "python workflow/verify.py"
    function_names:
      - "run_verification"
      - "_check_criterion"
      - "VerificationResult"
      - "VerificationResult.terminal_summary"

  - feature: "Spec-Enforcement PreToolUse Hook (check_spec)"
    description: "Claude Code PreToolUse hook that blocks Write/Edit operations on code files when no active-spec.json exists, while exempting documentation/config files and specific paths."
    purpose: "Hard-enforces the Confirmation Gate from AGENTS.md: agents cannot create or modify code without first establishing an approved spec, making the spec file the proof that the gate was passed."
    implementation:
      approach: "check() returns ('ALLOWED', 0) immediately if ACTIVE_SPEC_PATH exists. Otherwise it parses tool_input JSON from stdin, extracts file_path, normalizes absolute D:/Github/gadget paths (both slash styles) to relative, and consults is_exempt(). is_exempt allows the write if the (slash-normalized) path starts with any EXEMPT_PATHS prefix or ends with any EXEMPT_EXTENSIONS suffix. Non-exempt code writes return a BLOCKED message and exit code 2 (stderr message blocks the tool). main() also provides --test-no-spec and --test-with-spec self-test modes that temporarily rename/create the spec and print BLOCKED/ALLOWED."
      key_files:
        - "workflow/hooks/check_spec.py"
        - "AGENTS.md"
      constraints:
        - "Exit code contract: 0 = allowed (spec exists or exempt), 2 = blocked; stderr text is shown as the block message"
        - "If spec file exists, always ALLOWED regardless of target"
        - "Empty/missing file_path or unparseable stdin JSON => ALLOWED"
        - "EXEMPT_EXTENSIONS: .md, .json, .toml, .yaml, .yml, .txt, .csv, .lock"
        - "EXEMPT_PATHS prefixes (slash-normalized): reviews/, outputs/, workflow/active-spec.json, .claude/"
        - "Path matching normalizes backslashes to forward slashes before prefix check; absolute repo paths stripped of D:/Github/gadget/ prefix"
        - "Self-test modes (--test-no-spec / --test-with-spec) restore prior spec state in a finally block"
    entry_points:
      - "python workflow/hooks/check_spec.py"
      - "python workflow/hooks/check_spec.py --test-no-spec"
      - "python workflow/hooks/check_spec.py --test-with-spec"
    function_names:
      - "check"
      - "is_exempt"
      - "main"
    notes: "CLAUDE.md lists exempt extensions as .md/.json/.yaml/.yml/.txt but the code additionally exempts .toml, .csv, and .lock. The absolute-path prefix list (D:/Github/gadget) is hardcoded to this repo, so on other installs only relative-path matching is reliable."

  - feature: "Dual-Format Review Log Generator (REVIEW Stage)"
    description: "Generates paired review logs from a ReviewData object: a human-readable Markdown file and a machine-parseable agent .json file, named YYYY-MM-DD-<task_id>.{md,agent.json}."
    purpose: "Implements the REVIEW stage so every completed task leaves an audit trail readable by humans and resumable by future agent sessions (which read reviews/*.agent.json for prior context)."
    implementation:
      approach: "generate_review renders templates/review-human.md.j2 via jinja2 Template for the .md, and builds a structured dict (schema_version '1.0' with spec, plan, changes, reasoning_chain, verification, debug_history, next_steps) serialized as indent=2 UTF-8 JSON. task_id is sanitized (spaces and slashes to dashes) and date is UTC. ChangeEntry and ReviewData dataclasses model the inputs; ChangeEntry.reason_because/therefore are nested under reason in the JSON. If data.sub_module is set, it resolves the git toplevel and writes to BOTH <root>/<sub_module>/reviews and <root>/reviews (falling back to relative dirs if git fails). Returns a tuple of all written paths."
      key_files:
        - "workflow/review_generator.py"
        - "workflow/templates/review-human.md.j2"
        - "workflow/templates/review-agent.schema.json"
        - "AGENTS.md"
      constraints:
        - "Filenames: <YYYY-MM-DD>-<safe_id>.md and .agent.json, where safe_id replaces ' ' and '/' with '-'"
        - "Timestamps use datetime.now(timezone.utc); date_str is %Y-%m-%d, human timestamp '%Y-%m-%d %H:%M UTC'"
        - "Agent JSON pinned to schema_version '1.0' and includes spec (defaults to {goal, success_criteria:[]} when data.spec is None)"
        - "Both files written with encoding utf-8; JSON indent=2 ensure_ascii=False"
        - "When sub_module set, writes to two reviews dirs (sub-module first, then root); git toplevel resolved via 'git rev-parse --show-toplevel' with fallback on CalledProcessError/FileNotFoundError"
        - "Default output_dir is Path('reviews'); output dirs created with parents=True, exist_ok=True"
    function_names:
      - "generate_review"
      - "ChangeEntry"
      - "ReviewData"

  - feature: "Repo Onboarding / Baseline Review Generation"
    description: "Detects an existing repository's type, modules, and test commands, optionally runs the tests, and writes a baseline v0.1 review log documenting the repo's initial state."
    purpose: "Gives a freshly-installed workflow a day-one context snapshot so future agent sessions inherit a structured understanding of the repo (modules, tech stack, baseline test status)."
    implementation:
      approach: "detect_project sniffs pyproject.toml/requirements.txt (Python), package.json (Node, reads scripts test/test:rust), Cargo.toml or src-tauri/Cargo.toml (Rust), go.mod (Go), derives description from pyproject/package.json/README, and lists key_modules (top-level dirs containing code extensions, excluding build/reviews/outputs/workflow/etc.). _find_test_dirs locates tests/ dirs (top-level and one-level-deep dirs with test_ files). run_tests executes each command via subprocess (shell=True, cwd=target, 120s timeout) capturing truncated output. prepare_baseline_data builds ChangeEntry per module, a reasoning_chain, next_steps, and a spec with success_criteria from test commands, returning a ReviewData with task_id 'baseline-v0.1'. write_baseline_review delegates to generate_review into <target>/reviews. The __main__ flow is interactive (detection confirm, test+preview confirm, write confirm) with -y/--yes/--onboard skips and a --force regenerate flag."
      key_files:
        - "workflow/onboard.py"
        - "workflow/review_generator.py"
        - "workflow/templates/review-human.md.j2"
        - "workflow/templates/onboard-advanced.md"
      constraints:
        - "Requires target/.git to exist or exits with error (in __main__)"
        - "Idempotency: has_baseline returns True if any reviews/*baseline-v0.1.agent.json exists; __main__ exits early unless --force is passed"
        - "verification_status mapping: all tests pass=>'pass', some pass=>'partial', none pass=>'fail', no tests/skipped=>'skip'"
        - "key_modules exclude node_modules, __pycache__, build, dist, target, .git, reviews, outputs, workflow"
        - "test_commands are de-duplicated via dict.fromkeys preserving order; default ['tests/'] if none found"
        - "run_tests timeout 120s per command; output truncated to last 500 chars stdout + last 300 chars stderr"
        - "baseline spec success_criteria use expected 'all pass' per detected test command"
        - "Interactive prompts default to Yes on empty input; EOF/KeyboardInterrupt cancels safely"
    entry_points:
      - "python workflow/onboard.py <target-repo-path>"
      - "python -m workflow.onboard <target-repo-path>"
    function_names:
      - "detect_project"
      - "_find_test_dirs"
      - "run_tests"
      - "prepare_baseline_data"
      - "write_baseline_review"
      - "generate_baseline_review"
      - "has_baseline"

  - feature: "Workflow Install-to-Other-Repo"
    description: "Deploys the Unified Agentic Workflow into any target git repository: copies workflow scripts/hooks/templates, AGENTS.md, creates reviews/, wires Claude Code hooks, adds a .cursorrules stub, and updates .gitignore."
    purpose: "Makes this repo the distributable source of the workflow system so other projects can adopt SPEC->PLAN->IMPLEMENT->VERIFY->REVIEW with one command, then optionally bootstrap a baseline review."
    implementation:
      approach: "install_workflow resolves the target, creates reviews/, copies AGENTS.md from GADGET_ROOT, copies a fixed list of workflow/*.py files (__init__, active_spec, verify, review_generator, debug_report, onboard) plus hooks/ and templates/ (rmtree+copytree to refresh). If target/.claude exists, it loads/merges settings.json and sets PreToolUse (matcher 'Write|Edit' -> python workflow/hooks/check_spec.py, timeout 10) and Stop (-> python workflow/verify.py, timeout 60) hooks. Creates a .cursorrules stub if absent and appends workflow/active-spec.json and outputs/ to .gitignore only if not already present. __main__ requires target/.git, then checks has_baseline and (interactively or via -y/--yes/--onboard) offers to generate a baseline review and print the Phase 2 advanced-onboarding hint."
      key_files:
        - "workflow/install.py"
        - "workflow/onboard.py"
        - "AGENTS.md"
        - "workflow/hooks/check_spec.py"
        - "workflow/verify.py"
        - "workflow/templates/onboard-advanced.md"
      constraints:
        - "Requires target/.git to exist or exits with error"
        - "Copied script set is hardcoded: __init__.py, active_spec.py, verify.py, review_generator.py, debug_report.py, onboard.py (each copied only if source exists)"
        - "hooks/ and templates/ dirs are fully replaced (rmtree then copytree) to avoid stale files"
        - "Claude hooks installed only when target/.claude/ exists; PreToolUse matcher 'Write|Edit' timeout 10, Stop matcher '' timeout 60"
        - "settings.json merge preserves existing keys, creates 'hooks' if missing, then overwrites PreToolUse and Stop lists"
        - ".cursorrules created only if it does not already exist"
        - ".gitignore additions (workflow/active-spec.json, outputs/) appended only if the entry string is not already present"
        - "Baseline offered only when has_baseline is False"
    entry_points:
      - "python workflow/install.py <target-repo-path>"
      - "python workflow/install.py <target-repo-path> --onboard"
    function_names:
      - "install_workflow"
      - "_print_phase2_hint"
    notes: "install.py copies workflow/onboard.py but NOT active-spec.json (correct, since spec is per-task runtime state). The CLAUDE.md/AGENTS.md describe check_spec as the PreToolUse hook; install confirms it. install.py does not copy a CLI entry for active_spec, consistent with active_spec.py lacking a __main__."

  - feature: "Debug HTML Report on Verification Failure"
    description: "On verification failure, produces a terminal hypothesis summary and a standalone HTML debug report (with expected/actual comparison, hypotheses, and log lines) written to outputs/debug/."
    purpose: "Implements AGENTS.md Debug Mode: when success criteria fail, the agent must STOP, present 1-3 reasoned hypotheses with confidence, emit a visual report, and wait for user direction rather than auto-fixing."
    implementation:
      approach: "DebugSession and Hypothesis dataclasses model a failed test (test_name, expected, actual, hypotheses with because/therefore/confidence/evidence, log_lines). generate_terminal_report formats a bordered text summary ending in 'Awaiting your direction'. generate_html_report renders templates/debug-report.html.j2 via jinja2 with the session and a UTC timestamp, then writes to outputs/debug/<YYYY-MM-DD>-<safe_name>.html (test_name sanitized: spaces/slashes -> dashes). Default output_dir outputs/debug created with parents=True."
      key_files:
        - "workflow/debug_report.py"
        - "workflow/templates/debug-report.html.j2"
        - "AGENTS.md"
      constraints:
        - "HTML filename pattern: <YYYY-MM-DD>-<safe_name>.html with safe_name replacing ' ' and '/' with '-'"
        - "Default output dir is outputs/debug (created parents=True, exist_ok=True); written UTF-8"
        - "Hypothesis.confidence is intended to be HIGH/MEDIUM/LOW (documented as a comment, not enforced in code)"
        - "Timestamps from datetime.now(timezone.utc)"
        - "Terminal report numbers hypotheses from 1 and always ends with the 'Awaiting your direction' banner"
    function_names:
      - "generate_terminal_report"
      - "generate_html_report"
      - "DebugSession"
      - "Hypothesis"
    notes: "debug_report.py is library-only (no __main__/CLI); it is invoked programmatically. verify.py and debug_report.py are decoupled - verify.py does not import debug_report, so wiring failure->debug report is the agent's responsibility per AGENTS.md."

  # ===== Custom Claude Code Skills =====

  - feature: "Custom Claude Code Skill Catalog"
    description: "A suite of nine custom Claude Code skills (plus one vendored external skill) under skills/, each a self-contained directory with a SKILL.md YAML-frontmatter definition and optional companion files. The suite covers planning, debugging, code optimization, code overview, repo audit/tidy, Slurm GPU discovery, and two academic-paper writing advisors."
    purpose: "Package reusable, domain-specialized Claude Code behaviors (slash commands + passive triggers) that can be installed to ~/.claude/skills/ or used in-place, giving the gadget project consistent agentic workflows for planning, debugging, and code quality."
    implementation:
      approach: "Each skill is a directory containing at minimum SKILL.md with frontmatter (name, description with TRIGGER/DO NOT TRIGGER lines, origin). Companion files provide schemas, catalogs, language references, and slash-command definitions. Skills are model/IDE-config driven (markdown instructions interpreted by the agent), not executable code, with the sole exception of ccplan's guard-check.py. skills-lock.json pins only the external GitHub-sourced huashu-nuwa skill."
      key_files:
        - "skills/CLAUDE.md"
        - "skills/ccplan/SKILL.md"
        - "skills/cchypothesis/SKILL.md"
        - "skills/optimize/SKILL.md"
        - "skills/summarize/SKILL.md"
        - "skills/repo-audit/SKILL.md"
        - "skills/repo-tidy/SKILL.md"
        - "skills/slurm-gpu/SKILL.md"
        - "skills/nature-benchmark-skill/SKILL.md"
        - "skills/NIPS-2025-paper-skill/SKILL.md"
        - "skills/skills-lock.json"
      constraints:
        - "Each skill directory requires at minimum a SKILL.md with YAML frontmatter (name, description, origin) per skills/CLAUDE.md 'Adding New Skills'"
        - "All custom skills carry origin: custom in frontmatter; the external huashu-nuwa skill is the only entry in skills-lock.json (sourceType github, source alchaincyf/nuwa-skill)"
        - "Each skill's description embeds TRIGGER and DO NOT TRIGGER conditions to route between skills (e.g. optimize redirects understand-only requests to summarize; repo-audit redirects cleanup to repo-tidy)"
        - "repo-audit -> repo-tidy -> optimize form a documented pipeline communicating via docs/repo-audit.json (tidy_recommendations / optimize_recommendations)"
        - "Installation is by copying the skill directory to ~/.claude/skills/ (cp -r); no build step"
    entry_points:
      - "/ccplan"
      - "/cchypothesis"
      - "/simplify"
      - "/code-summarize"
      - "/repo-audit"
      - "/repo-tidy"
      - "/slurm-gpu"
    function_names:
      - "main"
      - "run_hook"
      - "find_project_root"
      - "find_ecl_files"
      - "parse_yaml"
      - "check_file_guards"
      - "get_all_guards"
    notes: "Discrepancies found: (1) skills/CLAUDE.md and ccplan/SKILL.md reference companion files under a references/ subdirectory (e.g. 'references/ecl-schema.md', 'references/methods-catalog.md'), but ccplan's files actually live FLAT in skills/ccplan/ (ecl-schema.md, methods-catalog.md, ccplan.md, guard-check.py) — there is no skills/ccplan/references/ directory. (2) NIPS-2025-paper-skill/SKILL.md frontmatter is MISSING the required 'name:' field (only has 'description'); skills/CLAUDE.md states every skill needs name/description/origin and nature-benchmark has all three. (3) skills-lock.json pins ONLY huashu-nuwa (the external skill vendored under skills/.agents/skills/), not any of the nine custom skills. (4) optimize/SKILL.md frontmatter name is 'code-optimizer' and summarize/SKILL.md name is 'code-summarizer' — the directory names (optimize, summarize) differ from the declared skill names."

  - feature: "Evolving Constraint Planning (ccplan)"
    description: "A diverge-then-converge requirement-engineering skill that turns ambiguous requests into a constraint-bound implementation plan, persisting all decisions in an Evolving Constraint Language (ECL) YAML document that survives sessions, compactions, and model switches. Runs a 12-phase spiral (Phase 0-11): calibrate, context scan, hypothesis interrogation, divergent exploration, crystallization, adversarial filtering, dependency completion, feasibility probing, red-blue confrontation, review gate, implementation, feedback loop."
    purpose: "Replace linear planning for ambiguous/conflicting/multi-stakeholder/multi-session tasks, treating every requirement as a falsifiable hypothesis and producing a machine-readable, cross-model-portable plan that any agent can resume cold."
    implementation:
      approach: "Markdown instruction set defining each phase, multi-turn AskUserQuestion protocol, and a continuous-execution mandate (never stop at phase boundaries except for user input, Phase 9 review gate, or explicit pause). Phase 0 performs multi-intent decomposition into priority-ordered tracks plus 9-dimension intent extraction. Phases 5 and 8 spawn context-isolated critic / red-team / blue-team subagents. ECL state (status + pending_input) is the behavioral anchor for compaction recovery. ecl-schema.md defines the full YAML schema with sequential never-reused IDs (REQ/FEAT/MOD/FN/PROBE/ATK/RISK/DEC/ITER/GUARD). methods-catalog.md lists divergent/convergent techniques. The Feature Guard Protocol auto-generates guards at Phase 10 exit."
      key_files:
        - "skills/ccplan/SKILL.md"
        - "skills/ccplan/ecl-schema.md"
        - "skills/ccplan/ccplan.md"
        - "skills/ccplan/methods-catalog.md"
        - "skills/ccplan/guard-check.py"
      constraints:
        - "ECL document stored at docs/ecl/<feature-name>.yaml, one file per feature; cross-reference via related_features"
        - "IDs are sequential within their prefix and NEVER reused, even when an item is invalidated (preserves audit trail)"
        - "Phase 2 exit requires all requirements at validated/deferred with confidence >= 0.7 OR explicit user approval"
        - "Phase 5 critic must audit every REQ/FEAT item individually and produce at least max(3, item_count/2) findings"
        - "Phase 7 requires at least 1 probe per project, with at least 1 mandatory assumption-validation probe regardless of risk scores; risk score = sum of 5 factors (0-15)"
        - "Phase 9 Review Gate is the only mandatory pause before implementation; no implementation code is written until explicit user approval"
        - "Phase 10 guard generation is MANDATORY after all modules pass verification; ECL changes must always be written to disk (never in-memory)"
        - "AskUserQuestion tool (not plain text) is required for all user input to keep the workflow loop alive"
        - "Single-intent prompts take a fast path producing one implicit track T1; over-decomposition is an anti-pattern"
        - "Append-only history/decisions/iterations sections; decisions never deleted only superseded"
    entry_points:
      - "/ccplan"
      - "/ccplan --guard"
      - "/ccplan --guard <path>"
      - "/ccplan --guard --verify"
    function_names: []
    notes: "ccplan/SKILL.md references 'references/methods-catalog.md' and 'references/ecl-schema.md', but both files live flat in skills/ccplan/ (no references/ subdir). The schema lists status values for requirements as hypothesis -> validated -> verified -> implemented (+ invalidated/deferred/superseded); SKILL.md Phase 2 uses hypothesis/validated/invalidated/deferred — consistent but the 'verified' promotion happens in Phase 5."

  - feature: "ECL Feature Guard System (guard-check.py)"
    description: "A portable Python script (no deps beyond Python 3.10+, optional PyYAML) that parses docs/ecl/*.yaml for feature_guard sections and determines whether a given file is protected by an active guard. Serves three roles: CLI tool, Claude Code PreToolUse hook (stdin JSON), and a --verify runner that executes each active guard's verification command."
    purpose: "Prevent accidental regression of implemented features during later bug fixes or feature work by making feature protection machine-readable and persistent on disk (surviving context compaction), so any agent editing a guarded file is warned of the invariants it must preserve."
    implementation:
      approach: "find_project_root() walks up to the nearest .git; find_ecl_files() globs docs/ecl/*.yaml and *.yml, deduplicating on resolved path (case-insensitive-FS safe). parse_yaml() prefers PyYAML with a regex-based _regex_parse() fallback that extracts feature name, status, and the feature_guard guards block. check_file_guards() normalizes the target path to forward-slash project-relative form and matches each active guard's key_files via exact / suffix ('/'+kf) / directory-prefix / fnmatch glob. run_hook() reads tool input JSON from stdin, extracts input.file_path, and prints warnings to STDERR so the hook never blocks the tool call. main() dispatches --hook / --all / --verify / --json / positional file_path. fmt_all() groups guards by active/suspended/retired status counts."
      key_files:
        - "skills/ccplan/guard-check.py"
        - "skills/ccplan/ecl-schema.md"
        - "skills/ccplan/SKILL.md"
      constraints:
        - "Only guards with status == 'active' are matched in check_file_guards (suspended/retired guards are skipped, but kept in the file for audit trail — never deleted)"
        - "Guard lifecycle: active -> suspended -> retired (suspended can re-activate); suspended requires suspended_reason, retired requires retired_date"
        - "ECL files without a feature_guard section are skipped (if not data.get('feature_guard'): continue)"
        - "key_files matching supports four modes: exact equality, suffix match ('/'+kf_norm), directory-prefix match (kf.rstrip('/')+'/'), and fnmatch glob; all path separators normalized to forward slashes"
        - "Paths outside the project root are returned as-is and match no guard"
        - "Hook mode is non-blocking: malformed/empty stdin JSON returns silently, missing file_path returns, no ECL files returns; warnings go to stderr only"
        - "--verify shows commands before running, skips confirmation in non-interactive (non-tty) mode, runs each command with shell=True cwd=root, prints up to 5 stderr lines on failure, and reports passed/failed counts"
        - "guards default to status 'active' when the status field is absent (guard.get('status','active'))"
        - "Regex fallback parser is best-effort: does not handle YAML block scalars, inline comments, or non-space indentation — PyYAML preferred when available"
    entry_points:
      - "python guard-check.py <file_path>"
      - "python guard-check.py --all"
      - "python guard-check.py --verify"
      - "python guard-check.py --hook"
      - "python guard-check.py --json"
    function_names:
      - "find_project_root"
      - "find_ecl_files"
      - "parse_yaml"
      - "_regex_parse"
      - "_extract_list_items"
      - "_extract_between"
      - "_normalize"
      - "check_file_guards"
      - "get_all_guards"
      - "fmt_warning"
      - "fmt_all"
      - "run_hook"
      - "main"
    notes: "Verified against real ECL files in skills/docs/ecl/ (optimize-multilang.yaml, summarize-skill-redesign.yaml): both are status: completed but have NO feature_guard section, so get_all_guards/check_file_guards would skip them — confirming the 'no feature_guard -> continue' branch. The hook setup example in SKILL.md uses a PreToolUse matcher 'Edit|Write' calling 'python /path/to/ccplan/guard-check.py --hook'."

  - feature: "Hypothesis-Driven Debugging (cchypothesis)"
    description: "A scientific-method debugging skill: triage a bug, generate falsifiable hypotheses, verify them with smart dual-track investigation (parallel read-only static analysis + sequential instrumented probing with [DEBUG Hx] tagged stderr logs and git restore cleanup), apply a minimal fix, validate with three-tier tests + optional human confirmation, and emit a diagnostic document."
    purpose: "Eliminate confirmation bias and wasted cycles when a bug's root cause is unknown, by forcing evidence-based verdicts and accumulating information across hypothesis rounds."
    implementation:
      approach: "Six-phase markdown workflow (triage, generate, investigate, fix, loop, report). Phase 1 gathers context, decomposes multi-bug reports by causal relationship (independent/symptom-of/shared-root), and attempts reproduction. Phase 2 emits 3 hypotheses per round (max 9). Phase 3 takes a git safety checkpoint, triages each hypothesis as static (parallel read-only subagent) or needs-instrumentation (sequential probe: insert <=5 tagged stderr logs, run reproduction into .debug/, grep [DEBUG Hx], then git restore . && rm -rf .debug/). Phase 4 applies one fix serially with git restore rollback and three-tier test validation. Diagnostic docs are written to docs/debug/<slug>_<timestamp>.md."
      key_files:
        - "skills/cchypothesis/SKILL.md"
        - "skills/cchypothesis/diagnostic-schema.md"
        - "skills/cchypothesis/cchypothesis.md"
      constraints:
        - "3 hypotheses per round, hard cap of 9 hypotheses (3 rounds) before forced Phase 6"
        - "Phase 3 Step 2 (static analysis) is strictly READ-ONLY; file writes are only allowed in Step 3 instrumented probing, which runs sequentially with mandatory git restore cleanup after EACH hypothesis"
        - "Maximum 5 instrumentation points per hypothesis; debug output must use stderr (never stdout) to avoid corrupting structured output"
        - "Inconclusive static hypotheses auto-upgrade to needs-instrumentation"
        - "Verdict thresholds: confirmed confidence >= 0.7, rejected < 0.3, inconclusive 0.3-0.7"
        - "Never instrument config/data/generated/lock files (.json/.yaml/.toml/dist/build/node_modules/lock files)"
        - "Git safety: stash only if working tree is dirty AND bug is in committed code; fix rollback uses git restore . (not stash) to avoid double-stash"
        - "Instrumented run timeout default 2min, max 10min; on timeout kill + cleanup + mark inconclusive"
        - "Diagnostic docs sanitize sensitive data (strip env vars, redact secrets, project-relative paths) and add docs/debug/ + .debug/ to .gitignore"
        - "Fixes are minimal — no drive-by refactoring; if a fix introduces new failures (fix-broke-more) roll back immediately"
    entry_points:
      - "/cchypothesis \"<bug description>\""
      - "/cchypothesis --multi"
      - "/cchypothesis --no-doc"
      - "/cchypothesis --full-suite"
      - "/cchypothesis --human-confirm"
    function_names: []
    notes: "SKILL.md references diagnostic-schema.md and cchypothesis.md as companion files; the SKILL.md frontmatter name is 'cchypothesis' matching the directory."

  - feature: "Multi-Language Code Optimizer (optimize)"
    description: "Provides concrete Before->After optimization suggestions across five dimensions (simplification/readability, refactoring, idiomatic style, performance, safety & correctness) for Python, Swift, Rust, and TypeScript, with a hub-and-spoke design where SKILL.md holds the universal framework and per-language files hold language-specific check items. Supports an audit-aware mode that consumes optimize_recommendations from docs/repo-audit.json."
    purpose: "Help users improve code quality, safety, performance, and readability with ready-to-apply snippets, and serve as the final stage of the repo-audit -> repo-tidy -> optimize health pipeline."
    implementation:
      approach: "Hub SKILL.md defines philosophy, language detection (--lang flag > extension > syntax heuristics > ask), single-language focus (apply only the matched language file), precedence rules, suggestion output format, the five dimensions, and pipeline integration. Audit-aware mode triggers on --with-audit or a fresh docs/repo-audit.json: validates audit_metadata.version (major 1, optimize_recommendations needs >=1.2) and 7-day freshness, then optimizes files_to_optimize grouped by dimension and duplication_groups, tagging each suggestion [审计 F-NNN]."
      key_files:
        - "skills/optimize/SKILL.md"
        - "skills/optimize/python.md"
        - "skills/optimize/swift.md"
        - "skills/optimize/rust.md"
        - "skills/optimize/typescript.md"
      constraints:
        - "Supported languages limited to Python/Swift/Rust/TypeScript; after detection apply ONLY the matched language file and ignore the others"
        - "Precedence: language-file idiom > universal principle; project CLAUDE.md conventions > language file"
        - "Audit-aware mode consumes only audit JSON with major version 1; optimize_recommendations requires schema >=1.2; default 7-day expiry prompts before using stale audit"
        - "Audit findings with confidence >= 0.8 are listed directly; < 0.8 are tagged [需确认] and skippable"
        - "Flags: --with-audit forces use of audit JSON even if stale; --no-audit ignores audit JSON even if present; default auto-enters audit mode if docs/repo-audit.json exists and is <7 days old"
        - "Guardrails: never rewrite the whole file (show only changed portions), preserve logic, do not guess, skip empty dimensions"
        - "Scale rules: <50 lines = 2-5 inline suggestions; 50-300 = grouped list; 300+/multi-file = .md output"
        - "Simplification & Readability is the highest-priority dimension; performance suggestions must quantify expected impact"
    entry_points:
      - "/simplify"
      - "/optimize --with-audit"
      - "/optimize --no-audit"
      - "/optimize --lang <language>"
    function_names: []
    notes: "Frontmatter name is 'code-optimizer' while the directory is 'optimize'; skills/CLAUDE.md and the slash command both refer to it as optimize/--simplify. SKILL.md's slash usages mix '/simplify' (in frontmatter trigger) and '/optimize ...' (in pipeline examples)."

  - feature: "Paper-Style Code Overview (summarize)"
    description: "Generates a structured, paper-style overview document for a code project with six sections (Highlights, Introduction, Architecture, Implementation, Results, Conclusion & Future Work). Output is scale-adaptive (inline vs OVERVIEW.md) and audience-adaptive via --for, with optional Hugo deploy."
    purpose: "Let anyone from the original author to an external audience quickly understand, navigate, or document a codebase without optimizing or changing it."
    implementation:
      approach: "SKILL.md defines the six-section structure, a Results three-tier data-sourcing strategy (actual outputs > documented examples > code-inferred behavior marked [Inferred from code]), four audience profiles (self/coworker/user/display) each with a section-weight matrix and per-audience guidelines, scale adaptation (<=3 files compact inline; 4-10 standard inline; 11-50 OVERVIEW.md with TOC; >50 architectural module-level mode), and tone rules. code-summarize.md holds the full slash command spec including Hugo deploy via common.site_staging."
      key_files:
        - "skills/summarize/SKILL.md"
        - "skills/summarize/code-summarize.md"
      constraints:
        - "Six-section structure is fixed but depth adapts to scale and audience; never pad a simple project"
        - "Scale thresholds: <=3 code files compact inline; 4-10 full inline; 11-50 emit OVERVIEW.md with TOC; >50 architectural mode grouping by module"
        - "Results must never fabricate — state explicitly when no output artifacts/tests are found; code-inferred results tagged [Inferred from code]"
        - "Future Work must be grounded in code evidence (TODO/FIXME with file:line); purely speculative items prefixed [Suggested], max 1-2"
        - "--for audience (self/coworker/user/display) overrides default general-reader tone and section weights; omitting --for targets a general technical reader (backward compatible)"
        - "--deploy stages Hugo content via common.site_staging conventions and is gadget-project only"
        - "Do NOT trigger on optimize/refactor/fix/extend requests (those go to optimize); match the user's language (Chinese in -> Chinese out)"
    entry_points:
      - "/code-summarize"
      - "/code-summarize <path>"
      - "/code-summarize --deploy"
      - "/code-summarize --for self"
      - "/code-summarize --for coworker"
      - "/code-summarize --for user"
      - "/code-summarize --for display"
    function_names: []
    notes: "Frontmatter name is 'code-summarizer' while the directory is 'summarize'; the slash command is /code-summarize. skills/CLAUDE.md documents this skill under the heading 'summarize (Paper-Style Code Overview)'."

  - feature: "Deep Repo Audit (repo-audit)"
    description: "Performs a deep, read-only analysis of repo structure, logic, dependencies, and configuration across seven prioritized categories, producing two artifacts: a human-readable docs/repo-audit.md health report and a machine-readable docs/repo-audit.json consumed by repo-tidy and optimize."
    purpose: "Understand-before-judging: build a mental model of an unfamiliar project and diagnose its problems with confidence-scored findings, feeding actionable recommendations into the repo-tidy/optimize pipeline."
    implementation:
      approach: "Six-phase workflow: Phase 1 context gathering with deep understanding (directory_map, key_files, implementation_rationale, usage, navigation_hints); Phase 2 dependency mapping (internal import graph, external manifests, orphan files, hub files >30% imported, cycle detection); Phase 3 priority analysis P1-P7 in strict order emitting F-NNN findings each with confidence/status/actionable flags; Phase 4 one-shot batch question collection for low-confidence findings; Phase 5 dual report generation against references/json-schema.md (v1.2) with old-report backup; Phase 6 optional interactive Q&A."
      key_files:
        - "skills/repo-audit/SKILL.md"
        - "skills/repo-audit/references/analysis-heuristics.md"
        - "skills/repo-audit/references/json-schema.md"
      constraints:
        - "Pure read-only: never modifies project files, only writes docs/repo-audit.md and docs/repo-audit.json; never reads .env contents (only existence/tracking)"
        - "Seven priority categories in strict order: structure > logic > duplication > config > dead_code > hardcoded > dependency"
        - "Every finding must carry a 0.0-1.0 confidence score; confidence < 0.7 must have an associated question and is status: unresolved; >= 0.7 is confirmed"
        - "Phase 4 is never skipped — even with zero questions it must announce"
        - "Generated JSON must set audit_metadata.version '1.2' and an ISO-8601 timestamp; tidy_recommendations and optimize_recommendations include only actionable + non-dismissed findings"
        - "Old reports are renamed/backed up before overwrite, keeping at most 3 backups"
        - "actionable_by_optimize is true for P2 logic / P3 duplication / P4 magic numbers / P6 hardcoded; false otherwise"
        - "Scale bounds: directory analysis depth <= 2, key_files <= 20; >100 files samples top-30 recent + entry + hub for P2/P3; >200 files limits deep import tracing to top-50 recent + entry files"
        - "Distinguished from summarize: audit is diagnostic ('what problems'), summarize is descriptive ('what it does')"
    entry_points:
      - "/repo-audit"
      - "/repo-audit --quick"
      - "/repo-audit --structure-only"
      - "/repo-audit --deps-only"
      - "/repo-audit --no-questions"
      - "/repo-audit --update"
    function_names: []
    notes: "Companion references/ subdirectory (analysis-heuristics.md, json-schema.md) is referenced in SKILL.md; not separately verified on disk in this pass but the directory pattern matches repo-tidy's references/."

  - feature: "Working Repo Tidy (repo-tidy)"
    description: "Cleans junk files, archives misplaced files, and reviews git hygiene, applying type-specific rules (code/docs/data/general). All operations are git-stash-backed and require explicit user approval of a proposed plan before execution; files are archived (moved) rather than deleted. Can consume repo-audit's tidy_recommendations."
    purpose: "Safely declutter a working repo by categorizing rather than deleting, keeping every action reversible and user-confirmed, as the middle stage of the repo-audit -> repo-tidy -> optimize pipeline."
    implementation:
      approach: "Five-phase workflow: Phase 1 pre-flight (git check + git stash backup), Phase 2 repo-type selection loading references/<type>.md, Phase 3 scan across three dimensions (junk via git clean -ndX + default junk list, misplaced files, git hygiene) with optional audit-intelligence merge from docs/repo-audit.json, Phase 4 propose full plan and WAIT for approval, Phase 5 execute (move junk to archive/YYYY-MM-DD preserving relative paths, reorganize, git cleanup, ensure archive/ is gitignored, retention reminder)."
      key_files:
        - "skills/repo-tidy/SKILL.md"
        - "skills/repo-tidy/references/code.md"
        - "skills/repo-tidy/references/docs.md"
        - "skills/repo-tidy/references/data.md"
        - "skills/repo-tidy/references/general.md"
      constraints:
        - "NEVER delete files directly (except optionally .DS_Store) — always move to archive/; NEVER modify file contents; NEVER touch git-tracked-and-modified files (only untracked or ignored)"
        - "NEVER skip Phase 4 (Propose Plan) even if user says 'just do it'; no execution without explicit approval"
        - "Always git stash backup in Phase 1 before any operation; respect .gitignore via git clean -ndX / git check-ignore as primary signals"
        - "archive/ is auto-added to .gitignore; archive/ retention reminds but NEVER auto-deletes when >3 date-subdirectories exist; archived files preserve relative path"
        - "Audit intelligence: consume only audit JSON major version 1, 7-day expiry prompt; merge files_to_clean/files_to_reorganize/config_issues tagged [审计推荐] with confidence + finding_id; >=0.8 normal, <0.8 tagged [需确认]"
        - "Uncertain files marked [需确认] in the plan"
        - "Flags: --type <code|docs|data|general>, --scan-only, --git-only, --with-audit, --no-audit"
    entry_points:
      - "/repo-tidy"
      - "/repo-tidy --type code"
      - "/repo-tidy --type docs"
      - "/repo-tidy --type data"
      - "/repo-tidy --scan-only"
      - "/repo-tidy --git-only"
      - "/repo-tidy --with-audit"
      - "/repo-tidy --no-audit"
    function_names: []
    notes: "Frontmatter description's DO NOT TRIGGER redirects code refactoring to 'code-optimizer' (the optimize skill's frontmatter name)."

  - feature: "Slurm GPU Detector (slurm-gpu)"
    description: "Queries a Slurm cluster with read-only sinfo/squeue commands to discover GPU types, their partitions, and current availability (idle/allocated/down), then presents a per-partition and per-node availability summary."
    purpose: "Answer 'what GPUs are available / where can I submit?' on a Slurm cluster without submitting or modifying any jobs."
    implementation:
      approach: "SKILL.md prescribes read-only Slurm commands (sinfo -N for node-level GRES/state, sinfo -o for partition GRES, squeue for per-job allocation), GRES (%G) parsing rules (gpu:type:count, gpu:count -> type unknown, null -> skip), node-state mapping (idle=all free, alloc=all used, mix=cross-reference squeue, down/drain=unavailable), availability math (free = total - allocated), a structured output format, and an error-handling table."
      key_files:
        - "skills/slurm-gpu/SKILL.md"
        - "skills/slurm-gpu/slurm-gpu.md"
      constraints:
        - "All commands are strictly read-only — no jobs submitted or modified"
        - "GRES parsing: gpu:a100:4 -> type=a100 count=4; gpu:4 -> type=unknown; null/empty -> skip node"
        - "Node state mapping: idle=>all GPUs free, alloc=>0 free, mix=>cross-reference squeue, down/drain/drng=>unavailable"
        - "Nodes in multiple partitions: count GPUs once per node but show all partition memberships"
        - "Display GPU type names as-is from Slurm; do not normalize"
        - "Requires Slurm 17.11+ (sinfo GRES support); --free shows only nodes with >=1 free GPU; --partition accepts partial match"
        - "Error handling: missing sinfo => 'Slurm not installed'; squeue failure => estimate from node state only"
    entry_points:
      - "/slurm-gpu"
      - "/slurm-gpu --free"
      - "/slurm-gpu --partition <name>"
    function_names: []
    notes: "Companion slurm-gpu.md (slash command definition) is referenced in skills/CLAUDE.md."

