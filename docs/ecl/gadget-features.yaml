# Evolving Constraint Language document for gadget — FULL feature-node catalog
# Regenerated 2026-06-01 via multi-agent code sweep (11 module analyzers -> completeness critic -> synthesis).
# Supersedes the prior 15-node catalog: expands to the full functional surface of the repo,
# with real function_names / constraints read from source and known discrepancies recorded per node.
#
# Overview: gadget is a Python 3.10+ single-developer utility monorepo. Independent tool dirs
#   (common/, summarize/, research/, benchmark/, website/, workflow/, skills/) share a pip-installed
#   common/ foundation (LLM dispatch, disk cache, atomic IO, JSON repair, paths, Hugo deploy, local NMT).
#   It covers: AI-conversation summarization (daily/weekly/monthly), academic paper discovery +
#   researcher profiling, CPU/GPU benchmarking, bilingual Hugo website automation, rclone multi-device
#   sync, a spec-driven agentic workflow system, and a suite of custom Claude Code skills.
# Tech stack: Anthropic Claude API / Claude CLI / OpenAI, FastMCP, rclone, Hugo, matplotlib, Plotly,
#   PyMuPDF, pngquant, HandBrakeCLI, vLLM / transformers / llama-cpp, arXiv / Semantic Scholar /
#   OpenReview / bioRxiv / PubMed APIs, PyYAML, pytest, argparse, ccusage.
# Node count: 79 feature nodes across 11 subsystems.

features:

  # ===== Shared Foundation (common/) =====

  - feature: "Unified LLM Dispatch"
    description: "Backend-agnostic LLM calling layer with two tiers: call_llm_raw returns raw text, call_llm returns a parsed JSON dict. Dispatches to Claude CLI, Anthropic SDK, or OpenAI SDK based on an api/backend string."
    purpose: "Lets every gadget tool issue LLM requests through one interface and switch providers via a single --api flag without duplicating SDK/subprocess plumbing."
    implementation:
      approach: "call_llm_raw branches on backend ('anthropic'/'openai'/else=claude_cli) to private _raw_* helpers; call_llm branches similarly to call_anthropic/call_openai/call_claude_cli, each returning a dict. Claude CLI calls shell out to the 'claude --print --model ... --system-prompt' binary via subprocess with a cleaned env; Anthropic/OpenAI lazily import their SDKs and read API keys from env. LLMCallConfig (dataclass) carries prompt, timeouts, max_tokens, per-backend model overrides, optional Anthropic tool_use and thinking config."
      key_files:
        - "common/llm.py"
        - "common/__init__.py"
      constraints:
        - "Backend selection is else-defaults-to-claude_cli: any api value other than 'anthropic'/'openai' routes to Claude CLI (call_llm and call_llm_raw)"
        - "Claude CLI invocation no longer forces English output (the _CLI_SYSTEM_PROMPT forced-English system prompt was removed); response language is driven by the per-call prompt's language_instruction so the project's default language (now zh) takes effect"
        - "_clean_env() strips the CLAUDECODE env var to prevent nested Claude Code sessions when shelling out"
        - "call_llm_raw honors its 'raises RuntimeError on failure' contract for all backends: Claude CLI FileNotFoundError, non-zero exit (stderr truncated to 500 chars), empty stdout, AND subprocess.TimeoutExpired are converted to RuntimeError; anthropic/openai SDK exceptions and empty-response IndexError are likewise wrapped"
        - "Anthropic/OpenAI backends raise RuntimeError if their SDK is not installed or the API key env var (ANTHROPIC_API_KEY / OPENAI_API_KEY) is unset"
        - "call_anthropic extracts a tool_use block's input first if present, else parses content[0].text; thinking and tools kwargs only added when configured; tool_choice forced to the named tool when anthropic_tool_name set"
        - "call_openai requests response_format={'type':'json_object'} and tries json.loads first, falling back to parse_json_response"
        - "ANTHROPIC_MODELS / OPENAI_MODELS map short aliases (sonnet/opus/haiku) to concrete model IDs; unknown aliases pass through unchanged via .get(model, model)"
    function_names:
      - "call_llm"
      - "call_llm_raw"
      - "call_anthropic"
      - "call_openai"
      - "call_claude_cli"
      - "_raw_claude_cli"
      - "_raw_anthropic"
      - "_raw_openai"
      - "_clean_env"
      - "LLMCallConfig"
    notes: "ANTHROPIC_MODELS maps opus->claude-opus-4-7 and sonnet->claude-sonnet-4-6 (older than the running model claude-opus-4-8); not a bug, just a version note."

  - feature: "LLM Chunking, Timeout Detection and Hierarchical Merge"
    description: "Splits large text inputs into char-bounded chunks, runs per-chunk LLM calls with timeout detection, and recursively merges per-chunk JSON summaries until they fit in one call. Includes a per-chunk disk cache."
    purpose: "Allows tools (e.g. summarize) to process inputs far larger than a single context window while caching intermediate chunk results and surfacing actionable timeout errors."
    implementation:
      approach: "chunk_text greedily groups texts so each group stays under max_chars (default 150000). timed_llm_call wraps call_llm, measuring elapsed monotonic time and raising ChunkTimeoutError if elapsed >= 90% of the configured timeout. hierarchical_merge serializes summaries to numbered JSON blocks, and if the combined size + overhead fits in 150K it does one merge call (timeout x3), otherwise it splits via chunk_text and recurses. load/save/cleanup_chunk_cache persist per-chunk results keyed by chunk hash with a _chunk_meta envelope."
      key_files:
        - "common/llm.py"
        - "common/__init__.py"
      constraints:
        - "chunk_text default max_chars is 150000; a text is only flushed to a new group when adding it would exceed the limit AND the current group is non-empty (so a single oversized text still forms its own group, never split mid-item)"
        - "Timeout heuristic: ChunkTimeoutError is raised only when elapsed >= config.timeout * 0.9; faster failures re-raise the original exception"
        - "ChunkTimeoutError uses chunk_index < 0 to signal the merge phase ('Merge phase timed out') vs a numbered chunk message"
        - "hierarchical_merge merge phase uses merge_timeout = timeout * 3 and the single-call branch triggers only when len(combined)+merge_overhead <= 150000 (merge_overhead = len(merge_prompt)+200)"
        - "Recursive split uses max_chars = 150000 - merge_overhead and recurses on the merged group results until convergence"
        - "load_chunk_cache returns None on missing file, OSError/JSONDecodeError, missing _chunk_meta, or mismatch of global_hash / total_chunks (cache invalidation keys)"
        - "save_chunk_cache writes via atomic_write and only logs a warning (does not raise) on OSError"
        - "cleanup_chunk_cache uses shutil.rmtree(ignore_errors=True)"
        - "Merged results are wrapped through try_repair_result after each call (auto JSON repair on parse_error)"
    function_names:
      - "chunk_text"
      - "timed_llm_call"
      - "hierarchical_merge"
      - "ChunkTimeoutError"
      - "load_chunk_cache"
      - "save_chunk_cache"
      - "cleanup_chunk_cache"

  - feature: "JSON Parse and Repair"
    description: "Robustly extracts JSON objects from messy LLM responses through staged non-LLM heuristics, with an optional LLM-based repair fallback for unparseable text."
    purpose: "LLMs frequently wrap or malform JSON (markdown fences, trailing prose, unescaped quotes); this guarantees callers get a dict instead of crashing on json.loads."
    implementation:
      approach: "try_parse_json runs three non-LLM stages: (1) direct json.loads, (2) extract from ```json fenced code blocks choosing the largest valid block, (3) depth-based brace matching for the outermost {...}. parse_json_response adds stage 4 (_fix_unescaped_quotes, a manual string scanner that escapes interior quotes) and on total failure returns a sentinel dict and optionally logs the raw response. repair_json_with_llm calls call_llm_raw with a Chinese repair prompt using either 'single' (haiku) or 'escalating' (haiku->sonnet->opus) model strategy. try_repair_result triggers LLM repair only when a result carries parse_error + raw_response."
      key_files:
        - "common/json_utils.py"
        - "common/__init__.py"
      constraints:
        - "Stage ordering is fixed: direct parse -> markdown code block -> depth-based brace match -> fix-unescaped-quotes"
        - "Stage 2 prefers the LARGEST valid parsed code block (max by len(json.dumps(d))), not the first"
        - "Stage 3 uses depth-counting brace matching (handles nested braces) rather than rfind"
        - "On unrecoverable failure parse_json_response returns {'raw_response': text, 'parse_error': 'Cannot extract JSON'} instead of raising"
        - "Error-log writing is best-effort: only when error_log_dir is provided, writes outputs <dir>/errors/parse_fail_<timestamp>.txt via atomic_write, swallowing exceptions"
        - "repair_json_with_llm truncates input to raw_text[:5000] and returns None if all model attempts fail; 'single'=['haiku'], 'escalating'=['haiku','sonnet','opus']"
        - "try_repair_result only attempts repair when both result['parse_error'] and result['raw_response'] are truthy, and caps repair timeout at min(timeout, 120)"
        - "call_llm_raw is imported lazily inside repair_json_with_llm to break the json_utils <-> llm circular dependency"
    function_names:
      - "try_parse_json"
      - "parse_json_response"
      - "_fix_unescaped_quotes"
      - "repair_json_with_llm"
      - "try_repair_result"

  - feature: "Atomic File I/O, Content Hashing and Config Loading"
    description: "Low-level filesystem primitives: crash-safe atomic text writes, SHA-256 content hashing, and tolerant JSON config loading with optional memoization."
    purpose: "Prevents partial/corrupt files on interruption and provides the hashing + config-read building blocks reused by the cache, chunk cache, and tool configs."
    implementation:
      approach: "atomic_write creates parent dirs, writes to a tempfile.mkstemp temp file in the same directory, then os.replace()s it over the target (atomic on same filesystem), cleaning up the temp file on any BaseException. content_hash returns the first N hex chars (default 16) of a UTF-8 SHA-256 digest. load_json_config returns {} on missing file or parse error and memoizes into a caller-supplied dict keyed by str(path)."
      key_files:
        - "common/io.py"
        - "common/__init__.py"
      constraints:
        - "atomic_write writes temp file in path.parent (same dir) so os.replace is atomic on the same filesystem; temp file is unlinked on BaseException (best-effort, OSError suppressed)"
        - "All writes use UTF-8 encoding"
        - "content_hash truncates SHA-256 hex digest to `length` chars (default 16)"
        - "load_json_config never raises: returns {} for both missing file and OSError/JSONDecodeError"
        - "load_json_config memoization is opt-in (only when a cache dict is passed) and keyed on str(path)"
    function_names:
      - "atomic_write"
      - "content_hash"
      - "load_json_config"

  - feature: "SHA-256 Disk Cache"
    description: "Namespaced disk-backed key/value cache storing JSON entries with creation timestamps and optional TTL expiry, used for API results and LLM analysis."
    purpose: "Avoids repeated expensive API/LLM calls across runs while supporting per-call freshness via TTL and bulk namespace invalidation."
    implementation:
      approach: "DiskCache stores each entry as <cache_dir>/<namespace>/<sha256(key)[:16]>.json containing {_cached_at, _key, data}. get/has read the file, optionally compare time.time()-_cached_at against ttl_seconds, and return entry['data'] (or None). put writes via atomic_write. clear_namespace globs *.json in a namespace dir and unlinks them, returning the count."
      key_files:
        - "common/cache.py"
        - "common/__init__.py"
      constraints:
        - "Cache filename is the content_hash (SHA-256, first 16 hex chars) of the key, namespaced by subdirectory"
        - "get returns None on cache miss, on JSONDecodeError/OSError, or when TTL has expired (time.time() - _cached_at > ttl_seconds)"
        - "TTL is only enforced when ttl_seconds is passed (None = never expire); freshness is checked at read time, not stored"
        - "put stamps each entry with _cached_at (time.time()), the original _key, and the data payload, and writes atomically via atomic_write"
        - "has() is defined as get(...) is not None, so it honors the same TTL/expiry logic"
        - "Namespace dir is created lazily on put (ensure_dir=True) but get does not create it; cache_dir root created in __init__"
        - "clear_namespace returns 0 for a non-existent namespace and otherwise the number of *.json files removed"
    function_names:
      - "DiskCache"
      - "get"
      - "put"
      - "has"
      - "clear_namespace"
      - "_key_hash"
      - "_path_for"
    notes: "research/cache.py is a re-export shim for common.cache.DiskCache per root CLAUDE.md."

  - feature: "Canonical Output Path Resolution"
    description: "Module-level constants resolving the project root and the canonical outputs/ subdirectories (reports, logs, cache, data, images) shared by all tools."
    purpose: "Gives every tool one source of truth for where generated artifacts live, all anchored relative to the project root regardless of cwd."
    implementation:
      approach: "GADGET_ROOT is computed as Path(__file__).resolve().parent.parent; OUTPUTS_DIR = GADGET_ROOT/'outputs' and each named directory is a child of it. These are plain module-level Path constants imported by tools."
      key_files:
        - "common/paths.py"
        - "common/__init__.py"
      constraints:
        - "GADGET_ROOT is derived from this file's location (parent.parent of common/paths.py), so all output paths are project-root-relative and cwd-independent"
        - "All canonical dirs (REPORTS_DIR, LOGS_DIR, CACHE_DIR, DATA_DIR, IMAGES_DIR) are children of OUTPUTS_DIR = GADGET_ROOT/'outputs'"
        - "These are bare path constants — they are NOT created on import (no mkdir side effects here)"
        - "SITE_OUTPUTS_DIR was REMOVED in the 2026-07 single-content-root migration (generated site content now lives in tools/website/content|static)"
    function_names:
      - "GADGET_ROOT"
      - "OUTPUTS_DIR"
      - "REPORTS_DIR"
      - "LOGS_DIR"
      - "CACHE_DIR"
      - "DATA_DIR"
      - "IMAGES_DIR"
    notes: "common/__init__.py re-exports all except IMAGES_DIR (IMAGES_DIR is defined in paths.py but absent from the __init__ import/__all__)."

  - feature: "Hugo Deployment and Generated-Content Writes"
    description: "Cross-platform helper to run a Hugo site's update script, plus helpers that write auto-generated Hugo content/static assets directly into the Hugo site tree (single content root; 2026-07 migration removed the outputs/site staging tree)."
    purpose: "Lets tools (summarize, research, benchmark) deploy generated reports into the Hugo blog's content/static roots, with per-file generated/human ownership markers and force-overwrite backups."
    implementation:
      approach: "run_hugo_update detects platform: on Windows it prefers update.ps1 (powershell -ExecutionPolicy Bypass) then falls back to update.sh via Git Bash (shutil.which('bash')); on UNIX it runs update.sh via bash. Write helpers resolve the root as the hugo_site itself (resolve_site_staging_root(hugo_site) == hugo_site), create content/static subdirs on demand, stamp gadget_generated: true into written content (common/website_backup.py), refuse to overwrite marker-less (human) files unless overwrite_human=True, back up the previous file to outputs/backups/website-force/ when force=True, write via atomic_write, and copy static assets via shutil.copy2."
      key_files:
        - "common/hugo.py"
        - "common/site_staging.py"
        - "common/website_backup.py"
        - "common/__init__.py"
      constraints:
        - "run_hugo_update returns True only if a script was found and run (subprocess.run check=True so a failing script raises CalledProcessError); returns False and logs a warning when no script exists"
        - "Windows script preference order is update.ps1 first, then update.sh via Git Bash (only if bash is on PATH); UNIX uses update.sh via bash"
        - "All subprocesses run with cwd set to the hugo_site directory"
        - "resolve_site_staging_root(hugo_site) returns hugo_site itself — generated content goes to <hugo_site>/content, static to <hugo_site>/static (single content root, no staging tree)"
        - "resolve_site_content_dir / resolve_site_static_dir create the directory (mkdir parents=True, exist_ok=True) before returning it"
        - "write_site_content stamps gadget_generated: true (frontmatter) or <!-- gadget:generated --> (no frontmatter); an existing target without a gadget marker raises HumanContentError unless overwrite_human=True; force=True backs up a differing previous file before overwrite"
        - "copy_site_static raises FileNotFoundError if the source does not exist; force=True backs up an existing target (no human-block for static — no marker channel)"
        - "Verified by common/tests/test_site_ownership.py + test_bilingual_skip.py"
    function_names:
      - "run_hugo_update"
      - "resolve_site_staging_root"
      - "resolve_site_content_dir"
      - "resolve_site_static_dir"
      - "write_site_content"
      - "copy_site_static"
      - "classify_file"
      - "stamp_generated"
      - "backup_file"
    notes: "2026-07 single-content-root migration: outputs/site and Hugo module.mounts removed; ownership + backup rules live in common/website_backup.py."

  # ===== Translation Engine (common/) =====

  - feature: "Local NMT Engine Factory"
    description: "Pluggable local neural machine translation engine with vLLM, llama-cpp-python (GGUF), and transformers backends behind a unified TranslationEngine interface, plus a process-wide engine cache and platform-aware backend auto-selection."
    purpose: "Run offline batch translation (default tencent/HY-MT1.5-1.8B) without API cost, picking the fastest available backend per platform and reusing a single loaded model across all callers in the process."
    implementation:
      approach: "create_engine() resolves the model id, returns a cached engine wrapped in _CachedEngineProxy (so context-manager exit does not unload it), and otherwise selects a backend. Explicit selection via GADGET_TRANSLATION_BACKEND (vllm/transformers/llamacpp); otherwise auto: vLLM if importable and not Windows, else llama-cpp-python (GGUF), else transformers. Each concrete engine (VLLMEngine, TransformersEngine, LlamaCppEngine) implements load/generate_batch/unload and shares build_chat_messages + SAMPLING_DEFAULTS. TransformersEngine does true batched generate with left-padding and recursive OOM batch-halving; VLLMEngine uses offline LLM.generate with SamplingParams; LlamaCppEngine resolves/downloads a GGUF file (preferring Q4_K_M) and loops per-prompt chat completions."
      key_files:
        - "common/engine.py"
      constraints:
        - "Default model is tencent/HY-MT1.5-1.8B (DEFAULT_TRANSLATION_MODEL); GGUF default is tencent/HY-MT1.5-1.8B-GGUF (DEFAULT_TRANSLATION_MODEL_GGUF)"
        - "Model resolution precedence: explicit arg > GADGET_TRANSLATION_MODEL env > default, then .strip()"
        - "Backend override via GADGET_TRANSLATION_BACKEND (lowercased, stripped): 'vllm' | 'transformers' | 'llamacpp'"
        - "vLLM is force-disabled on win32 (_vllm_available returns False on sys.platform == 'win32')"
        - "Auto-select order when no override: vLLM -> llama-cpp -> transformers"
        - "Engines are cached in _engine_cache keyed by resolved model_id and reused; create_engine returns a _CachedEngineProxy whose __exit__ is a no-op so 'with' blocks do not unload the shared engine"
        - "A cached engine exposing is_alive() that returns False is deleted and recreated on the next create_engine call (VLLMEngine.is_alive checks llm_engine is not None)"
        - "generate_batch raises RuntimeError('Engine not loaded') if called before load()"
        - "All backends share SAMPLING_DEFAULTS: top_k=20, top_p=0.6, temperature=0.7, repetition_penalty=1.05 (llama-cpp maps repetition_penalty -> repeat_penalty)"
        - "TransformersEngine sets pad_token=eos_token when missing, padding_side='left', float16 on cuda / float32 on cpu, attn_implementation='sdpa', trust_remote_code=True"
        - "TransformersEngine sub-batches by GADGET_TRANSLATION_BATCH_SIZE (_DEFAULT_BATCH_SIZE; 0 means whole batch) and on CUDA OOM recursively halves the chunk down to a floor of 1, calling torch.cuda.empty_cache()"
        - "VLLMEngine loads with dtype='half', max_model_len=8192; default generation max_new_tokens=4096"
        - "LlamaCppEngine loads n_ctx=4096, n_gpu_layers=-1 by default; resolves a .gguf path directly or via huggingface_hub list/download, preferring filenames containing 'Q4_K_M' else the first .gguf, raising FileNotFoundError if none exist"
        - "shutdown_engines() unloads every cached engine and clears the cache (only explicit way to release GPU memory)"
    function_names:
      - "create_engine"
      - "shutdown_engines"
      - "resolve_translation_model"
      - "build_chat_messages"
      - "TranslationEngine.load"
      - "TranslationEngine.generate_batch"
      - "TranslationEngine.unload"
      - "TransformersEngine._generate_chunk"
      - "VLLMEngine.is_alive"
      - "LlamaCppEngine._resolve_gguf_path"
      - "_vllm_available"
      - "_llamacpp_available"
      - "_CachedEngineProxy"
    notes: "No CLI entry point; this is a library factory consumed by translation.py/bilingual.py and profile_translation.py. GADGET_TRANSLATION_BATCH_SIZE is read at import time into _DEFAULT_BATCH_SIZE, so changing it after import has no effect."

  - feature: "Markdown Document Translation Pipeline"
    description: "Translates full Hugo markdown documents between English and Chinese: splits frontmatter from body, protects untranslatable fragments, chunks large bodies, batches all prompts, restores fragments, and validates the reassembled output."
    purpose: "Produce high-quality bilingual Hugo posts locally while never corrupting code blocks, URLs, shortcodes, file paths, or proper nouns, and rejecting garbage/truncated model output."
    implementation:
      approach: "translate_markdown_document() splits frontmatter (FRONTMATTER_RE) and translates summary:/description: fields plus body chunks; translate_body() protects fragments via PROTECTED_PATTERNS placeholders ([[[HYMTPH_n]]]), chunks at header/blank-line boundaries (split_large_text, max 7000 chars), batches non-empty chunks through engine.generate_batch, then restores fragments. translate_documents_batch() flattens frontmatter-field prompts (512 tokens) and body-chunk prompts (4096 tokens) across many documents into one cross-document batch, processing short prompts together and long prompts in sub-batches of 48 for progress, then reassembles and validates each. Prompts are built in Chinese (build_translation_prompt) instructing the model to preserve proper nouns and markdown structure. validate_translated_output()/clean_translated_document() enforce frontmatter delimiters, minimum length, and a length-ratio floor."
      key_files:
        - "common/translation.py"
      constraints:
        - "Frontmatter is matched by FRONTMATTER_RE: a leading '---\\n...\\n---' block; absent it, split_frontmatter returns ('', text)"
        - "Only summary: and description: frontmatter keys are translated (_TRANSLATABLE_KEYS); title is intentionally left in the original language for both versions"
        - "Protected fragment order: fenced code blocks, Hugo shortcodes {{%/<...>/%}}, HTML comments, inline code, then http(s) URLs; replaced with [[[HYMTPH_<counter>]]] tokens and restored verbatim via str.replace"
        - "split_large_text returns the text unchanged if <= max_chars (default 7000); otherwise cuts at the last header ('#') or blank-line breakpoint, falling back to the full accumulated buffer when no breakpoint exists"
        - "clean_translated_document rejects marker-only output (_GARBAGE_RE ^-{3,}(END|BEGIN|结束|开始)?-{0,3}$), strips any preamble before the first '---', and requires frontmatter delimiters"
        - "_validate_minimum_content requires length >= 50 chars and at least 3 segments when split on '---' (closed frontmatter)"
        - "validate_translated_output rejects output shorter than 15% of the original length (min_ratio = 0.15)"
        - "Frontmatter-field translations use max_new_tokens=512; body chunks use max_new_tokens=4096"
        - "detect_language is a heuristic: CJK (U+4E00..U+9FFF) ratio > 5% => 'zh', else 'en'; empty text => 'en'"
        - "sanitize_frontmatter_language only rewrites a frontmatter field when its detected language != expected_lang AND the re-translation actually flips to expected_lang; otherwise the original is kept and a warning logged"
        - "zip(..., strict=True) is used when mapping fields/chunks to results, so a result-count mismatch raises"
        - "translate_documents_batch returns inputs unchanged when no prompts are produced and raises ValueError for any document failing validation"
        - "zh_path converts foo.md -> foo.zh.md (inserts .zh before the suffix)"
    function_names:
      - "translate_markdown_document"
      - "translate_documents_batch"
      - "translate_body"
      - "translate_frontmatter"
      - "sanitize_frontmatter_language"
      - "split_frontmatter"
      - "protect_fragments"
      - "restore_fragments"
      - "split_large_text"
      - "clean_translated_document"
      - "validate_translated_output"
      - "_validate_minimum_content"
      - "detect_language"
      - "build_translation_prompt"
      - "count_translation_chunks"
      - "zh_path"
      - "_scan_frontmatter_fields"
      - "_apply_translated_fields"
    notes: "build_translation_prompt hardcodes an allow-list of proper nouns to leave untranslated (LeRobot, NeurIPS, MIHD, RecoverBench, BlackHole, STAIG, Hugo, Claude)."

  - feature: "Bilingual Content Writing"
    description: "Writes a single source Hugo markdown file out in both English and Chinese, detecting the source language, sanity-fixing wrong-language frontmatter, and translating to the other language with graceful fallback when translation fails."
    purpose: "Single entry point for tools to publish bilingual site content, guaranteeing the source-language file is always written even if machine translation produces invalid output."
    implementation:
      approach: "write_bilingual() detects source language via detect_language, runs sanitize_frontmatter_language to correct mismatched summary/description fields, then writes the source file (via site_staging.write_site_content) and translates to the other language with translate_markdown_document, writing the .zh.md / .md counterpart. It reuses a passed-in engine or opens one via create_engine in a context manager."
      key_files:
        - "common/bilingual.py"
      constraints:
        - "Source language is determined by detect_language(content)"
        - "Chinese source -> written as the .zh.md path (zh_path) and translated to the English (original relative_path) file; English source -> written as the original .md path and translated to .zh.md"
        - "Returns (en_path, zh_path); for Chinese source a failed English translation falls back to writing the Chinese content at the English path (so both paths are non-None); for English source a failed Chinese translation returns (en_path, None)"
        - "ValueError from translation (validation failure) and generic Exceptions are both caught and logged as warnings; the source-language file is always written first"
        - "Frontmatter is sanitized to the source language before any file is written"
        - "Reuses the provided engine if engine is not None; otherwise creates and (via context manager) tears down its own engine"
    function_names:
      - "write_bilingual"

  # ===== Summarize — Daily Pipeline =====

  - feature: "Daily Export (Phase 1)"
    description: "Scans local AI conversation sources for a target date, builds a per-device export log JSON (optionally with a per-device LLM summary), deduplicates against any prior log, auto-finalizes past dates, and uploads to rclone."
    purpose: "Capture each device's daily AI interactions locally so a central machine can later merge them into a consolidated report, supporting a multi-device workflow."
    implementation:
      approach: "cmd_export resolves the logs dir, calls collect_conversations(), assembles export_data {version:1, date, device, conversations, device_summary, token_usage, _merged_devices, _source_device, _finalized}, atomically writes logs/YYYY-MM-DD_<device>.json, then rclone-uploads. cmd_export_past discovers all dates via discover_all_dates(), diffs against already-exported/finalized logs, and loops cmd_export over pending dates skipping per-date ccusage (refreshed once at the end via _refresh_usage_snapshots)."
      key_files:
        - "summarize/daily.py"
        - "summarize/parsers.py"
        - "summarize/config.py"
      constraints:
        - "Export log carries version:1 and is written via common.io.atomic_write (temp-then-rename)"
        - "Conversation dedup key on re-export is the tuple (source, project, timestamp); new conversations take precedence, old non-duplicate ones appended"
        - "Auto-finalize: a re-exported non-today date with unchanged conversation count gets _finalized=True; first export of a non-today date is _finalized=True; today is never finalized"
        - "If --summarize and the device is already in _merged_devices, the API call is skipped"
        - "Returns False (no write) when no conversations found, but still refreshes usage snapshots unless _skip_ccusage is set"
        - "Per-device summary results are sorted via _sort_report_by_importance before storage"
        - "device_summary stored as new format {device_name: summary_dict, ...}; non-dict values filtered out when restoring from existing file"
    entry_points:
      - "python -m summarize daily export"
      - "python -m summarize daily export --date 2026-02-13 --summarize"
      - "python daily_summary.py export"
    function_names:
      - "cmd_export"
      - "cmd_export_past"
      - "_parse_date"
      - "collect_conversations"
      - "_refresh_usage_snapshots"
    notes: "cmd_export_past is invoked whenever `export` is run with no --date or with --export-past (see cli.main dispatch). The export log field token_usage is always written as None — token usage now lives in separate ccusage_*/codex_usage_* files (usage.py), with an explanatory comment in cmd_export."

  - feature: "Daily Merge (Phase 2)"
    description: "Loads one or more per-device export logs for a date, concatenates and labels conversations by device, calls the LLM (with optional per-device preliminary summaries as context), merges token usage, generates a chart + Markdown + JSON report, caches the AI result, and optionally deploys to Hugo."
    purpose: "Consolidate multi-device daily logs into a single authoritative daily report on a central machine."
    implementation:
      approach: "cmd_merge optionally rclone-downloads logs (--sync) or all logs+reports (--sync-all → _cmd_merge_sync_all spawning one subprocess per date). It reads each log, attaches device info to each conversation, collects device_summary entries (new {device:summary} and legacy flat formats, plus parse_error raw_text passthrough), skips dates whose existing report is _finalized (unless --force/--no-cache), builds the merge prompt prefix, calls _call_summarize() with a chunk cache dir, caches the final report JSON, sorts by importance, merges standalone+inline token usages (splitting Claude vs Codex by _source), auto-finalizes past dates, generates the daily chart, saves report, uploads, and optionally generates a Hugo post."
      key_files:
        - "summarize/daily.py"
        - "summarize/summarizer.py"
        - "summarize/usage.py"
        - "summarize/formatter.py"
      constraints:
        - "--sync-all / (--sync without --date) routes to _cmd_merge_sync_all; otherwise --sync requires/uses a single --date"
        - "Synced log files merged with CLI-passed files are deduped by Path.resolve()"
        - "A report is skipped if existing report JSON has _finalized=True unless --force or --no-cache"
        - "AI result cached at outputs/cache/summarize/<date>.json; chunk cache under chunks/<date>/ is cleaned up only after the final report cache write succeeds"
        - "Token usage: standalone ccusage/codex_usage files take precedence; inline log token_usage only used as fallback for devices not already covered; Claude vs Codex separated by _source==\"codex\""
        - "Report _finalized=True for any date strictly before today (independent of source-log finalized state)"
        - "_cmd_merge_sync_all per-date subprocess timeout = chunk_timeout * (est_chunks+1) + 60, where est_chunks = total_size//150000 + 1"
        - "--before filters --sync-all dates to those strictly before the cutoff; --workers>1 enables ThreadPoolExecutor parallel subprocesses"
    entry_points:
      - "python -m summarize daily merge --sync --date 2026-02-13 --deploy"
      - "python -m summarize daily merge --sync-all"
      - "python -m summarize daily merge --date 2026-02-13 --no-cache"
    function_names:
      - "cmd_merge"
      - "_cmd_merge_sync_all"
      - "_merge_single_date"
      - "_call_summarize"
      - "_build_summary_prompt"
      - "_merge_token_usages"
      - "load_ccusage_for_date"
    notes: "cmd_legacy (single-machine one-step export+summarize equivalent) exists in daily.py and uses fetch_ccusage as a fallback, but is NOT wired into cli.main's dispatch (only export/merge/deploy/config are), so it is unreachable from the CLI and only callable via direct import."

  - feature: "Multi-Source Conversation Parsing"
    description: "Unified parsers that read Claude Code JSONL, Codex rollout JSONL, ChatGPT export JSON, and generic JSON into a common conversation dict {source, project, timestamp, messages[]}, filtered to a target date."
    purpose: "Normalize heterogeneous AI assistant log formats into one schema so the summarizer can treat them uniformly."
    implementation:
      approach: "parse_claude_code auto-discovers ~/.claude*/projects/ dirs, walks *.jsonl, keeps type in (user,assistant) for the target date, extracting text via _extract_text_content (handles text/tool_use/tool_result blocks with truncation). parse_codex locates ~/.codex/sessions/YYYY/MM/DD/rollout-*.jsonl, parses session_meta/event_msg/response_item (and legacy flat) records, ordering plain messages and tool messages by original index. parse_chatgpt_export walks the mapping tree (first-child BFS) filtering by create_time. parse_generic reads a flat role/content array. collect_conversations runs Claude Code + Codex by default plus optional ChatGPT/generic. discover_all_dates scans both Claude and Codex trees to enumerate dates with conversations."
      key_files:
        - "summarize/parsers.py"
      constraints:
        - "Conversation schema: {source in claude_code|codex|chatgpt|generic, project, timestamp(ISO8601), messages:[{role,content}]}"
        - "Claude project dirs ending in '-summarize' and JSONL files starting with 'agent-' are skipped"
        - "Codex text extraction skips system/instruction blocks prefixed with <user_instructions>/<environment_context>/<app-context>/<permissions instructions>/'# AGENTS.md instructions'"
        - "tool_use input truncated to 300 chars, tool_result/output truncated to 500 chars"
        - "Only roles user/assistant are kept; empty-text messages dropped"
        - "Codex prefers event_msg messages; falls back to response_item message records; tool messages interleaved by record index"
        - "ChatGPT mapping traversed via first child of each node; included if create_time date or any message date == target_date"
    function_names:
      - "parse_claude_code"
      - "parse_codex"
      - "parse_chatgpt_export"
      - "parse_generic"
      - "collect_conversations"
      - "discover_all_dates"
      - "_discover_claude_project_dirs"
      - "_extract_text_content"
      - "_extract_codex_text"
      - "_extract_codex_project"

  - feature: "LLM Summarization Engine"
    description: "Prompt templates, conversation formatting/chunking, an Anthropic tool-use schema, and hierarchical-merge orchestration that turn a list of conversations into a structured daily report dict."
    purpose: "Produce a consistent, importance-graded structured daily report from arbitrarily large conversation inputs without truncation loss."
    implementation:
      approach: "format_conversations renders conversations to text (per-message truncation at 3000 chars). chunk_conversations splits on conversation boundaries to keep each chunk under max_chars (150000). _call_summarize: single chunk → one timed_llm_call; multiple chunks → per-chunk timed_llm_call with optional SHA-256 chunk cache (keyed by chunk content hash + global conversations hash + chunk count n) then hierarchical_merge with CHUNK_MERGE_PROMPT. _build_summary_prompt swaps in a multi-device daily_overview block (global+devices) when >1 device label. _build_daily_config attaches the submit_report Anthropic tool schema (level enum high/low, importance 1-10) and low thinking budget (1024)."
      key_files:
        - "summarize/summarizer.py"
      constraints:
        - "Default chunk boundary at 150000 chars (chunk_conversations max_chars)"
        - "Individual messages truncated to 3000 chars in _format_conversation"
        - "Chunk cache key combines per-chunk SHA-256 (first 16 hex), global conversations hash, and chunk count n; only used when chunk_cache_dir is set"
        - "Anthropic submit_report schema requires date/summary/tasks; each task/problem/etc requires level(enum high|low) and importance(integer 1-10)"
        - "conversation_summaries outcome constrained to enum completed|partial|exploratory|abandoned"
        - "thinking budget fixed at 1024 tokens (_LOW_THINKING); merge phase uses the same tool schema"
        - "Multi-device prompt only generated when device label count > 1"
    function_names:
      - "_call_summarize"
      - "_call_single_summarize"
      - "_build_summary_prompt"
      - "_build_daily_config"
      - "_daily_tool_schema"
      - "format_conversations"
      - "chunk_conversations"
      - "_chunk_content_hash"
      - "_conversations_hash"
      - "summarize_with_anthropic"
      - "summarize_with_openai"
      - "summarize_with_claude_cli"

  - feature: "Report Rendering and Hugo Post Generation"
    description: "Renders a structured report dict to Markdown (with high/low level splitting per section and project-grouped conversation summaries), sorts sections by importance, persists JSON+Markdown, and emits a bilingual Hugo bugJournal post."
    purpose: "Turn the LLM's structured report into human-readable Markdown and publish it to the Hugo site in both languages."
    implementation:
      approach: "generate_markdown builds sections (daily_overview flat or global+devices, tasks split into Architecture/Implementation, problems, human_vs_ai tables, ai_limitations, learnings, project-grouped conversation_summaries, token usage with optional chart image, and a raw-response block on parse_error). _sort_report_by_importance orders list sections by (level high<low<none, -importance) while conversation_summaries keep project grouping. save_report atomically writes <date>.md and <date>.json. generate_hugo_post extracts the summary line, builds Hugo frontmatter, copies any chart to static/images/daily, and calls common.bilingual.write_bilingual for en+zh."
      key_files:
        - "summarize/formatter.py"
      constraints:
        - "Sort key: level high→0, low→1, missing→2; within level by descending importance; plain-string items sort last"
        - "Sections render high/low subsections only when _has_level_metadata is true; items lacking level fall into low"
        - "conversation_summaries preserve project-group ordering, sorted only within each group"
        - "Both <date>.md and <date>.json are written via atomic_write"
        - "Hugo frontmatter date is fixed to <date>T00:00:00-05:00, draft:false, keyword 'Bug Journal'; summary taken from the first '> ' line; quotes escaped"
        - "Chart, when present, copied to static images/daily/<name> and referenced as /images/daily/<name> in the deployed (Hugo) markdown"
    function_names:
      - "generate_markdown"
      - "_sort_report_by_importance"
      - "save_report"
      - "generate_hugo_post"
      - "_render_content_list"
      - "_split_by_level"
      - "_has_level_metadata"
      - "_importance_sort_key"

  - feature: "Hugo Deployment (Batch)"
    description: "Batch-deploys finalized daily reports to the Hugo bugJournal/daily section, translating each to the opposite language in a single batched engine session and writing both en/zh files; skips already-deployed dates unless forced."
    purpose: "Efficiently publish many daily reports to the website at once with bilingual output and a shared translation engine."
    implementation:
      approach: "cmd_deploy resolves reports_dir and the Hugo content dir, computes already-deployed dates by scanning content *.md stems, filters to undeployed (unless --force), pre-counts translation chunks for a tqdm bar, then within one create_engine() context detects each doc's language, sanitizes frontmatter language, batch-translates en→zh and zh→en groups via translate_documents_batch, writes original+translation through write_site_content, logs to outputs/reports/logs/deploy.log, and runs run_hugo_update at the end."
      key_files:
        - "summarize/daily.py"
      constraints:
        - "Only reports whose date stem is not already present in the Hugo content dir are deployed, unless --force"
        - "Non-ISO-date .md filenames are skipped (counted as non_date_skipped)"
        - "Frontmatter built with date <date>T00:00:00-05:00, draft:false; summary from first '> ' line"
        - "All translation runs inside a single create_engine() context; en docs translate to zh and zh docs to en"
        - "zh-source docs write the zh path as-is and the translated en at the base path; en-source docs write base + translated zh path"
        - "run_hugo_update is always invoked after writing, even when there were per-doc errors (errors collected and printed)"
    entry_points:
      - "python -m summarize daily deploy"
      - "python -m summarize daily deploy --force"
      - "python -m summarize daily deploy --date 2026-02-13"
    function_names:
      - "cmd_deploy"
    notes: "cmd_deploy implements its own inline frontmatter+translation rather than calling formatter.generate_hugo_post (which the per-date cmd_merge --deploy path uses); the two deploy paths duplicate frontmatter construction."

  - feature: "Token/Cost Usage Tracking (ccusage)"
    description: "Fetches full token/cost usage from ccusage (Claude Code) and @ccusage/codex (Codex), normalizes Codex output to ccusage format, saves per-device snapshot files, loads per-date usage, and merges across devices."
    purpose: "Attach accurate token counts and USD cost (per model, per device) to daily/aggregate reports across both Claude Code and Codex."
    implementation:
      approach: "fetch_ccusage_full runs `ccusage --json --breakdown` (or npx fallback). fetch_codex_usage_full runs `npx @ccusage/codex@latest --json --breakdown` then _normalize_codex_data maps date strings (e.g. 'Feb 07, 2026'→ISO), costUSD→totalCost, cachedInputTokens→cacheReadTokens, models dict→modelBreakdowns. save_ccusage_file / save_codex_usage_file write {device_name, updated_at, ccusage[, _source:codex]} envelopes atomically. load_ccusage_for_date scans ccusage_*.json + codex_usage_*.json, returning per-device per-date entries tagged with _source. _merge_token_usages aggregates daily entries into merged totals + modelBreakdowns + per_device detail. _ensure_ccusage_global optionally offers global npm install (with a 'never' persisted choice). _refresh_usage_snapshots fetches+saves+uploads both snapshots."
      key_files:
        - "summarize/usage.py"
      constraints:
        - "ccusage invocation tries global binary first (30/60s timeout), then `npx --yes ccusage` (60/120s); Codex only via `npx --yes @ccusage/codex@latest`"
        - "Snapshot envelope keys: device_name, updated_at, ccusage; Codex envelope also adds _source:'codex' but reuses the 'ccusage' data key for unified loading"
        - "Snapshot files written atomically as ccusage_<device>.json / codex_usage_<device>.json"
        - "Codex normalization forces cacheCreationTokens=0 and maps cachedInputTokens→cacheReadTokens, costUSD→totalCost, preserving reasoningOutputTokens"
        - "_merge_token_usages aggregates over keys inputTokens/outputTokens/cacheCreationTokens/cacheReadTokens/totalTokens/reasoningOutputTokens + totalCost; zero-valued reasoningOutputTokens stripped (Claude Code unused)"
        - "_ensure_ccusage_global only prompts on a TTY; choosing 'never' writes ccusage_global_install:'never' to config and updates the cached config"
        - "load_ccusage_for_date matches daily entries by exact ISO date string and synthesizes day_data {daily:[matched], totals:matched[0]}"
    function_names:
      - "fetch_ccusage"
      - "fetch_ccusage_full"
      - "fetch_codex_usage_full"
      - "_normalize_codex_data"
      - "_normalize_codex_date"
      - "save_ccusage_file"
      - "save_codex_usage_file"
      - "load_ccusage_for_date"
      - "_merge_token_usages"
      - "_refresh_usage_snapshots"
      - "_ensure_ccusage_global"
    notes: "fetch_ccusage is marked deprecated in its docstring; only cmd_legacy (an unreachable-from-CLI handler) still uses it as a fallback. usage.py also re-defines _extract_text_content (a duplicate of the one in parsers.py)."

  - feature: "Config Initialization and Resolution"
    description: "Loads and caches ~/.config/summarize/config.json, resolves output directories by precedence (CLI > env var > config > default), resolves device name, and provides interactive show/init of the config file."
    purpose: "Give each device a stable identity and configurable log/report/rclone settings while keeping sensible defaults."
    implementation:
      approach: "_load_config reads and caches the JSON config (empty dict on missing/unreadable). _resolve_output_dir applies precedence cli_value > os.environ[env_key] > config[config_key] > default, expanding ~. _get_device_name returns config device_name or platform.node() or 'unknown'. cmd_config dispatches to _config_show (prints config + effective logs/reports dirs + rclone status) or _config_init (interactive prompts for device_name, logs_dir, reports_dir, rclone_remote, and rclone_path when rclone not on PATH; atomic write)."
      key_files:
        - "summarize/config.py"
        - "summarize/daily.py"
      constraints:
        - "Config path fixed at ~/.config/summarize/config.json"
        - "Resolution precedence: CLI flag > environment variable > config.json > hardcoded default"
        - "Env keys SUMMARIZE_LOGS_DIR / SUMMARIZE_REPORTS_DIR map to logs_dir / reports_dir"
        - "Config is module-cached (_cached_config) after first load"
        - "device_name falls back to platform.node() then 'unknown'"
        - "_config_init prompts to overwrite an existing config and only asks for rclone_path when rclone is absent from PATH; writes via atomic_write"
    entry_points:
      - "python -m summarize daily config"
      - "python -m summarize daily config --init"
    function_names:
      - "_load_config"
      - "_resolve_output_dir"
      - "_get_device_name"
      - "cmd_config"
      - "_config_show"
      - "_config_init"

  - feature: "Rclone Remote Sync"
    description: "Uploads logs/reports to and downloads logs/reports from an rclone remote configured in config.json, locating the rclone binary via config or PATH."
    purpose: "Move per-device export logs and finalized reports through a shared remote so the central machine can merge them."
    implementation:
      approach: "_find_rclone returns config rclone_path (if it points at an existing file) else shutil.which('rclone'). _rclone_upload copies given local files to <remote>/<subdirectory> (logs/reports). _rclone_download_logs copies <remote>/logs/ to local, with an include filter for a specific date plus ccusage_*/codex_usage_* when target_date is given (else all *.json). _rclone_download_reports copies *.json/*.md from <remote>/reports/. All ops are silent no-ops when rclone_remote is unset, and treat 'directory not found' as non-fatal."
      key_files:
        - "summarize/remote.py"
      constraints:
        - "All operations are no-ops when config has no rclone_remote"
        - "rclone resolution: config rclone_path (must be an existing file) else shutil.which('rclone')"
        - "All rclone subprocess calls use a 120s timeout; timeouts/OSErrors are warnings, not fatal"
        - "Remote 'directory not found'/'not found' stderr is treated as non-fatal (empty result)"
        - "Date-filtered log download includes the date pattern plus ccusage_*.json and codex_usage_*.json; unfiltered download includes all *.json"
        - "Uploads target <remote>/<subdirectory>/ where subdirectory is 'logs' or 'reports'"
    function_names:
      - "_find_rclone"
      - "_rclone_upload"
      - "_rclone_download_logs"
      - "_rclone_download_reports"

  - feature: "Daily CLI and Unified Entry Point"
    description: "argparse-based daily subcommand surface (export/merge/deploy/config) plus the package __main__ dispatcher that routes `python -m summarize {daily,weekly,monthly,auto}` to the right submodule, and the daily_summary.py / llm_backends.py backward-compat shims."
    purpose: "Expose the daily pipeline (and the broader summarize toolset) through a single coherent command-line interface while preserving legacy import/invocation paths."
    implementation:
      approach: "cli.main builds subparsers for export/merge/deploy/config (each with --api choices anthropic/openai/claude_cli, default claude_cli) plus top-level no-subcommand args that default to export; it dispatches export to cmd_export_past when --date is absent or --export-past set, else cmd_export. __main__.main intercepts 'auto' (→ _main_auto → summarize.auto.cmd_auto), prints usage for help, else rewrites sys.argv and delegates to summarize.cli/weekly_summary/monthly_summary main(). daily_summary.py re-exports every public symbol from the submodules; llm_backends.py re-exports from common.llm/json_utils/io."
      key_files:
        - "summarize/cli.py"
        - "summarize/__main__.py"
        - "summarize/daily_summary.py"
        - "summarize/llm_backends.py"
      constraints:
        - "--api choices are exactly anthropic|openai|claude_cli with default claude_cli across export/merge/auto"
        - "Default --timeout is 600s (per ~150K chunk); --hugo-site defaults to the repo's website/ dir"
        - "`export` with no --date or with --export-past routes to cmd_export_past; otherwise cmd_export"
        - "config subparser defaults --show True; --init triggers interactive creation"
        - "__main__ routes argv[1]=='auto' specially; 'daily'/'weekly'/'monthly' rewrite sys.argv to drop the subcommand token before delegating"
        - "daily_summary.py is a pure re-export shim (no logic); its __main__ calls summarize.cli.main"
    entry_points:
      - "python -m summarize daily export"
      - "python -m summarize daily merge"
      - "python -m summarize daily deploy"
      - "python -m summarize daily config"
      - "python -m summarize"
      - "python daily_summary.py export"
    function_names:
      - "main"
      - "_main_auto"
      - "_parse_date"
      - "cmd_export"
      - "cmd_export_past"
      - "cmd_merge"
      - "cmd_deploy"
      - "cmd_config"
    notes: "daily.py imports cmd_legacy is defined and re-exported but cli.main never registers a 'legacy' subcommand, so cmd_legacy is dead from the CLI. llm_backends.py is described in CLAUDE.md as a re-export shim and verified as such (imports from common.* only)."

  # ===== Summarize — Aggregation & Automation =====

  - feature: "Weekly Summary Generation"
    description: "Generates a structured weekly AI-conversation report for an ISO 8601 week (Monday-Sunday) by loading that week's daily report JSONs, summarizing them via LLM, mechanically aggregating token usage and statistics, then rendering Markdown + JSON and optionally deploying to Hugo."
    purpose: "Roll daily AI-usage reports up into a weekly progress/problem/learnings digest with token-cost statistics, published bilingually to the blog."
    implementation:
      approach: "cmd_generate parses the week (default = last week) via _parse_week (validates with date.fromisocalendar, exits 1 on bad format), resolves reports_dir, checks for existing/finalized output, loads daily reports for Mon-Sun, checks a source-hash-keyed weekly cache, calls _call_weekly_summarize_chunked (LLM with submit_weekly_report tool schema + low thinking budget 1024), aggregates token_usage/codex_token_usage, combines them, computes statistics, assembles report dict, generates chart, renders Markdown via generate_weekly_markdown, saves via save_weekly_report (atomic_write), and on --deploy writes a bilingual Hugo bugJournal/weekly post and runs Hugo update."
      key_files:
        - "summarize/weekly_summary.py"
      constraints:
        - "Week string must be YYYY-WNN; _parse_week validates with date.fromisocalendar and sys.exit(1) on ValueError/IndexError/OverflowError"
        - "Week boundaries are ISO 8601: _week_date_range returns Monday (day 1) to Sunday (day 7); load_weekly_reports iterates Mon->Sun and includes only existing YYYY-MM-DD.json files"
        - "A past week (sunday < today) gets report['_finalized']=True; an existing finalized JSON for a past week is skipped unless --force"
        - "Existing non-finalized output is skipped unless --force or --no-cache"
        - "Weekly cache (outputs/cache/summarize/weekly/<week>.json) is invalidated when _cache_meta.source_hash != current source_hash"
        - "Hierarchical-merge chunking trigger: when len(full_text)+len(WEEKLY_SUMMARY_PROMPT)+200 > 150000 chars; below threshold a single timed_llm_call is used"
        - "When chunking, daily_reports are split front-half/back-half at mid = len//2, empty groups filtered, then chunk_text(max_chars=150000-prompt_overhead)"
        - "Default LLM timeout 900s per chunk; chunk cache keyed by sha256(chunk_content)[:16] + global source hash + chunk count n"
        - "chart only generated when combined token usage has data (_has_usage_data); on deploy the chart markdown path is rewritten to /images/weekly/<name>"
        - "list excludes stems containing 'monthly' or 'weekly' and unparseable dates; groups remaining dailies by ISO week"
    entry_points:
      - "python -m summarize weekly generate"
      - "python -m summarize weekly list"
      - "python summarize/weekly_summary.py generate --week 2026-W12 --deploy"
    function_names:
      - "cmd_generate"
      - "cmd_list"
      - "_parse_week"
      - "_week_date_range"
      - "_week_str"
      - "load_weekly_reports"
      - "compute_weekly_statistics"
      - "_call_weekly_summarize"
      - "_call_weekly_summarize_chunked"
      - "_build_weekly_config"
      - "_weekly_tool_schema"
      - "generate_weekly_markdown"
      - "generate_weekly_hugo_post"
      - "save_weekly_report"
      - "_load_weekly_cache"
      - "_save_weekly_cache"
      - "_generate_chart"
    notes: "_call_weekly_summarize and _cache_dir(reports_dir) ignore their reports_dir argument and return the fixed _DEFAULT_CACHE_DIR. Weekly imports format_reports_for_llm, aggregate_token_usage, combine_usage_summaries, _has_usage_data, _compute_source_hash from monthly_summary (weekly depends on monthly module)."

  - feature: "Monthly Summary Generation"
    description: "Generates a structured monthly AI-conversation summary (project overview, key achievements, recurring problems, collaboration trends, learnings digest) for a YYYY-MM month by loading all daily report JSONs in that month, summarizing via LLM with week-based chunking, aggregating token usage/statistics, and optionally deploying to Hugo."
    purpose: "Distill an entire month of daily AI-usage reports into whole-month trends and patterns with cost statistics, published bilingually to the blog."
    implementation:
      approach: "cmd_generate parses month (default = previous month, wrapping Jan->prior Dec), resolves reports_dir, checks existing/finalized output, loads dailies via load_daily_reports (glob YYYY-MM-*.json, skips monthly/weekly stems), checks source-hash-keyed monthly cache, calls _call_monthly_summarize_chunked (LLM with submit_monthly_report tool schema, low thinking 1024), aggregates token usage via aggregate_token_usage + combine_usage_summaries, computes statistics (calendar.monthrange for total_days), assembles report, generates chart, renders via generate_monthly_markdown, saves atomically, and on --deploy writes bilingual Hugo bugJournal/monthly post + Hugo update."
      key_files:
        - "summarize/monthly_summary.py"
      constraints:
        - "Month string must be YYYY-MM; _parse_month exits 1 on ValueError/IndexError; default is previous month (year-1/12 when current month is January)"
        - "load_daily_reports skips files whose stem contains 'monthly' or 'weekly' and warns+skips unreadable JSON"
        - "Hierarchical-merge chunking trigger: when len(full_text)+len(MONTHLY_SUMMARY_PROMPT)+200 > 150000 chars; below threshold a single timed_llm_call is used"
        - "When chunking, daily_reports are grouped into 7-day (week) groups via range(0,len,7), then chunk_text(max_chars=150000-prompt_overhead)"
        - "Default LLM timeout 1800s per chunk (vs 900s weekly); merge phase reuses _build_monthly_config"
        - "A past month (year<today.year or (year==today.year and month<today.month)) gets _finalized=True; existing finalized past-month JSON skipped unless --force"
        - "Existing non-finalized output skipped unless --force/--no-cache"
        - "Monthly cache (outputs/cache/summarize/monthly/<month>.json) invalidated when _cache_meta.source_hash mismatch"
        - "_compute_source_hash sorts reports by date, strips keys starting with '_', json.dumps(sort_keys=True), sha256 truncated to 16 hex chars"
        - "aggregate_token_usage rounds costs to 2 decimals, computes daily_average over active days (totalTokens>0), peak_day = max by totalCost, model_breakdown sorted by descending cost"
        - "_has_usage_data returns True only if totals have any nonzero token/cost field or any daily entry has tokens/cost"
    entry_points:
      - "python -m summarize monthly generate"
      - "python -m summarize monthly list"
      - "python summarize/monthly_summary.py generate --month 2026-02 --deploy"
    function_names:
      - "cmd_generate"
      - "cmd_list"
      - "_parse_month"
      - "load_daily_reports"
      - "format_reports_for_llm"
      - "_has_usage_data"
      - "aggregate_token_usage"
      - "combine_usage_summaries"
      - "compute_statistics"
      - "_call_monthly_summarize"
      - "_call_monthly_summarize_chunked"
      - "_build_monthly_config"
      - "_monthly_tool_schema"
      - "generate_monthly_markdown"
      - "generate_monthly_hugo_post"
      - "save_monthly_report"
      - "_compute_source_hash"
      - "_load_monthly_cache"
      - "_save_monthly_cache"
      - "_generate_chart"
    notes: "format_reports_for_llm strips token_usage, codex_token_usage, conversation_summaries, and _source_file from each report before LLM input. monthly_summary is the canonical home of the shared aggregation helpers imported by weekly_summary."

  - feature: "Token Usage Chart Generation"
    description: "Renders a single matplotlib PNG with three side-by-side subplots (Tokens by model, Cost by model, Token-type/cache breakdown) for a given date, platform-stacked across Claude Code and Codex; degrades gracefully when matplotlib is absent."
    purpose: "Provide a visual token/cost summary embedded into daily, weekly, and monthly reports without making matplotlib a hard dependency."
    implementation:
      approach: "generate_daily_chart lazily imports matplotlib (Agg backend), numpy, and font_manager via _try_import; if import fails it prints a warning and returns None. It picks a CJK font, extracts per-model breakdowns via _get_breakdowns, draws three stacked-bar subplots over the present platforms, annotates totals, and savefig's to <date>-usage.png at 150 dpi. Weekly and monthly _generate_chart wrappers reshape their summary dicts into modelBreakdowns and call generate_daily_chart with the week's Monday or the month's first day as target_date."
      key_files:
        - "summarize/charts.py"
        - "summarize/weekly_summary.py"
        - "summarize/monthly_summary.py"
      constraints:
        - "matplotlib/numpy import failure is non-fatal: _try_import returns (None,None,None), generate_daily_chart returns None, callers skip chart silently"
        - "Returns None when there are no breakdowns and no totals for either platform, or when no platforms qualify"
        - "Output filename is always <target_date>.isoformat()-usage.png under output_dir (default outputs/images/summarize/)"
        - "Platform column 'Claude Code' uses _CLAUDE_PALETTE (indigo), 'Codex' uses _CODEX_PALETTE (orange); subplot 3 uses fixed _TYPE_COLORS per token type"
        - "Token magnitudes drawn in millions (/1_000_000); zero/negative segments skipped; legend labels deduplicated per subplot via _dedup_label + seen_labels.clear()"
        - "matplotlib forced to non-interactive Agg backend; figure closed after save to free memory"
        - "Subplot-1 token value falls back to summing input/output/cache/reasoning fields when modelBreakdown.totalTokens<=0"
    function_names:
      - "generate_daily_chart"
      - "_try_import"
      - "_setup_style"
      - "_shorten_model"
      - "_get_breakdowns"
      - "_stacked_bar"
      - "_dedup_label"
    notes: "STALE DOCS: summarize/CLAUDE.md, README.md, and tutorial.md describe separate monthly trend charts '<month>-monthly-cost.png' and '<month>-monthly-tokens.png', but charts.py only implements generate_daily_chart producing '<date>-usage.png'. Monthly _generate_chart reuses generate_daily_chart with the first-of-month date, so the monthly trend chart functions referenced in docs do not exist in code. _stacked_bar is defined but unused within charts.py."

  - feature: "One-Click Auto Pipeline"
    description: "Single-command orchestration that runs the full summarize pipeline for a target date: daily export, daily merge (sync-all, before today), then auto-detect and fill all missing past weekly and monthly reports, optionally deploying each."
    purpose: "Let a user regenerate the entire daily->weekly->monthly chain (including back-filling gaps) with one command and optional Hugo deploy."
    implementation:
      approach: "cmd_auto resolves the target date (yesterday by default, or --date), builds api/deploy/force flag lists, and shells out via subprocess.run to 'python -m summarize ...' for each stage (no direct imports). _find_missing_weeks and _find_missing_months scan reports_dir for daily JSONs, group by ISO week / YYYY-MM, and emit only past periods that lack a corresponding -weekly.json / -monthly.json. Each missing period is generated in its own subprocess; non-zero exits are logged and the pipeline continues."
      key_files:
        - "summarize/auto.py"
      constraints:
        - "Subprocess-only orchestration: failures in any step print exit code and continue (never abort the pipeline); _run returns False on nonzero return code"
        - "Target date defaults to today-1 day; --date must be ISO format or sys.exit(1)"
        - "Merge step always runs with --sync-all and --before <today> to exclude the current (incomplete) day"
        - "_find_missing_weeks: groups daily JSON stems by ISO week (skips 'monthly'/'weekly' stems and unparseable dates), includes a week only if its Sunday (fromisocalendar day 7) < today AND <week>-weekly.json is absent"
        - "_find_missing_months: groups by stem[:7] YYYY-MM, includes a month only if it is strictly before the current month AND <month>-monthly.json is absent"
        - "--api flag only appended when api != 'claude_cli'; --deploy/--force forwarded to all sub-steps"
        - "Reports directory is the fixed _DEFAULT_REPORTS_DIR (REPORTS_DIR/summarize); not overridable via auto args"
    entry_points:
      - "python -m summarize auto"
      - "python -m summarize auto --deploy"
      - "python -m summarize auto --date 2026-04-18"
      - "python -m summarize auto --force"
    function_names:
      - "cmd_auto"
      - "_run"
      - "_find_missing_weeks"
      - "_find_missing_months"
    notes: "auto.py uses sys.executable for the subprocess Python and missing-period detection mirrors (but reimplements) the week/month grouping logic in weekly_summary.cmd_list and monthly_summary.cmd_list."

  # ===== Research — Paper Discovery (scout) =====

  - feature: "Project-Based Research Scout CLI"
    description: "Single argparse CLI (init/list/search/report/ask/profile/citations/deploy/config) for managing named research projects and driving the full paper-discovery pipeline. Projects are directories under research/projects/ holding project.json + overview.md."
    purpose: "Lets a researcher define a persistent project (keywords, arXiv categories, open questions, sources) once and repeatedly search/evaluate new papers against it, accumulating literature notes."
    implementation:
      approach: "cli.py main() builds subparsers and dispatches to cmd_* handlers. Projects are created via project.py CRUD (create_project / create_project_from_overview / create_project_from_query) writing PROJECT_JSON_SCHEMA-shaped project.json + an OVERVIEW_TEMPLATE overview.md via common.io.atomic_write. Config resolution is CLI flag > project.json > merged config (~/.config/research_scout + ~/.config/research) > hardcoded default via resolve_param(). API default falls back to config default_api in main() when --api omitted."
      key_files:
        - "research/scout/cli.py"
        - "research/scout/project.py"
        - "research/scout/config.py"
        - "research/research_scout.py"
      constraints:
        - "Project ID must match regex ^[a-z0-9][a-z0-9_-]*$ (cmd_init), else exit(1)"
        - "create_project exits(1) if the project directory already exists"
        - "PROJECT_JSON_SCHEMA defaults sources=['arxiv'] and status='active'; ask-created projects get status='ask' and are hidden from `list` unless --all"
        - "Parameter resolution order in resolve_param(): CLI flag > project.json key > config 'default_<param>' > hardcoded default"
        - "load_scout_config merges two config files with Scout (~/.config/research_scout) taking precedence over Profiler (~/.config/research); result is cached in module global _cached_config"
        - "config --init writes config atomically and validates default_api into {claude_cli, anthropic, openai} (invalid -> claude_cli)"
    entry_points:
      - "python research/research_scout.py init <name>"
      - "python research/research_scout.py list [--all]"
      - "python research/research_scout.py config --init"
    function_names:
      - "main"
      - "cmd_init"
      - "cmd_list"
      - "cmd_config"
      - "create_project"
      - "create_project_from_overview"
      - "load_project"
      - "save_project"
      - "load_all_projects"
      - "extract_current_methods"
      - "load_scout_config"
      - "resolve_param"
      - "get_hugo_site"
      - "get_reports_dir"
      - "setup_logging"
    notes: "research/research_scout.py is described in CLAUDE.md as a backward-compat shim; the actual logic lives in research/scout/. The cli.py imports use bare top-level package names (scout.*, research.*) rather than research.scout.*, implying the package is invoked with research/ on sys.path."

  - feature: "Multi-Source Paper Search"
    description: "Standardized paper search across arXiv, bioRxiv, and PubMed plus arXiv conference-filtered and author-filtered modes, with per-source disk caching and incremental dedup against previously cached papers."
    purpose: "Feeds the evaluation pipeline a normalized list of recent papers from the sources relevant to each project, while avoiding re-fetching and re-evaluating papers already seen."
    implementation:
      approach: "search.py emits a unified paper dict (paper_id, arxiv_id, source, title, authors[:10], abstract, categories, published, url, pdf_url, comment, journal_ref, venue). arXiv uses the arxiv package with a conservative client (page_size 100, delay 5s, retries 5) and _arxiv_results_with_retry exponential backoff on HTTP 429/503. bioRxiv/PubMed use stdlib urllib + ElementTree only. search_source() wraps each source with load/save_search_cache. Conference search does arXiv all:\"<conf>\" then post-filters via _conference_matches against comment/journal_ref; venue is extracted by _extract_venue regex. paper_id() / paper_url() are the shared ID/URL helpers."
      key_files:
        - "research/scout/search.py"
        - "research/scout/config.py"
      constraints:
        - "Unified paper_id = paper.get('paper_id') or paper.get('arxiv_id','') (paper_id()); source-prefixed IDs are 'biorxiv:<doi>' and 'pmid:<pmid>'"
        - "authors are capped to the first 10 across all sources (result.authors[:10])"
        - "arXiv/bioRxiv dedup early-stop: 5 consecutive already-known paper IDs halts fetching (consecutive_known >= 5)"
        - "search cache is invalidated when project search_keywords change (load_search_cache compares stored _keywords set to current)"
        - "build_arxiv_query returns '' when no keywords (logged warning) and honors project arxiv_query_override verbatim; multi-keyword OR'd, categories AND'd as cat:<c>"
        - "conference search over-fetches max_results*3 then truncates to max_results after the comment/journal_ref match filter; --conference and --author are mutually exclusive (cli exits(1))"
        - "bioRxiv paged fetch is capped at BIORXIV_MAX_PAGES (10) and stops when cursor >= total"
        - "PubMed uses two-step esearch->efetch with 100-id batches and 0.4s sleep between batches"
    entry_points:
      - "python research/research_scout.py search [--project <id>]"
      - "python research/research_scout.py search --source arxiv biorxiv pubmed"
      - "python research/research_scout.py search --conference \"CVPR 2025\""
      - "python research/research_scout.py search --author \"Pieter Abbeel\""
    function_names:
      - "search_arxiv"
      - "search_arxiv_conference"
      - "search_arxiv_author"
      - "search_biorxiv"
      - "search_pubmed"
      - "search_source"
      - "build_arxiv_query"
      - "paper_id"
      - "paper_url"
      - "_extract_venue"
      - "_conference_matches"
      - "_arxiv_results_with_retry"
      - "load_search_cache"
      - "save_search_cache"
      - "load_known_paper_ids"
      - "_parse_pubmed_article"

  - feature: "Multi-Stage LLM Evaluation Pipeline"
    description: "The core 3-stage scoring pipeline (Stage 1 screening -> Stage 2 deep analysis -> Stage 3 citation impact) plus research-direction suggestions, orchestrated per project into a {high_relevance, low_relevance, screening_stats} result. With --insight it extends to Stage 4 (full-text insight) and Stage 5 (OpenReview)."
    purpose: "Turns a raw paper list into a ranked, scored, annotated set of high-value papers with motivation/innovation/highlights and citation context for a research report."
    implementation:
      approach: "evaluate_papers_for_project() runs Stage 1 _screen_papers (auto-switches to _screen_papers_chunked at >150K chars, 25 papers/chunk) classifying each paper high/low and adding motivation/innovation_point/paper_type/first_author/institution; high papers (capped at MAX_HIGH_RELEVANCE) go to Stage 2 _deep_evaluate_papers which adds highlights + relevance/novelty/inspiration scores and computes composite_score, sorting desc with citation_count tiebreak. run_evaluation_pipeline() (cli.py) then runs Stage 3 analyze_citations on the top 5, suggest_directions on papers with composite>=2.5, and append_literature_note on top 3. LLM calls go through call_scout_llm (common.llm.call_llm_raw, model sonnet) -> parse_json_response -> try_repair_result. Results matched back to papers by paper_id via _lookup_by_id (strips trailing version suffix vN on miss). Eval results cached to EVAL_CACHE_DIR keyed by SHA-256 of project context + paper IDs + truncated abstracts."
      key_files:
        - "research/scout/evaluate.py"
        - "research/scout/cli.py"
        - "research/scout/prompts.py"
        - "research/scout/config.py"
        - "research/scout/project.py"
      constraints:
        - "composite_score = round(0.4*relevance + 0.3*inspiration + 0.3*novelty, 2) (evaluate.py:292)"
        - "High-relevance set is truncated to MAX_HIGH_RELEVANCE = 20 before Stage 2 (config.py)"
        - "Stage 3 citation analysis runs on high_papers[:5] only (citation_top in run_evaluation_pipeline)"
        - "suggest_directions only fires for papers with composite_score >= 2.5; literature notes appended for top 3 (high_papers[:3])"
        - "Stage 1 abstract truncated to 1000 chars in formatting; Stage 2 uses full abstract (CON-004)"
        - "paper_id is the sole LLM<->paper join key; LLM result keyed by s.get('paper_id') or s.get('arxiv_id'); merge falls back to defaults (screening_relevance='low', composite_score=0) on mismatch"
        - "Stage 1 expects top-level JSON key 'screenings'; Stage 2 expects 'evaluations' — wrong key silently yields empty results (known ISSUE-001)"
        - "Screening switches to chunked mode when papers_text + 2000 overhead > 150000 chars; chunk_size=25"
        - "Eval cache stores the merged post-LLM list (not the raw LLM response) and does not validate result quality before writing (known ISSUE-002)"
        - "Stage 1 screening cache key hashes abstracts[:200]; Stage 2 deep-eval cache key hashes abstracts[:500]"
    entry_points:
      - "python research/research_scout.py report --project <id>"
      - "python research/research_scout.py report --no-cache"
    function_names:
      - "evaluate_papers_for_project"
      - "_screen_papers"
      - "_screen_papers_chunked"
      - "_deep_evaluate_papers"
      - "suggest_directions"
      - "call_scout_llm"
      - "_lookup_by_id"
      - "_format_papers_for_screening"
      - "_format_papers_for_deep_eval"
      - "_screening_cache_key"
      - "_deep_eval_cache_key"
      - "_load_eval_cache"
      - "_save_eval_cache"
      - "run_evaluation_pipeline"
      - "extract_current_methods"
    notes: "Pipeline is documented as 'three-stage' in some headers but is effectively five-stage with --insight (Stage 4+5). docs/ecl/research-scout-pipeline.yaml documents both ISSUE-001 (silent LLM key mismatch) and ISSUE-002 (bad data cached) which are still present in evaluate.py."

  - feature: "Citation Impact Analysis"
    description: "For top-scoring papers, resolves arXiv/DOI to a Semantic Scholar paper and pulls forward citations + backward references, with an LLM influence analysis for sufficiently-cited papers. Also exposed as a standalone `citations` command."
    purpose: "Adds bibliometric context (who cites this, what it builds on, why it's popular, follow-up directions) so the researcher can gauge a paper's real-world impact beyond the abstract."
    implementation:
      approach: "analyze_citations() (evaluate.py) lazily imports research.apis.semantic_scholar.get_paper_by_id/get_paper_citations/get_paper_references, fetches up to 20 forward citations + 20 references, keeps top 10 of each for the report, and only runs the CITATION_IMPACT_PROMPT LLM call when citation count >= 5. The standalone cmd_citations (cli.py) reuses the same S2 API + prompt, printing forward/backward tables and influence analysis. A common.cache.DiskCache over CACHE_DIR backs S2 responses; S2 API key read from config 'semantic_scholar_api_key'."
      key_files:
        - "research/scout/evaluate.py"
        - "research/scout/cli.py"
        - "research/scout/config.py"
      constraints:
        - "LLM influence analysis only runs when total forward citations >= 5 (analyze_citations and cmd_citations both gate on >= 5)"
        - "Forward citations and references each fetched with limit=20; only top 10 retained in citation_analysis dict"
        - "Returns {} (skips paper) when paper_id is empty or the paper is not found in Semantic Scholar"
        - "Result attached to paper['citation_analysis']; output dict keys: total_forward_citations, total_references, top_citing_papers, top_references, influence_analysis"
        - "Citation LLM prompt receives abstract truncated to [:1000]"
        - "cmd_citations default top_n=10; S2 calls are serial per paper (CON-005), heavily rate-limited without an API key (known ISSUE-003)"
    entry_points:
      - "python research/research_scout.py citations <arxiv_id_or_doi>"
      - "python research/research_scout.py citations <id> --top-n 20"
    function_names:
      - "analyze_citations"
      - "cmd_citations"
      - "call_scout_llm"
      - "get_paper_by_id"
      - "get_paper_citations"
      - "get_paper_references"
    notes: "Depends on research/apis/semantic_scholar.py (not in scope here but imported lazily). CITATION_IMPACT_PROMPT is imported from research.prompts (the profiler package), not scout.prompts."

  - feature: "Insight & OpenReview Analysis (Stage 4+5)"
    description: "Opt-in (--insight) deep analysis of top-N papers: downloads full text for an LLM writing/publishability/knowledge breakdown (Stage 4), fetches OpenReview reviews for a consensus analysis (Stage 5), and synthesizes a cross-paper writing guide."
    purpose: "Helps the researcher learn how strong papers are written, why they get accepted, what reviewers focus on, and extract reusable techniques — turning discovery into actionable writing/method guidance."
    implementation:
      approach: "run_insight_analysis() (insight.py) takes the composite-sorted high_relevance papers, caps the count to min(top_n, top_papers_in_report, len), downloads full text via download_paper_fulltext (lazy research.apis.arxiv_client HTML-first/PDF-fallback for arXiv; best-effort HTML scrape for bioRxiv; degrade-to-abstract otherwise) truncated to MAX_FULLTEXT_CHARS, then calls analyze_paper_insight (INSIGHT_ANALYSIS_PROMPT for full text, INSIGHT_ABSTRACT_PROMPT for abstract-only). Stage 5 lazily constructs OpenReviewClient and analyze_review_consensus selects single/limited/full mode by reviewer count (1/2/3+). Per-paper results cached to INSIGHT_CACHE_DIR keyed by paper_id + abstract content hash. synthesize_writing_guide produces a 4-section cross-paper guide."
      key_files:
        - "research/scout/insight.py"
        - "research/scout/prompts.py"
        - "research/scout/config.py"
        - "research/scout/cli.py"
      constraints:
        - "Gated entirely behind --insight; only runs when high_papers is non-empty"
        - "Papers analyzed = min(top_n (default INSIGHT_TOP_N=3), top_papers_in_report (5), len(papers)); returns ([],{}) if <= 0"
        - "Full text truncated to MAX_FULLTEXT_CHARS = 40000"
        - "Full-text-vs-abstract branch threshold: fulltext used only when len(fulltext) > 500 (also bioRxiv scrape requires >500 chars to cache/return)"
        - "Review consensus mode by count: 0->{} skip, 1->'single', 2->'limited', 3+->'full'; review_count and mode stamped onto result"
        - "Insight cache key = SHA-256(paper_id + 16-char abstract content_hash); attaches paper['insight_analysis'] and paper['review_analysis']"
        - "OpenReview client created lazily; ImportError (openreview-py missing) or init failure -> skipped (None), reviews silently absent"
        - "Writing guide only synthesized from papers that produced insight_analysis or review_analysis"
    entry_points:
      - "python research/research_scout.py report --project <id> --insight"
      - "python research/research_scout.py report --insight --insight-top-n 5"
      - "python research/research_scout.py ask \"...\" --insight"
    function_names:
      - "run_insight_analysis"
      - "analyze_paper_insight"
      - "analyze_review_consensus"
      - "synthesize_writing_guide"
      - "download_paper_fulltext"
      - "_download_biorxiv_fulltext"
      - "_get_openreview_client"
      - "_format_reviews"
      - "_format_papers_for_guide"
      - "_insight_cache_key"
      - "_content_hash"
    notes: "CLAUDE.md states OpenReview fuzzy-match threshold 0.85 and excluded venues (AAAI/CVPR/ICCV/ECCV) live in research/apis/openreview_client.py (out of scope here). REVIEW_CONSENSUS_PROMPT/INSIGHT_* prompts are in scout/prompts.py as referenced."

  - feature: "Natural-Language Ask Command"
    description: "End-to-end natural-language query handler: an LLM parses free-text (often Chinese) into a structured, validated search plan, a temporary 'ask' project is created, search is routed by mode, then the standard evaluation + report pipeline runs."
    purpose: "Lets a user run an ad-hoc discovery+report run from a single sentence (e.g. find an author's recent work, a conference's papers, or a topic) without manually creating a project."
    implementation:
      approach: "cmd_ask (cli.py) calls parse_ask_intent (ask.py) -> ASK_INTENT_PROMPT -> call_scout_llm -> validate_ask_plan, which sanitizes fields, validates arXiv categories against _VALID_CATEGORY_RE, restricts search_mode to _VALID_SEARCH_MODES and sources to _VALID_SOURCES, and enforces minimum viability. create_project_from_query writes a timestamped status='ask' project (overview.md seeded from the LLM overview_summary). route_search dispatches by mode (author/conference/topic/journal/mixed), merging multi-search results deduped by paper_id; journal mode force-adds pubmed. The result flows through run_evaluation_pipeline + finalize_report. If no papers found, the temp project dir is rmtree'd."
      key_files:
        - "research/scout/ask.py"
        - "research/scout/cli.py"
        - "research/scout/project.py"
        - "research/scout/prompts.py"
      constraints:
        - "search_mode constrained to {topic, author, conference, journal, mixed}; invalid -> 'topic'"
        - "sources constrained to {arxiv, biorxiv, pubmed}; empty after filtering -> ['arxiv']"
        - "arxiv_categories validated against _VALID_CATEGORY_RE (full arXiv prefix set); invalid categories dropped with warning"
        - "ask plan lookback_days accepted only if int/float in 1..365 else defaults to 30 (intentionally wider than DEFAULT_LOOKBACK_DAYS=7)"
        - "validate_ask_plan raises ValueError when fundamentally unusable: author mode w/o author & no keywords; topic/journal mode w/o keywords; mixed mode w/o any of keywords/author/conference; author/conference modes fall back to topic if keywords exist"
        - "parse_ask_intent raises ValueError on non-dict result or parse_error after try_repair_result"
        - "ask projects use collision-safe ID ask-YYYYMMDD-HHMMSS-ffffff and status='ask'"
        - "route_search dedups merged results by paper_id (seen_ids set); journal mode appends 'pubmed' to sources if absent; conference search intentionally omits project keywords"
        - "Temp ask project directory is deleted (shutil.rmtree) when no papers are found"
    entry_points:
      - "python research/research_scout.py ask \"<natural language query>\""
      - "python research/research_scout.py ask \"...\" --deploy"
    function_names:
      - "cmd_ask"
      - "parse_ask_intent"
      - "validate_ask_plan"
      - "route_search"
      - "create_project_from_query"

  - feature: "Report Generation, Literature Notes & Hugo Deploy"
    description: "Assembles per-project evaluation results into a dated JSON + Markdown daily report (high-relevance tables, detailed analysis, citation impact, insight/review sections, writing guide, low-relevance reading log), appends notes to the project overview, and deploys bilingually to a Hugo site."
    purpose: "Produces the human-facing artifact of the pipeline and publishes it to the blog, while keeping each project's overview.md as a running literature log."
    implementation:
      approach: "generate_daily_report() (report.py) builds the JSON keyed by project, taking top_papers = high_relevance[:TOP_PAPERS_IN_REPORT]; generate_report_markdown() renders English-labeled sections. save_report writes <date>-research.json/.md via atomic_write. finalize_report (cli.py) ties generate->render->save and, on --deploy, calls generate_hugo_post (frontmatter + common.bilingual.write_bilingual to produce en + translated zh) then run_hugo_update. append_literature_note inserts top-3 papers into overview.md below a sentinel marker. cmd_deploy independently syncs *-research.md from reports dir into the Hugo research content dir, skipping already-deployed stems unless --force."
      key_files:
        - "research/scout/report.py"
        - "research/scout/cli.py"
        - "research/scout/config.py"
      constraints:
        - "Report top_papers capped at TOP_PAPERS_IN_REPORT = 5 (high_relevance[:top_n])"
        - "Reports written atomically as <date>-research.json and <date>-research.md under REPORTS_DIR (outputs/reports/research-scout/)"
        - "append_literature_note appends only when overview.md contains the marker '<!-- research_scout auto-append below -->' and limits to top_papers[:3]"
        - "generate_hugo_post deploys bilingually via write_bilingual under content section 'research'; deploy aborts if hugo_site path does not exist"
        - "cmd_deploy skips reports whose stem already exists in the Hugo research content dir unless --force; filenames must match <ISO-date>-research.md to parse the date"
        - "Hugo post frontmatter pins date at <date>T22:00:00-05:00 and draft:false; summary derived from first '## ' heading"
        - "Low-relevance papers rendered inside a collapsed <details> Literature Reading Log table"
    entry_points:
      - "python research/research_scout.py report --project <id> --deploy"
      - "python research/research_scout.py deploy [--date YYYY-MM-DD] [--force]"
    function_names:
      - "generate_daily_report"
      - "generate_report_markdown"
      - "save_report"
      - "generate_hugo_post"
      - "append_literature_note"
      - "render_insight_details"
      - "render_review_summary"
      - "generate_writing_guide_section"
      - "finalize_report"
      - "cmd_deploy"
      - "_truncate"
      - "_field"
    notes: "generate_report_markdown header comment says 'English labels, all 3 stages' but it also renders Stage 4 insight + Stage 5 review + writing-guide sections. DEFAULT_LANGUAGE in config.py is now 'zh' (matches CLAUDE.md's parameter table)."

  # ===== Research — Profiler, APIs & Citations =====

  - feature: "Researcher Profiling Pipeline"
    description: "Analyzes an academic researcher by fetching papers from ArXiv + Semantic Scholar, identifying paper awards via LLM, running an LLM trajectory analysis, and computing a 0-100 tier score. Supports fast and detailed (full-text) modes and BFS-recursive exploration of discovered students."
    purpose: "Systematically evaluate a researcher's academic trajectory, breakthrough works, and standing (Established Leader / Rising Star / Active / Early Career) for collaboration, hiring, or scouting decisions."
    implementation:
      approach: "analyze_researcher() runs a fixed 6-step pipeline per researcher: (1) ArXiv author search (<=100 papers), (2) three-tier Semantic Scholar resolution (author-id hint -> paper reverse-lookup -> name search), (3) LLM award identification, (4) optional full-text download in detailed mode, (5) LLM trajectory analysis (fast vs detailed prompt), (6) tier scoring. _select_papers_by_year merges S2 (primary) + ArXiv (enrichment) deduped by normalized title, caps 10 papers/year sorted by award weight then citations; _resort_after_awards re-sorts after awards assigned. run_analysis drives a BFS queue: depth>0 enqueues discovered students; affiliation/paper/author-id hints only apply at depth 0."
      key_files:
        - "research/analysis.py"
        - "research/scoring.py"
        - "research/models.py"
        - "research/prompts.py"
        - "research/llm.py"
      constraints:
        - "6-step pipeline order is fixed: ArXiv fetch -> S2 metrics -> award ID -> (detailed) full-text -> LLM trajectory -> tier score (analysis.py lines 189-311)"
        - "S2 author resolution is strictly tiered: author_id_hint first, then paper_hint reverse lookup, then name search fallback (analysis.py lines 196-209)"
        - "Papers deduped by lowercased/stripped title; S2 is primary source, ArXiv only enriches arxiv_id/pdf_url/categories/abstract (_select_papers_by_year)"
        - "Max 10 papers per year (max_per_year default), sorted award weight desc then citation_count desc; years iterated ascending"
        - "Award weight ordering: best_paper=4 > highlight=3 > spotlight=2 > oral=1; only these 4 award strings are valid (_AWARD_WEIGHT / _identify_awards valid_awards check)"
        - "Returns an empty ResearcherProfile with analysis.error='no_papers_found' and tier EARLY_CAREER if no papers from any source (analysis.py lines 227-241)"
        - "BFS dedup is case-insensitive on name (visited set of name.lower()); hints (affiliation/homepage/paper/author-id) only used at depth 0"
        - "detailed mode only downloads full text for papers with a non-empty arxiv_id"
    entry_points:
      - "python -m research analyze"
      - "python research/research_scout.py profile"
    function_names:
      - "analyze_researcher"
      - "run_analysis"
      - "_select_papers_by_year"
      - "_resort_after_awards"
      - "_identify_awards"
      - "_parse_batch_line"
      - "_normalize_name"
    notes: "research/CLAUDE.md describes research_scout.py as a monolithic ~2930-line file, but it is actually a 96-line deprecation shim re-exporting from scout/. The 'profile' subcommand is wired in research/scout/cli.py cmd_profile (out-of-scope file) which calls research.analysis.run_analysis. _parse_batch_line supports batch hint syntax (arxiv:/s2:/DOI/title) consumed by research/cli.py cmd_analyze --from-file."

  - feature: "Researcher Tier Scoring"
    description: "Computes a weighted 0-100 bibliometric score from researcher metrics and classifies into one of four tiers."
    purpose: "Provide a quantitative, reproducible ranking signal that distinguishes established leaders from early-career researchers."
    implementation:
      approach: "compute_tier_score() blends five normalized (0-1) sub-scores with default weights summing to 100: h-index 25, total_citations 20, recent_citations(5yr) 20, top_venue_ratio 20, career_stage 15. h-index and career use stepped thresholds; citations use log10 scaling; venue uses ratio*3 capped at 1.0. classify_tier() maps score to tier via thresholds. Both accept override dicts for weights/thresholds."
      key_files:
        - "research/scoring.py"
        - "research/models.py"
      constraints:
        - "Default weights: h_index 25, total_citations 20, recent_citations 20, top_venue_ratio 20, career_stage 15 (sum 100)"
        - "Tier thresholds: ESTABLISHED_LEADER >=75, RISING_STAR >=50, ACTIVE_RESEARCHER >=30, else EARLY_CAREER"
        - "Citation log scaling: total uses log10/5.0 (~100k -> 1.0), recent uses log10/4.7 (~50k -> 1.0), both clamped to 1.0"
        - "top_venue_ratio score = min(1.0, (top_venue_count/paper_count)*3.0) so >=33% top venues -> full score"
        - "Final score is round(score, 1); zero metrics yield 0 sub-scores without error"
        - "career_years derived from current year minus first_paper_year; stepped 1.0/0.8/0.6/0.4 at 15/10/6/3 years"
    function_names:
      - "compute_tier_score"
      - "classify_tier"

  - feature: "Student Discovery (Homepage + Co-authorship)"
    description: "Discovers a researcher's likely students/advisees from two sources: scraping their homepage/lab page (primary, LLM-extracted) and inferring from S2 co-authorship patterns (secondary), then merges and LLM-enriches the results."
    purpose: "Surface advisor-student/mentee relationships to enable recursive scouting of rising-star students and to enrich a researcher profile."
    implementation:
      approach: "discover_students() runs 4 phases: (1) homepage discovery via discover_students_from_homepage (URL discovery from S2 homepage field + LLM URL suggestion, SSRF-safe fetch, LLM student extraction), (2) co-authorship scoring via score_student_candidates (skipped if homepage already yielded >= max_students), (3) _merge_student_lists deduping by normalized name (overlaps tagged source='both', homepage data prioritized), (4) LLM enrichment of research_direction for coauthorship candidates. score_student_candidates weights signals: first-author-with-advisor-last 40%, PhD-period time concentration 25%, frequency 20%, recency 15%."
      key_files:
        - "research/homepage_discovery.py"
        - "research/student_discovery.py"
        - "research/analysis.py"
        - "research/apis/semantic_scholar.py"
        - "research/prompts.py"
      constraints:
        - "Homepage URL fetching is SSRF-guarded: only http/https schemes; DNS-resolved IPs rejected if private/loopback/link-local/reserved (_is_safe_url) — applied in both fetch_homepage and discover_homepage_urls"
        - "Homepage fetch limits: 2MB read, 15s timeout, extracted text truncated to 50000 chars; cached in api/homepage with 7-day TTL"
        - "Co-authorship candidate requires >=2 total collaborations (total<2 skipped) and composite score >= threshold (default 0.4)"
        - "Student status normalized to one of current/graduated/postdoc/unknown (invalid -> unknown)"
        - "Phase 2 (co-authorship) skipped when homepage students count >= max_students"
        - "Merge dedup key is normalized lowercased name; overlapping entries become source='both' with homepage fields kept and co-authorship stats copied in"
        - "Merged list sorted: 'both' first, then homepage, then coauthorship; secondarily by relationship_score desc; truncated to max_students"
        - "Strong student signal = first author (index 0) when advisor is last author (first_author_with_advisor_last)"
        - "LLM enrichment only fills research_direction when empty and only for candidates with coauthor_count>0"
        - "homepage text passed to LLM truncated to 30000 chars; pages <100 chars skipped"
    entry_points:
      - "python -m research analyze --depth 1"
      - "python research/research_scout.py profile --depth 1 --homepage <url>"
    function_names:
      - "discover_students"
      - "discover_students_from_homepage"
      - "discover_homepage_urls"
      - "fetch_homepage"
      - "extract_students_from_homepage"
      - "_is_safe_url"
      - "score_student_candidates"
      - "get_coauthor_data"
      - "_merge_student_lists"
      - "_HomepageTextExtractor"
    notes: "_is_safe_url performs DNS resolution (socket.getaddrinfo) and blocks all resolved IPs that are private/loopback/link-local/reserved — a genuine SSRF mitigation. get_coauthor_data lives in apis/semantic_scholar.py."

  - feature: "Semantic Scholar Client & Citation Graph"
    description: "Unified client over the Semantic Scholar Graph v1 API for author search/disambiguation, author metrics, author papers, co-authorship extraction, AND paper-level forward citations / backward references (citation graph) used by the scout citation-impact stage and the 'citations' CLI subcommand."
    purpose: "Provide reliable, deduplicated bibliometric data (h-index, citations, venues, papers) and co-author graphs as the primary data source for profiling."
    implementation:
      approach: "_s2_request() centralizes requests with optional x-api-key header and exponential backoff on HTTP 429 (5/10/20/40/60s, up to _MAX_S2_RETRIES then S2RateLimitError). search_author() fetches up to 5 candidates and disambiguates via _score_author_candidate (name match, affiliation match, log-scaled paper count, h-index). build_metrics() computes recent-5yr citations and top-venue counts against a mutable TOP_VENUES set. get_author_papers() pages in batches of <=500. get_coauthor_data() tallies collaboration stats and first-author-with-advisor-last signals."
      key_files:
        - "research/apis/semantic_scholar.py"
        - "research/apis/rate_limiter.py"
        - "research/models.py"
      constraints:
        - "429 backoff schedule is [5,10,20,40,60]s, capped at _MAX_S2_RETRIES=5; exhaustion raises S2RateLimitError"
        - "Author disambiguation weights bibliometrics over name: name match max 6, affiliation max 5, paperCount log-scaled max 8, hIndex max 6 (_score_author_candidate)"
        - "Single candidate is taken directly without scoring; multiple candidates ranked by score desc"
        - "build_metrics counts a paper as recent if year >= current_year-5, and as top-venue if any TOP_VENUES substring is in the lowercased venue"
        - "TOP_VENUES is a module-global mutable set seeded from DEFAULT_TOP_VENUES and replaceable via set_top_venues (lowercased)"
        - "get_author_papers pages with batch=min(limit,500), stopping when a short page returns or data empties; default limit 500"
        - "_names_match requires exact last-name match and initial-compatible first names (prevents Lee/Leek, Li/Eliana false positives)"
        - "All endpoints cached in api/semantic_scholar with S2_TTL = 7 days; rate limited via s2_limiter (10 req/s)"
    function_names:
      - "_s2_request"
      - "search_author"
      - "get_author_by_id"
      - "resolve_author_by_paper"
      - "get_author_papers"
      - "build_metrics"
      - "get_coauthor_data"
      - "_score_author_candidate"
      - "_names_match"
      - "set_top_venues"
    notes: "S2RateLimitError defined here. resolve_author_by_paper implements the Tier-2 paper-reverse-lookup used by analyze_researcher."

  - feature: "ArXiv API Client + Full-Text Extraction"
    description: "Searches ArXiv for papers by author and downloads full paper text, preferring the ArXiv HTML rendering and falling back to PDF extraction via PyMuPDF."
    purpose: "Supply preprint metadata (arxiv_id, pdf_url, categories) and clean full-text content needed for detailed-mode trajectory analysis."
    implementation:
      approach: "search_papers_by_author() uses the arxiv library (page_size 100, delay 3s, 3 retries) sorted by submitted date desc, mapping results into Paper objects. download_fulltext() tries _download_html_text (parsing arxiv.org/html/<id> via _ArxivHTMLTextExtractor) first; if the result is under 500 chars it falls back to _download_pdf_text which streams the PDF and extracts text with PyMuPDF (fitz). HTML/PDF results cached in api/pdfs with no TTL."
      key_files:
        - "research/apis/arxiv_client.py"
        - "research/apis/rate_limiter.py"
        - "research/models.py"
      constraints:
        - "Full text: HTML attempted first; PDF fallback only when extracted HTML text < 500 chars (download_fulltext)"
        - "HTML URL strips trailing version suffix (vN) via regex before requesting arxiv.org/html/<id>"
        - "Full-text cached in namespace api/pdfs with NO TTL (permanent until cache cleared)"
        - "PDF extraction requires PyMuPDF (fitz); ImportError returns empty string rather than crashing"
        - "Author search cached in api/arxiv with 7-day TTL; rate limited via arxiv_limiter (1 req/3s)"
        - "Search swallows per-result errors but re-raises if zero papers were collected"
        - "Both HTML and PDF downloads use 60s timeout; HTTP 404 on HTML treated as 'no HTML version' (info-level)"
    function_names:
      - "search_papers_by_author"
      - "download_fulltext"
      - "_download_html_text"
      - "_download_pdf_text"
      - "_ArxivHTMLTextExtractor"
    notes: "_HomepageTextExtractor in homepage_discovery.py explicitly follows this _ArxivHTMLTextExtractor pattern."

  - feature: "OpenReview Review Client"
    description: "Fetches peer reviews for a paper from OpenReview by fuzzy-matching its title against venue submissions, then extracting per-review rating/confidence/strengths/weaknesses (including meta-reviews)."
    purpose: "Provide reviewer-consensus signal for papers under the insight-analysis stage, covering OpenReview-hosted venues (ICLR/NeurIPS/ICML/COLM/TMLR)."
    implementation:
      approach: "OpenReviewClient wraps the openreview-py v2 API, defaulting to guest mode with optional env-var auth (OPENREVIEW_USERNAME/PASSWORD). search_submission resolves candidate venue IDs from VENUE_PATTERNS x SEARCH_YEARS, caches all venue submissions, and _fuzzy_match_title selects the best via difflib SequenceMatcher. fetch_reviews pulls all forum notes, identifies reviews by a rating (or recommendation) field, and unwraps OpenReview content values via _extract_value. fetch_paper_reviews is the high-level search+fetch entry."
      key_files:
        - "research/apis/openreview_client.py"
        - "research/apis/rate_limiter.py"
      constraints:
        - "Auth precedence: constructor args OR env vars (OPENREVIEW_USERNAME/PASSWORD); otherwise guest client"
        - "Missing openreview-py raises ImportError at construction"
        - "Title fuzzy match accepts only ratio >= 0.85 (difflib SequenceMatcher on normalized titles)"
        - "Title normalization lowercases, strips non-word punctuation, and collapses whitespace (_normalize_title)"
        - "Known venues limited to ICLR/NeurIPS/ICML/COLM/TMLR (VENUE_PATTERNS) across SEARCH_YEARS = 2023..2026"
        - "A note counts as a review only if it has a rating or recommendation field; notes with Meta_Review in the invitation get is_meta_review=True"
        - "Content fields unwrapped via _extract_value (handles {'value': ...} API-v2 shape)"
        - "Submissions and reviews cached in api/openreview with 7-day TTL; rate limited via openreview_limiter (2 req/s)"
        - "Client init failure degrades to self._client=None, making search/fetch return None/[] safely"
    function_names:
      - "OpenReviewClient"
      - "search_submission"
      - "fetch_reviews"
      - "fetch_paper_reviews"
      - "_init_client"
      - "_resolve_venues"
      - "_get_venue_submissions"
      - "_fuzzy_match_title"
      - "_normalize_title"
      - "_extract_value"
    notes: "CLAUDE.md says guest API is default with venues ICLR/NeurIPS/ICML, but the code's VENUE_PATTERNS also include COLM and TMLR; AAAI/CVPR/ICCV/ECCV are intentionally absent (different review systems)."

  - feature: "Token-Bucket Rate Limiting"
    description: "Thread-safe token-bucket limiter with shared per-API limiter instances for ArXiv, Semantic Scholar, web/homepage fetching, and OpenReview."
    purpose: "Respect each external API's rate policy and avoid bans across concurrent profiler/citation calls."
    implementation:
      approach: "RateLimiter maintains tokens refilled continuously at rate/per per second, guarded by a threading.Lock; acquire() busy-waits in 0.05s sleeps until a token is free. Four module-level singletons encode each API's policy."
      key_files:
        - "research/apis/rate_limiter.py"
      constraints:
        - "arxiv_limiter = 1 req / 3s; s2_limiter = 10 req / 1s; web_limiter = 1 req / 2s; openreview_limiter = 2 req / 1s"
        - "Token refill is continuous (elapsed * rate/per), capped at the bucket size 'rate'"
        - "acquire() blocks (busy-wait, 50ms sleep) until tokens >= 1.0, decrementing by exactly 1.0"
        - "Refill and token decrement are performed under a threading.Lock (thread-safe)"
    function_names:
      - "RateLimiter"
      - "acquire"
      - "_refill"

  - feature: "Profiler Data Models"
    description: "Dataclasses defining the profiler's domain objects: Paper, ResearcherMetrics, the ResearcherTier enum, StudentCandidate, and the aggregate ResearcherProfile, each with to_dict/from_dict round-trip serialization."
    purpose: "Provide a stable, serializable schema shared across API clients, scoring, discovery, and output rendering."
    implementation:
      approach: "Standard @dataclass definitions with field defaults; to_dict emits None for empty optional fields (full_text, award); from_dict tolerates missing keys (uses __dataclass_fields__ defaults). ResearcherTier is an Enum exposing label_cn/label_en properties."
      key_files:
        - "research/models.py"
      constraints:
        - "Paper.to_dict emits full_text and award as None when empty (not '')"
        - "ResearcherTier enum values: established_leader, rising_star, active_researcher, early_career — each with label_cn and label_en"
        - "StudentCandidate.source constrained by usage to homepage/coauthorship/both; status to current/graduated/postdoc/unknown"
        - "from_dict on ResearcherMetrics/StudentCandidate only copies keys present in the dict, keeping dataclass defaults otherwise"
        - "ResearcherProfile.from_dict reconstructs nested Paper/ResearcherMetrics/StudentCandidate lists and resolves tier via ResearcherTier(value)"
    function_names:
      - "Paper"
      - "ResearcherMetrics"
      - "ResearcherTier"
      - "StudentCandidate"
      - "ResearcherProfile"
      - "to_dict"
      - "from_dict"
      - "label_en"
      - "label_cn"

  - feature: "Profiler LLM Layer with Escalating JSON Repair"
    description: "Single-call LLM wrapper over common backends (claude_cli/anthropic/openai) with response caching, plus a JSON parser that escalates from non-LLM parsing to LLM-based repair (haiku -> sonnet -> opus)."
    purpose: "Give the profiler reliable structured JSON from LLMs despite malformed model output, while caching to avoid repeat cost."
    implementation:
      approach: "call_llm() hashes backend+model+prompt for a cache key (namespace 'llm'), checks cache unless no_cache, calls common.llm.call_llm_raw, and stores non-empty responses. parse_json_response() first tries common.json_utils.try_parse_json (stages 1-3: direct/code-block/brace-match), then loops repair models haiku->sonnet->opus, re-parsing each repair; on total failure it persists the raw text to a timestamped debug log and returns {}."
      key_files:
        - "research/llm.py"
        - "research/cache.py"
      constraints:
        - "Cache key = content_hash of 'backend:model:prompt'; cached under 'llm' namespace; bypassed when no_cache=True"
        - "Only non-empty responses are written to cache"
        - "JSON repair escalation order is fixed: haiku -> sonnet -> opus"
        - "Repair prompt is truncated to the first 5000 chars of the malformed text"
        - "On all-repair-failure, raw response saved to outputs/logs/research/json_repair_failed/<timestamp>.txt and {} returned"
        - "Default backend is claude_cli, default model sonnet"
    function_names:
      - "call_llm"
      - "parse_json_response"
      - "_save_failed_response"
    notes: "Delegates raw LLM dispatch and stages 1-3 JSON parsing to common/ (call_llm_raw, try_parse_json); this layer adds caching + profiler-specific LLM repair."

  - feature: "Profiler Output (JSON + Markdown + Hugo)"
    description: "Persists researcher profiles as JSON, renders Markdown analysis reports (metrics table, trajectory, breakthroughs, themes, inferred students, top-cited papers), deploys to a staged Hugo content/research/ section, and provides show/list CLI views."
    purpose: "Make profiling results durable, human-readable, and publishable to the Hugo blog."
    implementation:
      approach: "save_profile writes JSON via common.io.atomic_write; render_report builds Markdown via _render_report_lines (shared by deploy). deploy_to_hugo reuses the same body, derives a summary from the trajectory's first line, builds frontmatter (date from fetched_at, keywords = ['Research','Researcher Profile'] + first 3 themes), and writes through common.site_staging.write_site_content. show_profile/list_profiles read cached JSON for terminal display."
      key_files:
        - "research/output.py"
        - "common/io.py"
        - "common/site_staging.py"
      constraints:
        - "JSON and Markdown both written via atomic_write (temp-then-replace)"
        - "Filenames are sanitized: non-word chars stripped, spaces -> underscores, lowercased (_safe_filename)"
        - "Report student table layout switches: if any student has source data it shows Source/Status columns, else the co-authorship columns (has_source check)"
        - "Top papers section shows top 20 by citation_count desc"
        - "Hugo frontmatter keywords always start with 'Research' and 'Researcher Profile' then up to 3 research_themes; date falls back to 2026-01-01 if fetched_at empty"
        - "Hugo deploy targets the 'research' content section via resolve_site_content_dir/write_site_content"
        - "_load_profile returns None (with warning) on OSError/JSONDecodeError/KeyError/ValueError rather than raising"
    entry_points:
      - "python -m research show"
      - "python -m research list"
      - "python research/research_scout.py profile --deploy"
    function_names:
      - "save_profile"
      - "render_report"
      - "deploy_to_hugo"
      - "show_profile"
      - "list_profiles"
      - "_render_report_lines"
      - "_safe_filename"
      - "_load_profile"

  - feature: "Profiler CLI + Configuration"
    description: "Standalone argparse CLI (analyze/show/list/config) for the researcher profiler plus its config layer (~/.config/research/config.json) and output-path resolution into the unified outputs/ tree."
    purpose: "Give the profiler a self-contained entry point (`python -m research`) and a CLI>config>default resolution chain, independent of the scout config."
    implementation:
      approach: "cli.main() builds subparsers; cmd_analyze loads config, resolves paths via resolve_profiler_paths, builds a DiskCache, collects names from args and/or --from-file (parsed by _parse_batch_line, '#' comments skipped), resolves mode/depth/max_students/model from CLI-or-config, runs run_analysis, and optionally deploys to Hugo. config.py provides load/save/interactive_config_init/show_config and the two path resolvers. The --paper and --author-id hints are a mutually exclusive argparse group."
      key_files:
        - "research/cli.py"
        - "research/config.py"
      constraints:
        - "Config defaults: model=sonnet, default_mode=fast, default_depth=1, max_students=10, output_dir='', semantic_scholar_api_key=''"
        - "--paper and --author-id are mutually exclusive (argparse add_mutually_exclusive_group)"
        - "Param resolution: CLI flag > config value > hardcoded default (e.g. mode = args.mode or config['default_mode'])"
        - "--from-file skips blank lines and lines starting with '#'; each line parsed via _parse_batch_line into (name, paper_hint, author_id_hint)"
        - "resolve_profiler_paths: custom output_dir overrides all (profiles/reports/.cache under it); otherwise profiles->DATA_DIR/research-profiler/profiles, reports->REPORTS_DIR/research-profiler, cache->CACHE_DIR/research-profiler"
        - "interactive_config_init validates model in {sonnet,opus,haiku}, mode in {fast,detailed}, depth 0-3, max_students positive int"
        - "--deploy falls back to ../website when no hugo_site configured and skips deploy if that path is absent"
    entry_points:
      - "python -m research analyze"
      - "python -m research show"
      - "python -m research list"
      - "python -m research config --init"
    function_names:
      - "main"
      - "cmd_analyze"
      - "cmd_show"
      - "cmd_list"
      - "cmd_config"
      - "load_config"
      - "save_config"
      - "resolve_profiler_paths"
      - "resolve_output_dir"
      - "interactive_config_init"
    notes: "Profiler config (~/.config/research/config.json) is separate from scout config (~/.config/research_scout/config.json). research/cache.py is a 1-line backward-compat shim re-exporting common.cache.DiskCache (only exports DiskCache); new code should import from common.cache directly."

  # ===== Benchmark Suite =====

  - feature: "Hardware Detection And System Info"
    description: "Cross-platform detection of CPU model/cores/frequency, GPU vendor/model/memory/compute-capability across CUDA/MPS/XPU/OpenCL backends, plus OS/Python/torch/CUDA software versions, and a human-readable printout."
    purpose: "Captures the hardware/software environment so every benchmark row is attributable to a specific machine, and lets users inspect their system via --info."
    implementation:
      approach: "get_cpu_info() branches on platform.system(): Linux parses /proc/cpuinfo, Windows tries wmic -> PowerShell Win32_Processor -> registry ProcessorNameString -> %PROCESSOR_IDENTIFIER% in that fallback order, macOS uses sysctl. get_gpu_info() tries PyTorch (NVIDIA via cuda, Apple via mps, Intel via xpu) and only falls back to PyOpenCL when no torch GPUs found. get_system_info() aggregates cpu+gpus+software into one dict."
      key_files:
        - "benchmark/benchmark/detect.py"
        - "benchmark/benchmark/cli.py"
      constraints:
        - "Default cpu cores = os.cpu_count() or 1; default model 'Unknown CPU', frequency 'Unknown'"
        - "Windows CPU detection tries 4 methods in strict order, each guarded by 'if not cpu_name' so the first success wins"
        - "PyOpenCL fallback runs only when the torch path yields zero GPUs (if not gpus)"
        - "MPS memory is approximated as RAM/4 via psutil; 0 if psutil missing"
        - "Each subprocess detection call uses an explicit timeout (5-10s) and swallows all exceptions"
        - "software['cuda'] reported only when torch.cuda.is_available(), else 'N/A'"
    entry_points:
      - "python -m benchmark.cli --info"
    function_names:
      - "get_cpu_info"
      - "get_gpu_info"
      - "_detect_nvidia_gpus"
      - "_detect_apple_gpus"
      - "_detect_intel_xpu_gpus"
      - "_detect_opencl_gpus"
      - "get_system_info"
      - "print_system_info"

  - feature: "CPU FLOPS Benchmarking"
    description: "Measures CPU throughput via three workloads: a pure-Python scalar sqrt+add loop (single-core), a 1-thread NumPy BLAS GEMM (single-core BLAS), and a multi-threaded NumPy BLAS GEMM (all-cores)."
    purpose: "Quantifies both raw single-core scalar performance and BLAS-accelerated matrix performance across one and all cores for the leaderboard."
    implementation:
      approach: "Each benchmark subclasses BaseBenchmark and implements get_info/run_iteration/get_flops. RobustTimer warms up then calibrates 5 runs to estimate iteration count for the target duration, measures, and removes IQR outliers (1.5*IQR fences) before taking the median. FLOPS/sec = flops_per_iteration / median_time. Scalar FLOPS = 2*iterations (sqrt+add); GEMM FLOPS = 2*N^3*iterations. BLAS thread count is bounded with threadpoolctl.threadpool_limits when available."
      key_files:
        - "benchmark/benchmark/cpu.py"
        - "benchmark/benchmark/core.py"
      constraints:
        - "calculate_flops_scalar = 2 * iterations; calculate_flops_gemm = 2 * N^3 * iterations"
        - "CpuSingleCoreBenchmark.ITERATIONS = 10_000_000; default GEMM sizes 2048 (single-core BLAS) and 4096 (all-cores)"
        - "Matrices A,B are pre-generated as float32 in __init__ so allocation time is excluded from timing"
        - "RobustTimer removes outliers using IQR: lower=Q1-1.5*IQR, upper=Q3+1.5*IQR, then reports median over filtered times"
        - "flops_per_sec uses flops for exactly 1 iteration (self.get_flops(1)) divided by median time; guarded against median_time<=0"
        - "threadpool_limits applied only if HAS_THREADPOOLCTL else falls through to unbounded np.dot"
        - "Single-core BLAS forces limits=1; all-cores uses multiprocessing.cpu_count()"
    entry_points:
      - "python -m benchmark.cli --cpu-only"
      - "python -m benchmark.cli --duration 60"
    function_names:
      - "_cpu_loop"
      - "CpuSingleCoreBenchmark"
      - "CpuAllCoresBenchmark"
      - "CpuSingleCoreBLASBenchmark"
      - "run_all_cpu_benchmarks"
      - "BaseBenchmark.benchmark"
      - "RobustTimer.time"
      - "calculate_flops_scalar"
      - "calculate_flops_gemm"
      - "fmt_flops"

  - feature: "GPU Multi-Precision GEMM Benchmarking"
    description: "Runs matrix-multiply (A@B) benchmarks on every detected GPU device across all supported precisions (FP64/FP32/FP16/BF16, plus experimental FP8 on capable CUDA), auto-sizing matrices to GPU memory and recording GFLOPS per dtype."
    purpose: "Provides cross-vendor GPU performance numbers per precision so users can compare CUDA/MPS/XPU hardware on the leaderboard."
    implementation:
      approach: "GpuBenchmark detects cuda/mps/xpu backends, enumerates devices, and computes a memory-scaled matrix size (nearest power of 2 using ~1/10 of memory, clamped 256-131072). _get_supported_dtypes gates precisions by backend and compute capability. Per device+dtype it creates tensors, runs a support probe + warmup with explicit synchronize, calibrates iterations from --duration, then measures median time with a hard per-precision timeout. FLOPS = 2*N^3 / median_time. Errors and timeouts are captured as result fields rather than raised."
      key_files:
        - "benchmark/benchmark/gpu.py"
        - "benchmark/benchmark/core.py"
      constraints:
        - "GEMM FLOPS uses calculate_flops_gemm(matrix_size, 1) = 2*N^3 over median time"
        - "Matrix size derived from memory: N=sqrt(memory_bytes/12) (3 fp32 matrices), rounded to power of 2, clamped to [2^8, 2^17]; unknown memory -> 2048 default; class default MATRIX_SIZE=8192, ITERATIONS=50"
        - "Device synchronize is explicit per backend before timing: cuda.synchronize / mps.synchronize / xpu.synchronize"
        - "FP64 excluded on MPS; BF16 on CUDA requires compute capability major>=8; BF16 added for XPU; FP8_exp only on CUDA with cc>=8.9 and torch.float8_e4m3fn present"
        - "Per-precision hard timeout = 60 seconds; partial data kept if any iterations completed, else returns a timeout error result"
        - "All matmul/warmup/calibration failures return a result dict with 'error' and flops_per_sec=0 (never crash the run)"
        - "'no kernel image' errors are reported as 'dtype not supported on this GPU (upgrade PyTorch)'"
    entry_points:
      - "python -m benchmark.cli --gpu-only"
      - "python -m benchmark.cli --matrix-size 8192 --duration 60"
    function_names:
      - "GpuBenchmark"
      - "calculate_matrix_size_from_memory"
      - "_detect_backends"
      - "_get_all_devices"
      - "_get_supported_dtypes"
      - "_create_tensors"
      - "_synchronize"
      - "_benchmark_device_dtype"
      - "run_all"
      - "run_all_gpu_benchmarks"
    notes: "gpu.py defines its own _format_flops (drops KFLOPS) duplicating core.fmt_flops; iterations arg to run_all_gpu_benchmarks is accepted but unused (documented as kept for compatibility)."

  - feature: "CSV Results Accumulation (Append-Only)"
    description: "Flattens each benchmark result plus system info into a fixed 20-column row and appends it to a results CSV, never overwriting, so multi-hardware history accumulates over time."
    purpose: "Builds a self-growing dataset that the HTML report reads in full for leaderboards and comparisons across all hardware ever benchmarked."
    implementation:
      approach: "BenchmarkResults.add() merges system_info (cpu/gpus[0]/software) and the result into a row keyed by an ISO timestamp, rounding flops to GFLOPS (/1e9, 2dp) and median time (6dp). save() opens the CSV in 'a' mode and writes the header only when the file does not yet exist, then clears the in-memory buffer. CLI wires this when --no-save is absent."
      key_files:
        - "benchmark/benchmark/core.py"
        - "benchmark/benchmark/cli.py"
      constraints:
        - "CSV is append-only ('a' mode); header written only if the file did not previously exist (file_exists check)"
        - "flops_gflops stored as round(flops_per_sec/1e9, 2); time_seconds as round(median, 6)"
        - "Only the first GPU (gpus_info[0]) is recorded per row; missing fields default to 'N/A'/0/'Unknown'"
        - "Default CSV path resolves to outputs/data/benchmark/results.csv (via common.paths.DATA_DIR when no path given; CLI computes _PROJECT_ROOT two levels up)"
        - "self.results is cleared after each save() to avoid duplicate appends"
        - "--no-save runs benchmarks but constructs no BenchmarkResults and skips save"
    entry_points:
      - "python -m benchmark.cli"
      - "python -m benchmark.cli --output my_results.csv"
      - "python -m benchmark.cli --no-save"
    function_names:
      - "BenchmarkResults"
      - "BenchmarkResults.add"
      - "BenchmarkResults.save"
      - "BenchmarkResults._count_existing_rows"

  - feature: "Interactive HTML Leaderboard Report"
    description: "Reads the accumulated CSV and renders a single self-contained dark-themed HTML page with summary stats, CPU/GPU leaderboards, and Plotly bar charts (CPU comparison, GPU per-dtype FP32/FP16/BF16, per-precision)."
    purpose: "Turns raw CSV history into a shareable, interactive leaderboard that automatically reflects all hardware ever benchmarked."
    implementation:
      approach: "BenchmarkReport loads the CSV with pandas, coerces timestamp/flops, drops rows with invalid numeric/time values and 'Unknown' CPUs. Leaderboards group by model (and dtype/benchmark_type), take max flops per group, sort descending, and assign rank via cumcount+1. Charts are Plotly go.Figure objects rendered to HTML fragments and injected into a format-string template; Plotly JS is loaded from a CDN URL pinned to the installed plotly version."
      key_files:
        - "benchmark/benchmark/report.py"
        - "benchmark/benchmark/cli.py"
      constraints:
        - "Rows with NaN timestamp/flops_gflops are dropped; rows whose cpu_model contains 'Unknown' are filtered out before reporting"
        - "GPU sections filter to backend in {cuda, mps, xpu} AND flops_gflops>0; dtype 'N/A' skipped in GPU leaderboard"
        - "Leaderboard rank = groupby(...).cumcount()+1 after sorting by flops descending; only top-3 get rank-1/2/3 CSS classes"
        - "Plotly JS CDN pinned to get_plotlyjs_version() so the bundled JS matches plotly.py"
        - "Charts embedded via to_html(include_plotlyjs=False) with outer <div> stripped before injection into chart-container divs"
        - "Historical trend chart is intentionally disabled (create_trend_chart returns a placeholder annotation)"
        - "GPU comparison charts are emitted for fixed dtypes FP32, FP16, BF16; total_runs counts unique dates"
    entry_points:
      - "python -m benchmark.cli --report"
      - "python -m benchmark.cli --report-only --input-csv my_results.csv --report-output report.html"
    function_names:
      - "BenchmarkReport"
      - "generate_html"
      - "generate_report"
      - "generate_cpu_leaderboard"
      - "generate_gpu_leaderboard"
      - "create_cpu_comparison_chart"
      - "create_gpu_comparison_chart"
      - "create_precision_comparison_chart"
      - "create_trend_chart"
      - "_get_summary_stats"
      - "_plotly_cdn_url"
      - "_format_leaderboard_table"
    notes: "self.figures is type-hinted as 3-tuples (title, div_id, figure) but generate_html appends and unpacks 2-tuples (div_id, fig_html); stale hint, code works."

  - feature: "Hugo Report Deployment"
    description: "Stages the generated benchmark HTML report into the shared Hugo site (static asset + iframe wrapper page) and triggers a website rebuild/deploy."
    purpose: "Publishes the latest leaderboard to the public website with one flag, embedding the full HTML report inside the Hugo blog."
    implementation:
      approach: "deploy_report() validates the report file and Hugo site exist, then calls publish.stage_benchmark_report(), which copies the HTML to <hugo_site>/static/benchmark-report/report.html via common.site_staging.copy_site_static and writes the content/benchmark.md Hugo wrapper page (front matter + iframe) via write_site_content (stamped gadget_generated). run_hugo_update() then rebuilds/deploys. Deploy failures are caught and warned, never fatal."
      key_files:
        - "benchmark/benchmark/publish.py"
        - "benchmark/benchmark/cli.py"
      constraints:
        - "Deploy is skipped with a warning if the report file or Hugo site root does not exist"
        - "stage_benchmark_report raises FileNotFoundError if the report HTML is missing"
        - "Static report copied to relative path benchmark-report/report.html; wrapper written to benchmark.md"
        - "(2026-07) legacy-dir rmtree removed along with the outputs/site staging tree"
        - "Wrapper page embeds the report via an iframe pointing at /benchmark-report/report.html"
        - "With --deploy and --no-save and no pre-existing report, deploy is skipped (cannot regenerate); otherwise report is regenerated before staging"
        - "All deploy exceptions are caught in deploy_report and reported as warnings (return False)"
    entry_points:
      - "python -m benchmark.cli --report --deploy"
      - "python -m benchmark.cli --report-only --deploy"
    function_names:
      - "deploy_report"
      - "stage_benchmark_report"

  - feature: "Leaderboard Upload / Submission Relay"
    description: "After a saved benchmark run the CLI can upload the latest CSV row to a public relay (or GitHub repository_dispatch) via the submit_result.py helper, with interactive confirmation, auto-upload, or opt-out modes."
    purpose: "Lets users contribute their benchmark results to a crowdsourced public leaderboard without manual file handling."
    implementation:
      approach: "cli.run_upload() invokes scripts/submit_result.py as a subprocess with --input-csv/--relay-url/--timeout/--source-id. submit_result.py loads a CSV row (default last), coerces int/float fields, wraps it as {submission, source} JSON, and POSTs to the relay or to api.github.com .../dispatches with bearer auth. Relay URL resolves from --relay-url then BENCHMARK_RELAY_URL. Interactive default is an opt-in y/N prompt only when a relay is configured and stdin/stdout are TTYs."
      key_files:
        - "benchmark/benchmark/cli.py"
        - "benchmark/scripts/submit_result.py"
      constraints:
        - "Upload flow runs only after a saved run (skipped under --no-save) and never fails the benchmark run (subprocess errors -> warnings)"
        - "Mutually exclusive --upload / --no-upload; --no-upload disables the flow entirely"
        - "Interactive prompt requires both sys.stdin.isatty() and sys.stdout.isatty() and a configured relay URL; default answer is No (only 'y'/'yes' accept)"
        - "Relay URL precedence: --relay-url flag then BENCHMARK_RELAY_URL env var"
        - "submit_result coerces cpu_cores/matrix_size/iterations as int(float()), and gpu_memory_gb/flops_gflops/time_seconds as float; --row-index default -1 (last row)"
        - "Either --relay-url OR all of --github-owner/--github-repo/--github-token required (else SystemExit); GitHub dispatch uses event_type default 'benchmark_submission' with API version 2022-11-28"
        - "--dry-run prints the JSON payload and exits without sending; upload timeout default 20s"
        - "submitted_at_utc recorded via UTC ISO timestamp with microseconds stripped"
    entry_points:
      - "python -m benchmark.cli --upload --relay-url https://relay.example.com/submit"
      - "python -m benchmark.cli --no-upload"
      - "python scripts/submit_result.py --dry-run"
      - "python scripts/submit_result.py --github-owner ORG --github-repo REPO --github-token $TOKEN"
    function_names:
      - "run_upload"
      - "resolve_relay_url"
      - "prompt_upload"
      - "is_interactive"
      - "load_row_from_csv"
      - "load_row_from_json"
      - "coerce_row_types"
      - "post_json"
      - "utc_now_iso"
      - "main"
    notes: "CLAUDE.md documents a --ask-upload flag; it is defined in argparse but the main() interactive path only checks it to print a 'no relay configured' notice — the prompt itself fires whenever interactive + relay configured regardless of --ask-upload."

  - feature: "Community Submission Ingestion"
    description: "Validates, sanitizes, deduplicates, and appends queued NDJSON benchmark submissions into the results CSV, logging rejects and an ingest summary for the crowdsourced pipeline."
    purpose: "Safely merges untrusted community-submitted results into the shared leaderboard CSV while stripping PII and preventing duplicate entries."
    implementation:
      approach: "process() reads up to --max-pending NDJSON lines, extracts the submission (handling raw/submission/client_payload nesting), validates all 20 columns with typed range checks and backend/dtype/benchmark_type cross-rules, sanitizes free-text fields by regex-redacting emails/IPs/hostnames/user paths, computes a SHA-256 fingerprint over date+hardware+benchmark+result fields, skips fingerprints already in the CSV or seen in this batch, appends accepted rows (header only if new file), writes rejects to an NDJSON file, truncates the pending queue, and writes a JSON ingest log."
      key_files:
        - "benchmark/scripts/ingest_submissions.py"
      constraints:
        - "All 20 CSV_COLUMNS must be present or the submission is rejected with 'missing required fields'"
        - "backend must be in {cpu, cuda, mps, xpu, opencl, ocl}; dtype in the ALLOWED_DTYPES set; benchmark_type must be one of {gpu, cpu_single_core, cpu_single_core_blas, cpu_all_cores} or start with 'cpu_' and be non-empty"
        - "Cross-checks: cpu backend requires cpu_* benchmark_type; non-cpu backend cannot use cpu_* benchmark_type"
        - "Numeric ranges enforced: cpu_cores 1-2048, matrix_size 0-1_000_000, flops_gflops 1e-6..1e9, time_seconds 1e-6..3600, iterations 1..1e9, gpu_memory_gb 0..10000"
        - "PII redaction substitutes [redacted-email]/[redacted-ip]/[redacted-host] and user path -> \\1[redacted-user] on sanitized text fields"
        - "Dedup key = SHA-256 of JSON {date(=timestamp[:10]), cpu_model, cpu_cores, gpu_vendor, gpu_model, benchmark_type, backend, dtype, matrix_size, flops_gflops(2dp), iterations}; duplicate vs existing CSV fingerprints AND within-batch fingerprints both skipped"
        - "CSV append uses DictWriter(fieldnames=CSV_COLUMNS), header only when file is new (append-only)"
        - "Pending queue is truncated to empty after processing; timestamps normalized to naive UTC ISO (Z and tz-aware converted)"
        - "--max-pending must be >= 1 (else SystemExit); rejects appended (not overwritten) to rejected NDJSON"
    entry_points:
      - "python scripts/ingest_submissions.py --pending-file data/pending_submissions.ndjson --csv-path benchmark_results.csv"
    function_names:
      - "process"
      - "extract_submission"
      - "validate_submission"
      - "sanitize_text"
      - "normalize_text"
      - "fingerprint_row"
      - "load_existing_fingerprints"
      - "append_csv_rows"
      - "append_ndjson"
      - "read_pending"
      - "truncate_file"
      - "write_log"
      - "parse_timestamp"
      - "parse_int"
      - "parse_float"
      - "normalize_backend"
      - "normalize_dtype"
      - "normalize_cuda_version"
    notes: "Default --csv-path is the legacy root-level benchmark_results.csv (not outputs/data/benchmark/results.csv used by the CLI), matching CLAUDE.md's note about a separate submission-pipeline CSV path."

  # ===== Website Build Automation =====

  - feature: "Incremental Image Compression (JPEG to PNG)"
    description: "Compresses a single image with pngquant to base.png, transparently converting JPEG sources to PNG first. Invoked in parallel by update.sh on images newer than the .last_build timestamp."
    purpose: "Shrink site image payloads for faster page loads while enforcing the site-wide PNG-only convention (markdown links and update.sh rewrite .jpg/.jpeg to .png)."
    implementation:
      approach: "compress_with_pngquant() takes an input path: for .jpg/.jpeg it opens via PIL.Image and saves a temporary <base>_tmp.png, then runs `pngquant --quality=60-80 --output <base>.png --force --speed 1 <source>`. On JPEG success it deletes the original .jpg/.jpeg; the temp PNG is always cleaned in a finally block. Only .jpg/.jpeg/.png are accepted, others error out. update.sh selects files via `find ... -newer .last_build` and runs one python invocation per file backgrounded with `&` then `wait`, skipping entirely if pngquant is not installed."
      key_files:
        - "website/compress_image.py"
        - "website/update.sh"
      constraints:
        - "pngquant quality range hardcoded to 60-80 with --speed 1 and --force"
        - "output is always written to <base>.png (JPEG input is converted, not kept)"
        - "original .jpg/.jpeg is deleted only after successful pngquant run (is_jpeg flag)"
        - "temporary <base>_tmp.png removed in finally regardless of outcome"
        - "only .jpg/.jpeg/.png extensions accepted; others print error and return"
        - "incremental selection is by update.sh `find -newer .last_build`, not inside the script (the script compresses whatever file paths are passed)"
        - "compression skipped when pngquant binary is absent (Windows-safe)"
    entry_points:
      - "python compress_image.py <file> [file2 ...]"
    function_names:
      - "compress_with_pngquant"
      - "main"
    notes: "compress_image.py itself has no timestamp logic; the .last_build incremental filter lives in update.sh. quality_low/quality_high are function params but never overridden by callers."

  - feature: "Incremental Video Compression (720p HandBrake)"
    description: "Compresses a single video in place using HandBrakeCLI's Fast 720p30 preset with web optimization and no audio, reporting size/ratio/savings. Run in parallel by update.sh on videos newer than .last_build."
    purpose: "Reduce video file sizes for the static site while standardizing on 720p30, web-optimized, audio-stripped MP4 output."
    implementation:
      approach: "compress_video() writes to a tempfile.mkstemp(.mp4), runs `HandBrakeCLI -i <in> -o <tmp> -Z 'Fast 720p30' --optimize --audio none`, computes original vs new size, compression ratio (orig/new), and savings percentage (printed via fmt_bytes), then shutil.move()s the temp file over the original in place. The temp file is removed in a finally block if it still exists. update.sh runs it backgrounded per video; if compress_video.py is absent it falls back to a raw `HandBrakeCLI ... -Z 'Fast 1080p30' --optimize` invocation, and skips entirely when neither the script nor HandBrakeCLI exists."
      key_files:
        - "website/compress_video.py"
        - "website/update.sh"
      constraints:
        - "HandBrake preset hardcoded to 'Fast 720p30' with --optimize and --audio none (audio stripped)"
        - "output overwrites the original file in place via shutil.move (no separate output path)"
        - "requires exactly one CLI argument; exits 1 on wrong arg count or missing file"
        - "ratio computed as orig/new (inf if new size is 0); savings as (1 - new/orig)*100"
        - "temp mp4 cleaned in finally"
        - "update.sh fallback path uses 'Fast 1080p30' (not 720p) and does NOT strip audio, diverging from the script's 720p/no-audio invariant"
        - "video compression skipped when both script and HandBrakeCLI are absent"
    entry_points:
      - "python compress_video.py <input_video>"
    function_names:
      - "compress_video"
      - "fmt_bytes"
      - "main"
    notes: "Discrepancy: CLAUDE.md and the script enforce 720p30/no-audio, but update.sh's inline HandBrakeCLI fallback (when compress_video.py is missing) uses 'Fast 1080p30' and omits --audio none. compress_video.py has no .last_build awareness; incremental filtering is done by update.sh find -newer."

  - feature: "Incremental Bilingual Site Translation (state-tracked)"
    description: "Scans content roots for English/Chinese Hugo markdown pairs (foo.md / foo.zh.md), backfills missing counterparts, and re-translates only the side that changed since the last run, using a .translation_state.json file to avoid en<->zh ping-pong."
    purpose: "Keep both language versions of every page in sync during the build with minimal local-inference cost and no oscillation, the core pre-build translation step (update.sh Steps 1 and 3)."
    implementation:
      approach: "collect_pairs() walks each --root with rglob('*.md'), normalizes every file to a canonical en path key via canonical_en_path/canonical_zh_path, reads FileInfo (content, detected language, 32-char content_hash digest, mtime_ns) per file, and skips excluded paths and legacy .en.md files. load_state() reads .translation_state.json (resetting on version!=STATE_VERSION or unreadable JSON). plan_pair() decides per pair: if a valid pair (both files exist with matching languages) and no state entry, it bootstraps state without translating; if state exists, it diffs en_sha256/zh_sha256 to pick the changed side as source (newer_file breaks ties when both changed). Missing/inconsistent pairs pick a source via choose_source_from_state. build_operation() sets source/target langs and canonical paths. main() loads the engine only when operations exist, atomic_writes the canonical source then the translated target, updates the per-pair state entry (digests + last_source_lang + timestamp), and saves state via atomic_write. --full forces retranslation (source chosen from last_source_lang), --dry-run plans without loading the model."
      key_files:
        - "website/translate_site_batch.py"
        - "website/update.sh"
        - "common/translation.py"
        - "common/engine.py"
        - "common/io.py"
      constraints:
        - "state schema versioned by STATE_VERSION=1; mismatch or unreadable JSON resets to {version, pairs:{}}"
        - "content identity tracked by SHA-256 via content_hash(content, length=32), not mtime, for change detection"
        - "is_valid_pair requires both files present AND en_file.language=='en' AND zh_file.language=='zh'"
        - "ping-pong avoidance: when state exists and only one side's digest changed, that side is the translation source; both-changed falls back to newer_file by mtime_ns with a warning"
        - "legacy *.en.md files are skipped with a warning, never modified"
        - "state and all output files written via atomic_write (temp + replace)"
        - "engine is loaded lazily only if there are operations and unloaded in a finally block"
        - "model load failure is non-fatal: bootstraps state and returns 0, and update.sh wraps the whole phase so a nonzero exit only prints a warning"
        - "canonical_zh_path is en_stem + '.zh' + suffix; default/English shape has no suffix"
        - "--exclude paths (and their descendants via parents check) are skipped; since 2026-07 update.sh runs a single pass over content/ with NO excludes (complete bilingual pairs bootstrap/skip via the state file)"
    entry_points:
      - "python translate_site_batch.py --root <dir> --state-file .translation_state.json [--exclude <path>] [--full] [--dry-run]"
    function_names:
      - "collect_pairs"
      - "read_file_info"
      - "load_state"
      - "save_state"
      - "is_valid_pair"
      - "choose_source_from_state"
      - "plan_pair"
      - "build_operation"
      - "newer_file"
      - "canonical_en_path"
      - "canonical_zh_path"
      - "state_entry_for_pair"
      - "translate_document"
      - "main"
    notes: "STATE_FILE default is website/.translation_state.json. The DEFAULT_TRANSLATION_MODEL and create_engine/TranslationEngine come from common/engine.py (verified). Since the 2026-07 single-content-root migration, update.sh invokes this ONCE: Step 1 on content/ (generated + hand-written), no excludes."

  - feature: "Standalone Content Translation Tool"
    description: "CLI to translate individual Hugo markdown files or whole directories between English and Chinese, frontmatter-aware and skipping files already in the target language."
    purpose: "On-demand bilingual content creation outside the automated build loop (e.g. translating a new post or backfilling a section), complementing the incremental translate_site_batch pipeline."
    implementation:
      approach: "translate_file() reads the file, splits frontmatter via regex, detects body language with detect_language, and skips if already in target. _output_path() strips any .en/.zh stem suffix and emits <stem>.md for en or <stem>.<lang>.md otherwise. Special relocate case: translating a Chinese-content foo.md to en copies the original Chinese to foo.zh.md (atomic_write) first, then translates in place to foo.md; on translation RuntimeError it rolls back by unlinking the relocated zh file. translate_directory() globs *.md (or **/*.md with --recursive), filters out files whose stem already ends in .en/.zh and (by default) _index.md, then translates them inside a single create_engine() context manager. translate_markdown_document from common does the actual LLM work."
      key_files:
        - "website/translate_content.py"
        - "common/translation.py"
        - "common/engine.py"
        - "common/io.py"
      constraints:
        - "skips files whose detected source language already equals --to target"
        - "output naming strips existing .en/.zh stem suffix; English target drops the suffix entirely (<stem>.md)"
        - "Chinese-foo.md -> en relocation writes foo.zh.md first, then translates foo.md in place; rolls back (unlink) the zh file if translation raises RuntimeError"
        - "existing translation output is not overwritten (skips if out exists), except the in-place relocate case"
        - "directory mode is non-recursive unless --recursive; _index.md skipped unless --include-index; language-suffixed files (.en/.zh) excluded from sources"
        - "all writes go through atomic_write"
        - "--to choices restricted to en|zh"
        - "engine reused across a directory batch via create_engine context manager"
    entry_points:
      - "python translate_content.py <file_or_dir> --to <en|zh> [--recursive] [--dry-run] [--include-index] [--model <id>]"
    function_names:
      - "translate_file"
      - "translate_directory"
      - "_parse_frontmatter"
      - "_output_path"
      - "main"
    notes: "Not wired into update.sh (that uses translate_site_batch.py); this is the manual/batch tool described as FEAT-009 in docs/ecl/bilingual-website.yaml."

  - feature: "Pre-flight Readiness Check with Auto-Fix"
    description: "Pre-build validator over content files modified since .last_build that runs five tiered checks (uncompressed images, stale links, frontmatter validity, bilingual pair completeness, language correctness) and auto-repairs missing pairs and language mismatches via the translation engine."
    purpose: "Gate the Hugo build (update.sh Step 7) so blocking errors stop deploy while warnings and auto-fixable bilingual/language issues are surfaced or repaired automatically."
    implementation:
      approach: "main() computes `since` from .last_build mtime, gathers modified .md files (find_modified_files) and JPEG images (find_modified_images), and runs: check_images (WARN per remaining .jpg/.jpeg), check_stale_links (WARN per line matching ../../static), check_frontmatter (BLOCK on missing delimiters / YAML error / non-mapping / missing title), check_bilingual_pairs (FIX, detecting which slot the existing file fills and whether its content language requires a copy-to-correct-slot swap), and check_language (FIX when body or title language doesn't match the en/zh slot, only for bodies >= MIN_BODY_LENGTH=100). Issues are dataclasses with level/check/path/detail/extra. run_auto_fixes lazily loads the translation engine (create_engine + DEFAULT_TRANSLATION_MODEL), applies fix_pair_issues (shutil.copy2 to correct slot then translate, or translate to missing) and fix_language_issues (re-translate file in place to expected lang), then unloads in a finally. Exit codes: 1 if any BLOCK, 2 if only WARN, else 0."
      key_files:
        - "website/preflight_check.py"
        - "website/update.sh"
        - "common/translation.py"
        - "common/engine.py"
      constraints:
        - "only files newer than .last_build mtime are checked; files named ._* are ignored"
        - "tiered severity: BLOCK->exit 1 (frontmatter only), WARN->exit 2 (images/links/unreadable-pair), FIX->auto-repair (pairs + language)"
        - "frontmatter required to parse as a YAML mapping containing a 'title' key, else BLOCK"
        - "language checks skip bodies shorter than MIN_BODY_LENGTH=100 chars; title language only checked when title length > 5"
        - "stale-link detection matches regex ../../static; image check flags only .jpg/.jpeg"
        - ".zh files identified by stem ending in '.zh'; counterpart toggles the .zh suffix"
        - "bilingual-pair fix dedups via normalized min(path, partner) key so each pair handled once"
        - "auto-fix skipped entirely with --no-fix; engine unavailable (ImportError/exception) downgrades fixes to failed and is non-fatal"
        - "engine loaded only when FIX issues exist and always unloaded in finally"
        - "early return 0 when no modified .md files and no modified images"
    entry_points:
      - "python preflight_check.py [--content-dir content] [--image-dir static/images] [--timestamp-file .last_build] [--no-fix] [--verbose]"
    function_names:
      - "main"
      - "get_last_build_time"
      - "find_modified_files"
      - "find_modified_images"
      - "check_images"
      - "check_stale_links"
      - "check_frontmatter"
      - "check_bilingual_pairs"
      - "check_language"
      - "is_zh_file"
      - "counterpart_path"
      - "run_auto_fixes"
      - "fix_pair_issues"
      - "fix_language_issues"
      - "_load_translation_engine"
      - "_translate_full_document"
    notes: "update.sh Step 7 calls `python preflight_check.py` with no args and aborts the build on nonzero exit, so a WARN-only run (exit 2) under `set -e` will halt the build, not just frontmatter BLOCKs (exit 1). docs/ecl/website-preflight-check.yaml lists function names that differ slightly from the actual code (e.g. check_images(image_dir, timestamp_file) vs actual check_images(image_dir, since); fix_language vs fix_language_issues)."

  - feature: "Staging Content Sync (outputs/site to website) — RETIRED 2026-07"
    status: retired
    retired_date: "2026-07-03"
    retired_reason: "Single-content-root migration: website/sync_staging.py DELETED, outputs/site staging tree removed; deploy pipelines write directly into tools/website/content|static via common/site_staging.py (see 'Hugo Deployment and Generated-Content Writes'). Entry kept for audit trail only."
    description: "Copied auto-generated Hugo content and static assets from ../outputs/site into website/ before each build, with reverse bootstrap and legacy-path cleanup."
    purpose: "Bridge auto-generated content (daily/weekly/monthly journals, research, benchmark report/images) staged under outputs/site into the live Hugo tree (update.sh Step 2) without committing generated files into the website repo."
    implementation:
      approach: "MANAGED_PATHS lists (target_rel, source_rel, kind) tuples for the managed dirs/files. sync_managed_path() first calls bootstrap_source (reverse-copy target -> source when the staging source is missing but the target exists), then if source is missing removes a stale target and reports, otherwise removes the existing target and copy_fallback()s the source into place. copy_fallback always copies (never symlinks) because Hugo does not follow symlinks in content directories: dirs are recreated and copied child-by-child with shutil.copytree(dirs_exist_ok=True), files via shutil.copy2. main() first removes LEGACY_PATHS (old benchmark dirs in both site and staging) then syncs every managed path, returning 1 on the first exception."
      key_files:
        - "website/sync_staging.py"
        - "website/update.sh"
      constraints:
        - "STAGING_ROOT is fixed at <project root>/outputs/site relative to website/"
        - "always copies (no symlinks) since Hugo won't follow symlinks in content dirs (CLAUDE.md mentions symlink-preferred, but code only copies)"
        - "reverse bootstrap: if staging source missing but website target exists (and target is not itself a symlink), source is seeded from target"
        - "missing source with existing target -> target removed as stale; missing source and target -> reported 'missing'"
        - "existing target is always removed before re-copy (remove_path handles symlink/file/dir)"
        - "legacy benchmark paths in both SITE_ROOT and STAGING_ROOT are deleted up front"
        - "directory copies use copytree dirs_exist_ok=True; file copies use copy2 (preserves metadata)"
        - "main returns 1 (build abort under update.sh set -e) on any per-path exception"
    entry_points:
      - "python sync_staging.py"
    function_names:
      - "main"
      - "sync_managed_path"
      - "bootstrap_source"
      - "copy_fallback"
      - "remove_path"
    notes: "website/CLAUDE.md says sync 'prefers symlinks, falls back to copy on Windows', but the current code unconditionally copies (comment: Hugo does not follow symlinks) — the docs are stale on this point."

  # ===== Sync, MCP & Diagnostics =====

  - feature: "Rclone Data Synchronization"
    description: "Centralized push/pull/status/bootstrap CLI that syncs five data categories (summarize, website, research, test, backups) between the local gadget tree and an rclone remote such as Google Drive, with dry-run preview and optional config/token backup. 2026-07: website category maps tools/website/content|static (single Hugo content root, not outputs/site); research maps research-scout/research-profiler dirs; backups maps outputs/backups."
    purpose: "Keep generated outputs, reports, images, research caches, and personal website content in sync across multiple devices, and let a freshly cloned machine bootstrap itself with one command."
    implementation:
      approach: "argparse subcommands dispatch to cmd_push/cmd_pull/cmd_status/cmd_bootstrap/cmd_config. Two static maps drive sync: SYNC_DIRS (category -> [(local_rel, remote_subdir)]) synced as-is via 'rclone copy', and SYNC_FILES (loose files) which are grouped by remote parent dir, copied into a TemporaryDirectory staging area, then 'rclone copy'd as one call (pull reverses: download remote dir to temp, then distribute to local paths). get_remote() resolves the remote base from ~/.config/gadget/sync.json, falling back to deriving the parent of the summarize config's rclone_remote. run_rclone() shells out via subprocess with capture_output and a 600s default timeout, appending --dry-run when requested. bootstrap writes a minimal sync.json, verifies connectivity with 'rclone lsd', then pulls configs, optional tokens, and all data."
      key_files:
        - "sync.py"
      constraints:
        - "rclone_remote is required; get_remote() prints an error and sys.exit(1) if unset"
        - "Config is resolved CLI/bootstrap-write > ~/.config/gadget/sync.json > derived from summarize config's rclone_remote parent; result cached in module-global _config_cache (invalidated by setting _config_cache=None)"
        - "--category choices are restricted to the keys of SYNC_DIRS (summarize/website/research/test/backups)"
        - "push skips local dirs/files that do not exist ('[skip] ... 不存在'); pull mkdir(parents=True, exist_ok=True) the local target first"
        - "Loose-file sync groups files by remote parent directory and transfers a whole staging dir per group rather than per-file"
        - "find_rclone() prefers config rclone_path (if it is an existing file), else shutil.which('rclone'), else error + sys.exit(1)"
        - "bootstrap writes minimal {'rclone_remote': remote} sync.json BEFORE pulling, skips re-pulling sync.json itself, and exits if 'rclone lsd' returns nonzero or times out (30s)"
        - "tokens/ and config backup are opt-in only (--include-tokens / --include-config); bootstrap token pull is also opt-in"
        - "run_rclone returns False (not raising) on nonzero exit, timeout, or OSError so the run continues and tallies ok/fail counts"
        - "All user-facing strings are Chinese"
    entry_points:
      - "python sync.py push"
      - "python sync.py pull"
      - "python sync.py status"
      - "python sync.py bootstrap --remote gdrive:gadget"
      - "python sync.py config --init"
    function_names:
      - "main"
      - "cmd_push"
      - "cmd_pull"
      - "cmd_status"
      - "cmd_bootstrap"
      - "cmd_config"
      - "sync_dirs"
      - "sync_files"
      - "push_configs"
      - "push_tokens"
      - "load_config"
      - "get_remote"
      - "find_rclone"
      - "run_rclone"
    notes: "SYNC_DIRS/SYNC_FILES/BOOTSTRAP_CONFIGS are hardcoded path maps, not configurable. The summarize-config fallback can only derive the parent if the rclone_remote contains a '/'; otherwise it prints a warning and leaves rclone_remote unset."

  - feature: "MCP Server Integration (gadget-mcp)"
    description: "A declared console-script / MCP server entry point (gadget-mcp) intended to aggregate all gadget subsystems for Claude Code via FastMCP, wired up through .mcp.json and pyproject.toml."
    purpose: "Expose the toolkit's capabilities (summarize, research, benchmark, etc.) as MCP tools so Claude Code can invoke them directly."
    implementation:
      approach: "pyproject.toml [project.scripts] declares 'gadget-mcp = \"mcp_server:main\"' and [tool.setuptools] declares py-modules = [\"mcp_server\"]. .mcp.json registers an MCP server named 'gadget' whose command is the gadget-mcp console script with empty args. The base dependency 'mcp[cli]>=1.0.0' (FastMCP) is always installed."
      key_files:
        - "pyproject.toml"
        - ".mcp.json"
      constraints:
        - ".mcp.json registers server 'gadget' invoking command 'gadget-mcp' with args [] (relies on the installed console script being on PATH)"
        - "pyproject base dependencies include mcp[cli]>=1.0.0 regardless of optional extras"
        - "Entry point is mcp_server:main and module mcp_server is declared in py-modules"
    function_names: []
    notes: "DANGLING / MISSING: mcp_server.py does NOT exist at the repo root or anywhere in the tree (Glob for 'mcp_server*.py' and '**/mcp_server.py' returned no files; no mcp_server/ package directory; rg for 'mcp_server' across the repo found no references outside pyproject.toml and .mcp.json). Therefore 'pip install -e .' would declare a console script and py-module that cannot be imported, and the 'gadget-mcp' command / .mcp.json 'gadget' server are broken. The ECL overview (docs/ecl/gadget-features.yaml line 6) also describes mcp_server.py as the FastMCP aggregator, which is now stale. No FastMCP 'main' function or @mcp.tool definitions exist anywhere. mcp[cli] is a hard base dependency yet has no consumer in-repo."

  - feature: "Bilingual Content Language Audit & Fix"
    description: "A three-phase pipeline (SCAN -> AUDIT -> FIX) that detects language-consistency problems in paired English (.md) / Chinese (.zh.md) Hugo content, optionally has Claude review flagged files, and re-translates broken ones via the local translation engine."
    purpose: "Keep the bilingual Hugo blog consistent by catching untranslated, wrong-language, missing-counterpart, prompt-leaked, or YAML-broken files and repairing them automatically."
    implementation:
      approach: "scan_directory() rglobs *.md (skipping _index*), classifies each as en/zh by '.zh.md' in the name, and emits Issue records for: CJK ratio out of band (zh below 0.05, en above 0.05), missing zh/en counterparts (matched via a normalized key where '.zh.md' -> '.md'), YAML frontmatter with nested unescaped double quotes, and translation prompt leaks (marker substrings in the first 600 chars). Phase 2 audit_issues() sends a preview (first 1500 chars) to call_llm_raw with model='haiku', parses a single JSON verdict (retranslate|ok|manual), defaulting to 'retranslate' on failure. Phase 3 fix_issues() re-translates retranslate/missing/prompt-leak issues via translate_markdown_document() using a lazily loaded, shared engine (_get_engine/_close_engine), and repairs yaml_error issues by switching outer double quotes to single quotes (stripping ** bold markers). main() defaults to scan-only when no phase flag given and scans tools/website/content (the single Hugo content root) by default."
      key_files:
        - "scripts/audit_content_languages.py"
      constraints:
        - "CJK_LOW_THRESHOLD and CJK_HIGH_THRESHOLD are both 0.05; BODY_MIN_LENGTH=50 skips short bodies from ratio checks"
        - "_index* files are skipped during scan"
        - "Body is taken as the text after the second '---' split (frontmatter stripped); cjk ratio counts U+4E00..U+9FFF over total chars"
        - "Counterpart matching uses a normalized key (rel with '.zh.md' replaced by '.md')"
        - "Audit only runs for kinds zh_low_cjk/en_high_cjk/prompt_leak; verdict JSON is extracted with regex and defaults to 'manual' if unparseable, 'retranslate' on call exception"
        - "Fix targets issues with audit_verdict=='retranslate' OR kind in (missing_zh, missing_en, yaml_error); skips when the source counterpart file does not exist"
        - "YAML fix only triggers on the regex pattern key: \"...\" containing an inner double quote, and strips ** before rewriting with single quotes"
        - "Translation engine is loaded lazily once and always unloaded in a finally block after the fix phase"
        - "main() returns exit code 1 if any issues were found, else 0; defaults to --scan when no phase flag passed"
        - "Default LLM backend is claude_cli (--api choices: claude_cli/anthropic/openai)"
    entry_points:
      - "python scripts/audit_content_languages.py --scan"
      - "python scripts/audit_content_languages.py --scan --audit"
      - "python scripts/audit_content_languages.py --fix"
      - "python scripts/audit_content_languages.py --fix --dry-run"
    function_names:
      - "main"
      - "scan_directory"
      - "audit_issues"
      - "fix_issues"
      - "_fix_yaml_quotes"
      - "print_report"
      - "_cjk_ratio"
      - "_has_prompt_leak"
      - "_check_yaml_frontmatter"
      - "_extract_body"
      - "_extract_frontmatter"
      - "_zh_counterpart"
      - "_en_counterpart"
      - "_get_engine"
      - "_close_engine"
    notes: "Docstring claims Phase 3 'FIX' re-translates 'via Ollama', but the code actually uses common.engine.create_engine() (local vLLM/transformers engine), so the Ollama reference is stale. CJK_LOW_THRESHOLD == CJK_HIGH_THRESHOLD == 0.05 means a file at exactly 0.05 ratio falls in neither branch."

  - feature: "Report File Language Normalization"
    description: "Batch utility that fixes misnamed summarize report files: renames Chinese-content .md files to .zh.md and (re)generates the English .md by translating the .zh.md counterpart, including buggy/prompt-leaked translations."
    purpose: "Repair historically misnamed or mistranslated summary reports so each report has a correct English .md and Chinese .zh.md pair."
    implementation:
      approach: "scan_and_fix() iterates a directory's *.md files: any non-.zh.md whose first line exceeds a 0.05 CJK ratio (detect_chinese) is renamed to its .zh.md counterpart (weekly/monthly-aware naming). Then for each *.zh.md it computes the English name and translates zh->en when the English file is missing, contains leaked prompt text (is_buggy_translation), or is still Chinese. Translation uses translate_markdown_document with a lazily loaded shared engine and atomic_write for the output. main() defaults to scanning outputs/reports/summarize and summarize/reports."
      key_files:
        - "scripts/fix_report_languages.py"
      constraints:
        - "detect_chinese only inspects the FIRST line and uses a 0.05 CJK-ratio threshold"
        - "is_buggy_translation checks the first 500 chars for '---BEGIN---', 'ONLY translate:', or 'frontmatter delimiter'"
        - "_zh_counterpart special-cases '-monthly.md' and '-weekly.md' suffixes, else uses .with_suffix('.zh.md')"
        - "English output is written via atomic_write (temp-file-then-rename)"
        - "Re-translation triggers when the English file is missing, buggy, or still detected as Chinese"
        - "Engine is loaded lazily once and unloaded once at end of main()"
        - "dry-run prints intended renames/translations without modifying files"
    entry_points:
      - "python scripts/fix_report_languages.py --dry-run"
      - "python scripts/fix_report_languages.py"
      - "python scripts/fix_report_languages.py --dir outputs/reports/summarize"
    function_names:
      - "main"
      - "scan_and_fix"
      - "translate_zh_to_en"
      - "detect_chinese"
      - "is_buggy_translation"
      - "_zh_counterpart"
      - "_get_engine"
      - "_close_engine"
    notes: "Overlaps heavily with scripts/audit_content_languages.py (both detect Chinese via CJK ratio, both fix via translate_markdown_document) but this one is narrower: single-line detection, summarize-report-specific naming, and no Claude audit phase. Likely a precursor/companion to the more general audit script."

  - feature: "Translation Engine Profiler"
    description: "Standalone diagnostic script that profiles the local translation engine's tokenization, generation, greedy-vs-sampling cost, and throughput across batch sizes, while polling nvidia-smi for live GPU utilization and power draw."
    purpose: "Find the GPU-utilization bottleneck and optimal batch size for the local translation pipeline (it documents that per-document model load/unload wastes GPU time)."
    implementation:
      approach: "main() loads an engine via common.engine.create_engine(), warms up, then runs staged profiles: profile_tokenization (measures padding waste / padded seq length), profile_generation (times model.generate and computes tok/s), profile_greedy_vs_sampling (compares do_sample True/False overhead), and profile_batch_sizes (sweeps 1..128, breaking on CUDA OOM). A GPUMonitor background thread polls nvidia-smi every interval and summarizes avg/max GPU util, mem util, and power vs cap. Sampling params come from SAMPLING_DEFAULTS; prompts are synthesized via make_test_prompts using build_translation_prompt."
      key_files:
        - "profile_translation.py"
      constraints:
        - "Requires CUDA + nvidia-smi: uses torch.cuda.synchronize, torch.cuda.memory_allocated, get_device_properties(0), and subprocess nvidia-smi polling"
        - "Batch-size sweep is [1,4,8,16,32,64,128] and breaks the loop on RuntimeError containing 'out of memory' (calls torch.cuda.empty_cache first)"
        - "Reaches into engine internals (_tokenizer, _model) and excludes 'token_type_ids' when moving inputs to device"
        - "Token counts exclude pad_token_id positions when computing generated tokens"
        - "GPUMonitor swallows all polling exceptions and joins its daemon thread on stop()"
    entry_points:
      - "python profile_translation.py"
    function_names:
      - "main"
      - "make_test_prompts"
      - "profile_tokenization"
      - "profile_generation"
      - "profile_greedy_vs_sampling"
      - "profile_batch_sizes"
      - "GPUMonitor"
    notes: "Developer profiling/diagnostic tool, not part of any CLI surface or pyproject entry point; depends on engine private attributes (_tokenizer, _model) so it is coupled to common/engine.py internals."

  - feature: "Attention Backend Diagnostic"
    description: "Tiny standalone script that reports the active PyTorch SDP attention backends and tries loading the HY-MT translation model with flash_attention_2 and sdpa to see which attention implementation works on the current machine."
    purpose: "Diagnose whether flash-attention / SDPA / cuDNN attention are available before relying on them in the translation pipeline."
