  - feature: "Project-Based Research Scout CLI"
    description: "Argparse CLI (init/ask/list/search/report/profile/citations/deploy/config) over scout/, with research_scout.py as a deprecation shim. Config is the research_scout section of repo-root config.json, merged with research (scout keys win)."
    purpose: "Project-scoped paper discovery with one CLI and one config file."
    implementation:
      approach: "scout/cli.py dispatches to cmd_*; resolve_param is CLI > project.json > merged config > hardcoded. --api omitted → config default_api → ollama. python -m research.scout is the supported entry; research_scout.py warns and re-exports."
      key_files:
