  - feature: "Rclone Data Synchronization"
    description: "scripts/sync.py push/pull/status/bootstrap/config plus a special --category dag that builds an encrypted DAG site from ../ai-companion and triggers website update. Categories: summarize, website, research, benchmark, backups. Pre-2026-08 alias test still maps to benchmark."
    purpose: "Cross-device data sync against one rclone remote; new machines bootstrap from that remote."
    implementation:
      approach: "sync section of repo-root config.json (rclone_remote, rclone_path). SYNC_DIRS maps local trees; SYNC_FILES staged then copied. bootstrap writes a minimal sync section, rclone lsd, pulls remote config/config.json → local config.json, optional tokens, then all data. dag is not GDrive sync: npx tsx ../ai-companion/scripts/build-dag-site.ts stage (STATICRYPT_PASSWORD) then update.sh."
