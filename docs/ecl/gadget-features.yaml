    function_names:
      - "BenchmarkReport"
      - "generate_report"

  - feature: "Hugo Report Deployment"
    description: "Copies report.html into tools/website/static/benchmark-report/ and writes content/benchmark.md (iframe wrapper, gadget_generated), then run_hugo_update."
