baseURL: https://tzj2006.github.io/
relativeURLs: false
canonifyURLs: true
title: TzJ's Net
theme:
  - PaperMod

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: English
    languageCode: en-us
    weight: 1
    params:
      description: "TzJ's personal blog about programming, research, and things learned along the way."
      homeInfoParams:
        Title: "Hi, I'm TzJ."
        Content: "Notes on programming, research, and things I learn along the way. A place to keep experiments, questions, and ideas."
  zh:
    languageName: 中文
    languageCode: zh-cn
    weight: 2
    params:
      description: "TzJ 的个人博客，记录编程、研究与学习途中的思考。"
      homeInfoParams:
        Title: "你好，我是 TzJ。"
        Content: "在这里记录编程、研究与学习途中的思考。写下做过的实验、遇到的问题，以及慢慢想清楚的事。"
    menu:
      main:
        - identifier: search
          name: 搜索
          url: /search/
          weight: 10
        - identifier: bugJournal
          name: 工作日志
          url: /bugjournal/daily/
          weight: 20
        - identifier: bugJournal-daily
          parent: bugJournal
          name: 日报
          url: /bugjournal/daily/
          weight: 21
        - identifier: bugJournal-weekly
          parent: bugJournal
          name: 周报
          url: /bugjournal/weekly/
          weight: 22
        - identifier: bugJournal-monthly
          parent: bugJournal
          name: 月报
          url: /bugjournal/monthly/
          weight: 23
        - identifier: leetcode
          name: 算法笔记
          url: /leetcode/
          weight: 30
        - identifier: posts
          name: 博文
          url: /posts/
          weight: 5
        - identifier: benchmark
          name: 性能测试
          url: /benchmark/
          weight: 40

markup:
  highlight:
    noClasses: false
    guessSyntax: true
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - '$$'
              - '$$'
            - - '\['
              - '\]'
          inline:
            - - '$'
              - '$'
            - - '\('
              - '\)'

# MathJax only where needed: leetcode uses $...$ heavily; bugJournal
# usage cards contain bare $cost amounts that would collide with $ delimiters.
cascade:
  - _target:
      path: /posts/**
    params:
      ShowToc: true
      ShowPostNavLinks: true
  - _target:
      path: /leetcode/**
    params:
      math: true

menu:
  main:
    - identifier: search
      name: Search
      url: /search/
      weight: 10
    - identifier: bugJournal
      name: bugJournal
      url: /bugjournal/daily/
      weight: 20
    - identifier: bugJournal-daily
      parent: bugJournal
      name: Daily
      url: /bugjournal/daily/
      weight: 21
    - identifier: bugJournal-weekly
      parent: bugJournal
      name: Weekly
      url: /bugjournal/weekly/
      weight: 22
    - identifier: bugJournal-monthly
      parent: bugJournal
      name: Monthly
      url: /bugjournal/monthly/
      weight: 23
    - identifier: leetcode
      name: leetcode
      url: /leetcode/
      weight: 30
    - identifier: posts
      name: Blog
      url: /posts/
      weight: 5
    - identifier: benchmark
      name: benchmark
      url: /benchmark/
      weight: 40

params:
  label:
    text: "TzJ's Net"
  ShowCodeCopyButtons: true
  ShowBreadCrumbs: true
  ShowReadingTime: true
  ShowBusuanzi: true
  # Per-page/section via cascade or front matter `math: true` (see cascade above).
  # Keep false site-wide so bugJournal `$1.23` cost strings are not treated as math.
  math: false
  mathjax: true
  mainSections:
    - posts
  defaultTheme: light
  disableThemeToggle: false
  displayFullLangName: true
  assets:
    favicon: "/images/icon.png"
    favicon16x16: "/images/icon.png"
    favicon32x32: "/images/icon.png"
  fuseOpts:
    isCaseSensitive: false
    includeMatches: true
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  socialIcons:
    - name: github
      url: "https://github.com/tzj2006"
    - name: googlescholar
      url: "https://scholar.google.com/citations?user=Cbmd1GIAAAAJ"
    - name: leetcode
      url: "https://leetcode.com/u/tzj2006/"
    - name: rss
      url: "index.xml"

  busuanzi:
    enable: true

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search
