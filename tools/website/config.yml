baseURL: https://tzj2006.github.io/
relativeURLs: false
canonifyURLs: true
title: TzJ's Net
theme:
  - PaperMod

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: English
    languageCode: en-us
    weight: 1
    params:
      description: "TzJ's personal blog about programming, research, and things learned along the way."
      homeInfoParams:
        Title: "Hi, I'm TzJ."
        Content: "Notes on programming, research, and things I learn along the way. A place to keep experiments, questions, and ideas."
  zh:
    languageName: 中文
    languageCode: zh-cn
    weight: 2
    params:
      description: "TzJ 的个人博客，记录编程、研究与学习途中的思考。"
      homeInfoParams:
        Title: "你好，我是 TzJ。"
        Content: "在这里记录编程、研究与学习途中的思考。写下做过的实验、遇到的问题，以及慢慢想清楚的事。"
    menu:
      main:
        - identifier: projects
          name: 研究与项目
          url: /projects/
          weight: 10
        - identifier: posts
          name: 文章
          url: /posts/
          weight: 20
        - identifier: library
          name: 资料归档
          url: /library/
          weight: 30
        - identifier: about
          name: 关于我
          url: /resume/
          weight: 40
        - identifier: search
          name: 搜索
          url: /search/
          weight: 50

markup:
  highlight:
    noClasses: false
    guessSyntax: true
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - '$$'
              - '$$'
            - - '\['
              - '\]'
          inline:
            - - '\('
              - '\)'

# Math is rendered at build time; use \(…\), \[...\] or $$...$$.
cascade:
  - _target:
      path: /posts/**
    params:
      ShowToc: true
      ShowPostNavLinks: true

menu:
  main:
    - identifier: projects
      name: Research
      url: /projects/
      weight: 10
    - identifier: posts
      name: Writing
      url: /posts/
      weight: 20
    - identifier: library
      name: Library
      url: /library/
      weight: 30
    - identifier: about
      name: About
      url: /resume/
      weight: 40
    - identifier: search
      name: Search
      url: /search/
      weight: 50

params:
  label:
    text: "TzJ's Net"
  ShowCodeCopyButtons: true
  ShowBreadCrumbs: true
  ShowReadingTime: true
  ShowBusuanzi: true
  # Per-page/section via cascade or front matter `math: true` (see cascade above).
  # Keep false site-wide so bugJournal `$1.23` cost strings are not treated as math.
  math: false
  mathjax: true
  mainSections:
    - posts
  defaultTheme: auto
  disableThemeToggle: false
  displayFullLangName: true
  assets:
    favicon: "/images/icon.png"
    favicon16x16: "/images/icon.png"
    favicon32x32: "/images/icon.png"
  fuseOpts:
    isCaseSensitive: false
    includeMatches: true
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  socialIcons:
    - name: github
      url: "https://github.com/tzj2006"
    - name: googlescholar
      url: "https://scholar.google.com/citations?user=Cbmd1GIAAAAJ"
    - name: leetcode
      url: "https://leetcode.com/u/tzj2006/"
    - name: rss
      url: "index.xml"

  busuanzi:
    enable: true

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search
