{{- if eq (lower .Section) "bugjournal" }}

  🤖 本文由 AI 根据对话记录自动生成，可能存在错误。
  {{- else }}
  🤖 This entry was generated by AI from conversation logs and may contain errors.
  {{- end }}

<style>
  .ai-generated-claim {
    margin-top: 2em;
    padding-top: 1em;

    color: var(--secondary);
  }
</style>
