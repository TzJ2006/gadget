{{- if (not site.Params.disableLangToggle) }}
<script>
(function() {
    var el = document.getElementById("lang-toggle");
    if (!el) return;
    el.addEventListener("click", function() {
        var current = this.getAttribute("data-current-lang");
        var url = this.getAttribute("data-translation-url");
        var newLang = (current === "en") ? "zh" : "en";
        try { localStorage.setItem("pref-lang", newLang); } catch(e) {}
        if (url) {
            window.location.href = url;
        } else {
            window.location.href = window.location.origin + (newLang === "zh" ? "/zh/" : "/");
        }
    });
})();
</script>
{{- end }}
