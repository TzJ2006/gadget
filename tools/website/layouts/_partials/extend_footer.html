{{- if (not site.Params.disableLangToggle) }}
<script>
(function() {
    var menu = document.querySelector(".lang-menu");
    if (!menu) return;
    menu.addEventListener("click", function(e) {
        var a = e.target.closest("a");
        if (!a) return;
        var current = document.documentElement.lang.split("-")[0];
        var newLang = (current === "en") ? "zh" : "en";
        try { localStorage.setItem("pref-lang", newLang); } catch (err) {}
    });
})();
</script>
{{- end }}
