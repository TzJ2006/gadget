{{- if (not site.Params.disableLangToggle) }}
<script>
(function() {
    try { var stored = localStorage.getItem("pref-lang"); } catch(e) { return; }
    if (!stored) return;
    var current = document.documentElement.lang.split("-")[0];
    if (stored === current) return;
    var alt = document.querySelector('link[rel="alternate"][hreflang="' + stored + '"]');
    if (alt && alt.href && alt.href !== window.location.href) window.location.replace(alt.href);
})();
</script>
{{- end }}
{{- if .Param "math" }}
<script>
  MathJax = {
    tex: {
      displayMath: [['\\[', '\\]'], ['$$', '$$']],
      inlineMath: [['\\(', '\\)'], ['$', '$']]
    },
    loader: {
      load: ['ui/safe']
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
{{- end }}
