[project]
name = "gadget"
version = "0.1.0"
description = "Toolkit: AI conversation summarization, CPU/GPU benchmarking, arXiv paper discovery"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
summarize = ["anthropic>=0.18.0", "openai>=1.0.0"]
research = ["arxiv>=2.0.0", "anthropic>=0.18.0", "openai>=1.0.0"]
benchmark = ["torch>=2.0.0", "numpy>=1.24.0", "pandas>=2.0.0", "plotly>=5.18.0", "tqdm>=4.65.0"]
translation = ["torch>=2.0.0", "transformers>=4.40.0,<5.0.0"]
translation-gguf = ["llama-cpp-python>=0.2.0", "huggingface-hub>=0.20.0"]
translator = ["gradio>=4.0.0", "gadget[translation-gguf]"]
website = ["Pillow>=10.0.0", "gadget[translation]"]
all = ["gadget[summarize,research,benchmark,website]"]

[tool.setuptools]
package-dir = {"summarize" = "tools/summarize", "research" = "tools/research", "translator" = "tools/translator", "benchmark" = "tools/benchmark/benchmark"}
packages = ["common", "summarize", "research", "research.apis", "research.scout", "translator", "benchmark"]
